name: 'Sinh tệp biến môi trường cho React Native'
description: >
  Ghi tệp `.env` mà react-native-dotenv nướng vào bundle. KHÔNG có bước này thì
  mọi biến `@env` là `undefined` và app rơi về đường lui localhost — im lặng.

# ── VÌ SAO CÓ TỆP NÀY ─────────────────────────────────────────────────────────
#
# Đo 2026-08-11 trên `origin/develop` @8d0acda:
#
#   grep -n "cat >\|tee \|touch \|base64 -d\|printf" .github/workflows/debug-apk.yml
#     → 84:  cat > android/gradle.properties << 'EOF'
#     → 112: ./gradlew assembleDebug ... | tee android-debug.log
#
# Tức toàn bộ đường build GitHub chỉ sinh ĐÚNG MỘT tệp, và không có tệp biến môi
# trường. Còn `node_modules/react-native-dotenv/index.js:70` đặt
# `allowUndefined: true` làm mặc định — thiếu tệp thì plugin KHÔNG báo lỗi, nó
# thay mọi `import { X } from '@env'` bằng `undefined`.
#
# Hệ quả trên bản APK/AAB dựng từ GitHub (đối chiếu chỗ ÉP, không phải chỗ khai):
#
#   | biến               | đường lui khi undefined            | máy chủ thật             |
#   |--------------------|------------------------------------|--------------------------|
#   | ORILIFE_API_BASE   | https://api.orilife.io  (đúng)     | api.orilife.io      200  |
#   | PHOENIXKEY_API_URL | https://api.phoenixkey.me/api/v1   | 200                      |
#   | LAMPNET_BASE_URL   | https://lampnet.cloud   (đúng)     | /v1/network_info    200  |
#   | ALADIN_API_URL     | http://localhost:8001   ✗ SAI      | api.orilife.io      200  |
#   | WORK_API_URL       | '' → cổng runtime tắt   ✗ SAI      | api.aladin.work     200  |
#   | PROOFCHAT_API_URL  | http://localhost:3000   ✗ SAI      | api.proofchat.me    200  |
#
#   - `aladin-api.ts:68` → `syncDispatch.ts` là đường ĐỒNG BỘ vườn/cây. Trỏ
#     localhost:8001 nghĩa là đồng bộ hỏng câm trên máy nông dân.
#   - `modules/work/services/config.ts:24` `?.trim() || ''` → `WORK_BASE_URL=''`
#     → `isWorkBackendEnabled()` luôn false → module Việc kẹt mock VĨNH VIỄN,
#     dù `api.aladin.work/api/v1/health` trả 200.
#   - `proofchat-api.ts:145` cùng dạng.
#
# `codemagic.yaml:103-154` ĐÃ sinh tệp này từ lâu với đúng các giá trị prod. Nên
# hai đường build đang cho ra HAI ỨNG DỤNG KHÁC NHAU từ cùng một commit — bản
# Codemagic nối máy chủ thật, bản GitHub nối localhost. Đó mới là lỗi thật; tệp
# này gỡ nó bằng cách bắt đường GitHub ghi CÙNG bộ giá trị.
#
# Sửa ở đây thì SỬA CẢ `codemagic.yaml` — hai chỗ lệch nhau là quay lại đúng lỗi này.

inputs:
  aladin-api-key:
    description: 'X-API-Key gọi backend OriLife/Aladin. Trống → mock-local-api-key (khớp codemagic.yaml:109).'
    required: false
    default: ''
  analytics-api-url:
    description: 'Trống = TẮT analytics. analytics.orilife.io không phân giải được (DNS NXDOMAIN, đo 05/08).'
    required: false
    default: ''
  analytics-api-key:
    required: false
    default: ''
  app-instance:
    description: >
      App nào được dựng từ nền mã này: `aladin` | `checkfarm`. Mặc định `aladin`
      giữ đúng hành vi cũ. Giá trị LẠ thì app NÉM ngay lúc nạp module — cố ý,
      vì rơi sạch ở đó nghĩa là dựng ra app này rồi nộp cửa hàng dưới tên app kia.
    required: false
    default: 'aladin'
  cardano-network:
    description: >
      0 = preprod (chuỗi thử) · 1 = mainnet (tiền thật). Mặc định `0` là fail-safe cố ý,
      cùng luật với `src/config/cardanoNetwork.ts:33-38`: đoán nhầm sang preprod thì người
      dùng thấy số dư 0 và kêu; đoán nhầm sang mainnet thì app ký giao dịch bằng tiền thật.
      PHẢI đi qua input này chứ không đọc thẳng biến môi trường của runner: heredoc dưới
      chạy trong shell của runner, nơi biến kho KHÔNG tự có mặt — viết `${CARDANO_NETWORK:-0}`
      thẳng vào đó là đóng cứng `0` trong khi trông như một cái nút xoay được.
    required: false
    default: '0'
  proofchat-backend-enabled:
    description: >
      Mặc định `off` CỐ Ý. Máy chủ ProofChat sống (api.proofchat.me/api/v1/health → 200,
      đo lại 2026-08-18), nên để trống thì cổng runtime tự bật module. Bật là quyết định
      của người phát hành, không phải hệ quả phụ của việc máy chủ hồi sinh.
      ĐÍNH CHÍNH 2026-08-18: lý do cũ ("token còn ở AsyncStorage chưa mã hoá") đã hết
      hiệu lực — commit 48efb57 chuyển token phiên sang Keychain/Keystore. Chặn còn lại
      nằm ở phía ProofChat: GET /api/v1/users/search → 404, cửa tìm người để mở hội
      thoại vẫn đóng (proofchat-api.ts:465).
    required: false
    default: 'off'

runs:
  using: composite
  steps:
    - name: Ghi tệp biến môi trường
      shell: bash
      env:
        IN_ALADIN_API_KEY: ${{ inputs.aladin-api-key }}
        IN_ANALYTICS_API_URL: ${{ inputs.analytics-api-url }}
        IN_ANALYTICS_API_KEY: ${{ inputs.analytics-api-key }}
        IN_PROOFCHAT_ENABLED: ${{ inputs.proofchat-backend-enabled }}
        IN_CARDANO_NETWORK: ${{ inputs.cardano-network }}
        IN_APP_INSTANCE: ${{ inputs.app-instance }}
      run: |
        set -eo pipefail
        ENV_FILE=".env"
        cat > "$ENV_FILE" <<EOF
        # SINH TỰ ĐỘNG bởi .github/actions/rn-env — đừng sửa tay trong runner.
        # Giá trị phải TRÙNG codemagic.yaml:103-154, nếu không hai đường build cho
        # ra hai ứng dụng khác nhau từ cùng một commit.

        # OriLife / Aladin (đồng bộ vườn + cây)
        ALADIN_API_URL=https://api.orilife.io
        ALADIN_API_KEY=${IN_ALADIN_API_KEY:-mock-local-api-key}
        ALADIN_REGION_CODE=vn-south-01

        # PhoenixKey + Ví Phượng hoàng
        PHOENIXKEY_API_URL=https://api.phoenixkey.me/api/v1
        # false = luồng ký chưa mở (native Ed25519 signer còn stub — OrgMintScreen.tsx:61).
        PHOENIX_WALLET_ENABLED=false
        ORG_MINT_ENABLED=false
        # 0 = preprod (chuỗi thử) · 1 = mainnet (tiền thật). Thiếu biến thì
        # cardanoNetwork.ts:33-38 rơi về preprod — fail-safe cố ý, vì đoán nhầm
        # sang mainnet là app ký giao dịch bằng tiền thật.
        CARDANO_NETWORK=${IN_CARDANO_NETWORK:-0}
        # `aladin` | `checkfarm` — chọn app lúc DỰNG. Xem config/instance.config.ts.
        APP_INSTANCE=${IN_APP_INSTANCE:-aladin}
        # Module Pool đang được gỡ (PR #130 — bản thứ hai của cùng một việc, không
        # màn nào mở được). Giữ dòng này tới khi #130 vào develop, vì poolService.ts
        # còn import nó và bước đối chiếu bên dưới sẽ đỏ nếu thiếu.
        PHOENIXKEY_POOL_API_URL=https://api.phoenixkey.me/api/v1

        # TreeReID / identify cây
        ORILIFE_API_BASE_URL=https://api.orilife.io

        # LampNet
        MESHAPI_USE_MOCK=false
        LAMPNET_BASE_URL=https://lampnet.cloud
        LAMPNET_UPLOAD_URL=https://lampnet.cloud/mirage/put?mode=symmetric
        CAPTURES_3D_URL=https://api.orilife.io/captures/3d

        # AladinWork (Việc làm)
        WORK_API_URL=https://api.aladin.work/api/v1
        # Kill-switch THỦ CÔNG. Trống = để cổng runtime quyết theo /health
        # (config.ts:36-39 chỉ chặn khi giá trị đúng bằng 'off').
        WORK_BACKEND_ENABLED=

        # ProofChat
        PROOFCHAT_API_URL=https://api.proofchat.me/api/v1
        PROOFCHAT_WS_URL=https://api.proofchat.me
        PROOFCHAT_WS_PATH=/socket.io
        PROOFCHAT_BACKEND_ENABLED=${IN_PROOFCHAT_ENABLED}

        # Analytics — trống = TẮT.
        ANALYTICS_API_URL=${IN_ANALYTICS_API_URL}
        ANALYTICS_API_KEY=${IN_ANALYTICS_API_KEY}

        # Nhật ký từ xa + trợ lý Aladin — CỐ Ý TRỐNG ở bản phát hành.
        # Hai thứ này trước đây viết cứng địa chỉ ngrok trên máy lập trình viên
        # (`remoteLogger.ts`, `aladinChat.ts`) nên mọi bản phát hành đều đẩy nhật ký
        # thiết bị và câu hỏi của người dùng thật lên một tên miền tạm. Nay trống =
        # tắt hẳn: rLog chỉ in console, bong bóng trợ lý ẩn luôn.
        # Có endpoint phát hành thật thì điền vào đây, ĐỪNG điền lại ngrok.
        REMOTE_LOG_URL=
        ALADIN_CHAT_URL=

        # Truy vết bản dựng — app in ba giá trị này ở màn "Phiên bản ứng dụng"
        # (`src/screens/AccountScreen.tsx`) để một ảnh chụp màn của người thử truy
        # ngược được đúng commit. Phải TRÙNG codemagic.yaml (BUILD_COMMIT/BUILD_BRANCH/
        # BUILD_ID), chỉ khác nguồn: GitHub đặt GITHUB_SHA/GITHUB_REF_NAME/GITHUB_RUN_ID.
        BUILD_COMMIT=${GITHUB_SHA:0:12}
        BUILD_BRANCH=${GITHUB_REF_NAME}
        BUILD_ID=${GITHUB_RUN_ID}
        EOF
        # Cắt khoảng trắng lạc sau '=' và cuối dòng: một URL dính tab đầu chuỗi sẽ
        # làm fetch ném "Network request failed" trên máy thật, và lỗi đó đọc như
        # mất mạng chứ không như cấu hình sai (codemagic.yaml:153 cùng lý do).
        perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' "$ENV_FILE"

    - name: Kiểm tệp vừa ghi có đủ biến mà mã thật sự import không
      shell: bash
      run: |
        set -eo pipefail
        # Đối chiếu chỗ ÉP (mọi `import { … } from '@env'` trong src/) với chỗ vừa
        # ghi. Thêm một biến `@env` mới mà quên khai ở đây thì nó thành `undefined`
        # ÂM THẦM — bước này biến cái im lặng đó thành đỏ.
        # Hai lát `sed`/`grep` cuối vá một lỗ của chính cổng này: dạng bí danh
        # `import { A as B }` trước đây bóc ra chuỗi "A as B", không khớp tên nào
        # trong tệp vừa ghi ⇒ cổng báo THIẾU một biến đã khai đủ. Tức cổng tự đẻ ra
        # đỏ giả. Cắt phần ` as …` rồi chỉ giữ token đúng dạng TÊN_BIẾN.
        grep -rh "from '@env'" src --include="*.ts" --include="*.tsx" \
          | sed "s/.*import *{//; s/} *from.*//" | tr ',' '\n' \
          | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
          | sed 's/[[:space:]]\+as[[:space:]]\+.*$//' \
          | grep -E '^[A-Z0-9_]+$' | sort -u > /tmp/env-needed.txt
        cut -d= -f1 .env | grep -E '^[A-Z0-9_]+$' | sort -u > /tmp/env-have.txt
        MISSING=$(comm -23 /tmp/env-needed.txt /tmp/env-have.txt || true)
        if [ -n "$MISSING" ]; then
          echo "::error::Mã import biến @env chưa được khai trong tệp môi trường:"
          echo "$MISSING" | sed 's/^/  - /'
          echo "Thêm vào .github/actions/rn-env/action.yml VÀ codemagic.yaml (cả hai)."
          exit 1
        fi
        echo "Đủ $(wc -l < /tmp/env-needed.txt) biến @env mà src/ đang import."
        echo "--- ALADIN_API_URL   : $(grep '^ALADIN_API_URL=' .env)"
        echo "--- WORK_API_URL     : $(grep '^WORK_API_URL=' .env)"
        echo "--- PROOFCHAT_API_URL: $(grep '^PROOFCHAT_API_URL=' .env)"
