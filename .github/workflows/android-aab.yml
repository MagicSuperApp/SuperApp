name: Android Signed AAB (SuperApp — Play Store)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android-aab.yml'
  workflow_dispatch:  # Manual trigger button

jobs:
  # CỔNG chất-lượng — nhánh `main` là nhánh RA PLAY STORE, mà trước đây lại là nhánh
  # DUY NHẤT không có cổng nào: code đỏ tsc/jest đi thẳng ra bản người dùng tải.
  # Giống hệt job `verify` của debug-apk.yml.
  verify:
    name: Verify (tsc + jest)
    runs-on: ubuntu-latest
    # Hạ 20 → 12: suite chạy thật mất ~1 phút. Trần 20 phút chỉ có tác dụng KÉO DÀI thời
    # gian một job đã treo, và mỗi lần treo lại tốn đúng 20 phút runner. 12 phút vẫn dư
    # gấp nhiều lần cho tsc + jest + npm install, mà hỏng thì biết sớm.
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      # Vì sao cả cụm cờ này: 06–10/08 job verify chết 3 lần liên tiếp mà KHÔNG ai thấy.
      # Cơ chế: một `Animated.loop` không được dọn giữ vòng lặp timer sống SAU khi 39 suite
      # đã in đủ PASS/FAIL → heap phình tới `FATAL ERROR: Reached heap limit` → tiến trình
      # treo tới `timeout-minutes` → GitHub gắn nhãn `cancelled`. Nhãn đó ĐỌC NHƯ "có người
      # bấm huỷ" chứ không như "hỏng", nên cổng chết âm thầm 5 ngày liền.
      #   • max-old-space-size=4096 — runner ít RAM hơn máy dev nhiều. Cấp trần rõ ràng để
      #     hết bộ nhớ thì chết NGAY và ĐỎ, đừng bò dần tới lúc treo.
      #   • --maxWorkers=2 — runner chỉ 2 lõi; jest mặc định sinh nhiều worker hơn, mỗi
      #     worker một heap riêng, cộng lại vượt RAM runner.
      #   • timeout 600 — chốt chặn ĐỔI NHÃN: treo thì `timeout` trả mã 124 ⇒ BƯỚC đỏ, thay
      #     vì để job chạm trần thời gian rồi bị gắn nhãn `cancelled` mập mờ.
      # KHÔNG dùng `--forceExit`: nó chỉ giết tiến trình sau khi test chạy xong, tức là CHE
      # đúng loại rò handle vừa gây ra sự cố này chứ không sửa. Rò thật phải để nó lộ ra.
      # Nhánh này RA PLAY STORE — cổng ở đây im lặng là bản hỏng tới tay người dùng.
      - name: Unit tests (jest)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: timeout 600 npx jest --ci --maxWorkers=2

  build-aab:
    name: Build signed AAB for Play Store
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Create android/gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          # Tắt tích hợp worklets của expo-modules-core. KHÔNG có dòng này thì
          # WorkletRuntimeInstaller.cpp biên dịch với WORKLETS_ENABLED=1 và đòi
          # <worklets/Compat/StableApi.h> — header chỉ có từ react-native-worklets
          # 0.8.0, mà dự án ghim 0.7.4 ⇒ build native gãy. Bản vá
          # patches/expo-modules-core+56.0.22.patch mở đúng công tắc này, nhưng
          # android/gradle.properties bị gitignore và bị heredoc dưới đây ghi đè,
          # nên bản vá vô tác dụng suốt từ 26/07 — 10/10 lần chạy CI đỏ vì nó.
          expo.enableWorkletsIntegration=false
          EOF
          echo "gradle.properties created (JVM heap: 4096m)"

      - name: Verify Android secrets.properties
        run: |
          if [ ! -f android/app/secrets.properties ]; then
            echo "::error::android/app/secrets.properties missing"
            exit 1
          fi
          echo "secrets.properties found"
          grep -E "BASE_API_URL|API_KEY|REGION_CODE" android/app/secrets.properties || true

      - name: Restore keystore from secret
        env:
          ORILIFE_UPLOAD_STORE_FILE_B64: ${{ secrets.ORILIFE_UPLOAD_STORE_FILE_B64 }}
        run: |
          if [ -z "$ORILIFE_UPLOAD_STORE_FILE_B64" ]; then
            echo "::error::ORILIFE_UPLOAD_STORE_FILE_B64 secret not set"
            echo "Setup: gh secret set ORILIFE_UPLOAD_STORE_FILE_B64 < /tmp/keysigning_base64.txt"
            exit 1
          fi
          echo "$ORILIFE_UPLOAD_STORE_FILE_B64" | base64 -d > android/app/keySigning.bin
          ls -lh android/app/keySigning.bin
          echo "Keystore restored ($(stat -c%s android/app/keySigning.bin) bytes)"

      - name: Build signed AAB
        env:
          ORILIFE_UPLOAD_KEY_ALIAS: ${{ secrets.ORILIFE_UPLOAD_KEY_ALIAS }}
          ORILIFE_UPLOAD_STORE_PASSWORD: ${{ secrets.ORILIFE_UPLOAD_STORE_PASSWORD }}
          ORILIFE_UPLOAD_KEY_PASSWORD: ${{ secrets.ORILIFE_UPLOAD_KEY_PASSWORD }}
        run: |
          set -eo pipefail   # fail fast if gradle exit != 0 (don't let tee mask it)
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PORILIFE_UPLOAD_STORE_FILE=keySigning.bin \
            -PORILIFE_UPLOAD_KEY_ALIAS="$ORILIFE_UPLOAD_KEY_ALIAS" \
            -PORILIFE_UPLOAD_STORE_PASSWORD="$ORILIFE_UPLOAD_STORE_PASSWORD" \
            -PORILIFE_UPLOAD_KEY_PASSWORD="$ORILIFE_UPLOAD_KEY_PASSWORD" \
            --no-daemon \
            --stacktrace \
            2>&1 | tee android-release.log

      - name: Locate AAB + Generate SHA256
        id: aab-info
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::AAB not found in expected directory"
            find android/app/build/outputs -type f | head -20
            exit 1
          fi
          echo "✅ AAB: $AAB_FILE"
          ls -lh "$AAB_FILE"

          mkdir -p dist
          cp "$AAB_FILE" dist/superapp-release.aab
          shasum -a 256 dist/superapp-release.aab > dist/superapp-release.aab.sha256
          cat dist/superapp-release.aab.sha256

          # Output for downstream steps
          echo "aab_path=dist/superapp-release.aab" >> $GITHUB_OUTPUT
          echo "aab_size=$(stat -c%s dist/superapp-release.aab)" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: superapp-release-aab
          path: |
            dist/superapp-release.aab
            dist/superapp-release.aab.sha256
            android-release.log
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Android AAB (SuperApp) — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`superapp-release.aab\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $(($(stat -c%s dist/superapp-release.aab) / 1024 / 1024)) MB" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256:** $(cat dist/superapp-release.aab.sha256 | cut -d' ' -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode:** $(grep versionCode android/app/build.gradle | grep -oE '[0-9]+')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifact \`superapp-release-aab\` (button at top right of this page)" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload \`.aab\` to Play Console → Production track → Create new release" >> $GITHUB_STEP_SUMMARY
          echo "3. Click 'Send for Review' → Google review 1-7 days" >> $GITHUB_STEP_SUMMARY
