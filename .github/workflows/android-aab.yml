name: Android Signed AAB (SuperApp — Play Store)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      # `rust/**` BẮT BUỘC có mặt: từ 2026-08-11 chính workflow này dựng lõi Rust
      # (bước `uses: ./.github/actions/rust-android`). Thiếu dòng này thì một commit
      # CHỈ đụng `rust/` không kích hoạt bản dựng nào — tức đúng thay đổi cần được
      # biên dịch lại là thay đổi duy nhất đi lọt. Đo được ở merge commit `ae1085b`
      # của PR #135: `gh api ".../actions/runs?head_sha=ae1085b" --jq '.total_count'`
      # trả 0 — không một workflow nào chạy.
      #
      # `.github/actions/**` phủ CẢ THƯ MỤC chứ không riêng `rust-android`: workflow
      # này còn gọi `./.github/actions/rn-env`, nên liệt kê từng cái là dựng lại đúng
      # cái lỗ vừa vá, chỉ ở tên khác.
      - 'rust/**'
      - '.github/actions/**'
      - '.github/workflows/android-aab.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App cần dựng (mã app trong instances/)'
        type: choice
        default: aladin
        options:
          - aladin
          - checkfarm

# ── VÌ SAO PHẢI LIỆT KÊ TAY, và cái gì canh cho danh sách này khỏi lệch ──────
# `workflow_dispatch.inputs.<x>.options` KHÔNG nhận giá trị động: GitHub đọc nó
# lúc dựng giao diện, trước khi có runner nào chạy. Nên danh sách trên là chỗ
# DUY NHẤT trong kho còn phải gõ tay tên app — mọi chỗ khác (gradle, cổng ký)
# đều ĐỌC `instances/`.
#
# Liệt kê tay thì sẽ lệch: thêm `instances/<mã>/` mà quên sửa đây là app mới
# KHÔNG dựng được bản phát hành, và không có gì đỏ — chỉ là một mục thiếu trong
# một hộp chọn không ai nhìn. `src/config/aabTheoApp.test.ts` đối chiếu danh
# sách này với `instances/` và đỏ khi lệch.

jobs:
  # CỔNG chất-lượng — nhánh `main` là nhánh RA PLAY STORE, mà trước đây lại là nhánh
  # DUY NHẤT không có cổng nào: code đỏ tsc/jest đi thẳng ra bản người dùng tải.
  # Giống hệt job `verify` của debug-apk.yml.
  verify:
    name: Verify (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      # `--forceExit`: khớp `verify-pr.yml` và `debug-apk.yml`. KHÔNG có cờ này thì
      # jest in xong kết quả nhưng không thoát (vòng `Animated` của màn render trong
      # test chạy mãi theo thiết kế), runner chạy tới hết bộ nhớ rồi chạm
      # `timeout-minutes` → job bị gắn nhãn `cancelled`. Nhãn đó đọc như "có người
      # bấm huỷ" nên năm ngày liền không ai thấy develop đang hỏng. Cổng bản PHÁT
      # HÀNH là chỗ cuối cùng còn thiếu cờ này — tức nó vẫn còn nguyên mìn.
      # HAI lượt, mỗi app một lượt. Luật và lý do đầy đủ ở `verify-pr.yml`; ở ĐÂY
      # nó nặng hơn mọi luồng khác, vì đây là cổng của bản PHÁT HÀNH — thứ người
      # dùng thật tải về. Tới trước bản này nó gọi `npx jest` trần, tức bản phát
      # hành của app này đi ra cửa hàng sau khi chỉ chứng minh app KIA.
      #
      # `--cacheDirectory` riêng là bắt buộc: bộ chuyển mã nướng giá trị vào lúc
      # biến đổi mã, dùng chung bộ đệm thì hai lượt cho ra cùng một app và cả hai
      # vẫn xanh. `src/config/ciJestPerApp.test.ts` canh cả hai điều này cho MỌI
      # tệp trong thư mục workflow, kể cả tệp viết sau này.
      - name: Unit tests (jest) — app `aladin`
        env:
          APP_INSTANCE: aladin
          EXPECTED_APP_INSTANCE: aladin
        run: npx jest --ci --forceExit --cacheDirectory /tmp/jest-cache-aladin

      - name: Unit tests (jest) — app `checkfarm`
        env:
          APP_INSTANCE: checkfarm
          EXPECTED_APP_INSTANCE: checkfarm
        run: npx jest --ci --forceExit --cacheDirectory /tmp/jest-cache-checkfarm

  build-aab:
    name: Build signed AAB for Play Store
    needs: verify
    runs-on: ubuntu-latest

    # ── App đang dựng ────────────────────────────────────────────────────────
    # `push` lên `main` KHÔNG mang `inputs`, nên rơi về `aladin` — hành vi cũ
    # giữ nguyên từng chữ. Chỉ lượt bấm tay mới chọn được app khác.
    #
    # `TIEN_TO` là bản viết HOA của `FLAVOR`, dùng để tra tên bí mật. Biểu thức
    # của GitHub KHÔNG có hàm đổi hoa-thường, nên phải viết điều kiện; đây là
    # lý do thứ hai khiến danh sách app xuất hiện tay ở tệp này, và cũng nằm
    # trong phạm vi bài kiểm đối chiếu.
    env:
      FLAVOR: ${{ inputs.flavor || 'aladin' }}
      TIEN_TO: ${{ (inputs.flavor || 'aladin') == 'checkfarm' && 'CHECKFARM' || 'ALADIN' }}
    # 60 → 90, cùng lý do như `debug-apk.yml`: thêm bước dựng Rust, và chạm trần
    # thời gian bị gắn nhãn `cancelled` chứ không phải `failure`.
    timeout-minutes: 90

    steps:
      # ⛔ CỔNG NHÁNH — job này KÝ bằng khoá phát hành thật, nên chỉ `main` được vào.
      # `workflow_dispatch` ở đầu tệp cho phép bấm chạy từ BẤT KỲ nhánh nào, và GitHub
      # KHÔNG có cách khai "chỉ hiện nút này trên main". Không có cổng này thì một nhánh
      # nháp bất kỳ cũng ra được tệp `.aab` ký đúng chữ ký Play Store — và tệp đó không
      # mang dấu vết nào cho biết nó dựng từ nhánh nào, nên người cầm tệp không phân biệt
      # được với bản phát hành thật. Đó là cách hai tệp cùng mang `versionCode 92` có thể
      # cùng tồn tại mà không ai truy được cái nào từ đâu.
      #
      # Dùng bước CHẶN (`exit 1`) chứ KHÔNG dùng `if:` cấp job: `if:` sai điều kiện thì
      # job bị BỎ QUA và cả lượt chạy vẫn XANH — đúng dạng hỏng câm kho này đã dính nhiều
      # lần (nhãn `cancelled` năm ngày không ai thấy). Cổng phải kêu thành tiếng.
      #
      # Ba giá trị ngữ cảnh đi qua `env:` chứ KHÔNG nội suy `${{ }}` thẳng vào thân
      # `run:`. Nội suy thẳng là dán chuỗi vào mã shell TRƯỚC khi shell chạy, nên một
      # nhánh đặt tên có `$(...)` hay dấu nháy ngược biến thành lệnh chạy ngay trong
      # job cầm khoá ký. Qua `env:` thì chúng chỉ còn là giá trị biến, không còn là mã.
      - name: Cổng nhánh — chỉ `main` được ký bản phát hành
        env:
          REF: ${{ github.ref }}
          SU_KIEN: ${{ github.event_name }}
          NGUOI_BAM: ${{ github.actor }}
        run: |
          echo "ref        = $REF"
          echo "sự kiện    = $SU_KIEN"
          echo "người bấm  = $NGUOI_BAM"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Nhánh này KHÔNG phải main — dừng TRƯỚC khi chạm khoá ký."
            echo "Job này ký bằng ${TIEN_TO}_UPLOAD_* — khoá ra Play Store. Chỉ main mới"
            echo "được cho ra một tệp .aab ký thật."
            echo "Cần bản để thử? Chạy workflow 'Debug APK' — nó không chạm khoá ký."
            exit 1
          fi
          echo "OK — main."

      - name: Checkout repository
        uses: actions/checkout@v4

      # ⛔ Job này CHƯA từng chạy trên `main`, nhưng job em ruột của nó
      # (`debug-apk.yml` trên `develop`) chết 5 lượt liên tiếp 15/08 → 17/08 vì HẾT ĐĨA:
      #   System.IO.IOException: No space left on device :
      #   '/home/runner/actions-runner/cached/2.336.0/_diag/Worker_20260817-043812-utc.log'
      # (annotation job 95285397387). Job NÀY nặng hơn job kia — bản AAB đóng gói
      # BA lát ABI (thêm x86_64) chứ không phải hai — nên nó chắc chắn chết trước.
      # Runner chết TRƯỚC khi tải nhật ký lên, nên nếu để nguyên thì bản ra Play hỏng
      # mà không để lại một dòng log nào để đọc.
      - name: Dọn đĩa runner (ubuntu-latest chỉ còn ~14 GB trống)
        run: |
          echo "TRƯỚC:"; df -h / | tail -1
          # Chỉ gỡ thứ job này KHÔNG dùng. KHÔNG đụng /usr/local/lib/android
          # (Android SDK + NDK — bước dựng Rust cần nó) và KHÔNG xoá cả
          # /opt/hostedtoolcache (setup-node và setup-java cài vào trong đó).
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "SAU:"; df -h / | tail -1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # Ở ĐÂY TỪNG CÓ MỘT CỔNG "thiếu ALADIN_API_KEY thì không cho phát hành".
      # Gỡ 2026-09-01 vì đo ra nó canh một giá trị KHÔNG ĐẦU NÀO ĐỌC:
      #
      #   * Đích thật của app là `ALADIN_API_URL = https://api.orilife.io`
      #     (`.github/actions/rn-env/action.yml:106`).
      #   * Mã máy chủ OriLife KHÔNG có chỗ nào đọc header `X-API-Key` VÀO. Cả kho chỉ
      #     có một chuỗi `X-API-Key`, và đó là client GỬI ĐI sang LampNet
      #     (`orilife-mesh-worker/lampnet_client.py:50`).
      #   * Cửa GHI — phần trước đây ghi là "CHƯA đo được", tức lý do duy nhất giữ cổng
      #     này đứng — nay đo xong: nó gác bằng PHIÊN, không bằng khoá.
      #     `animal_server_ext.py:426` → `account: dict = Depends(_require_account)`.
      #   * Chốt độc lập từ 11/07, trước cổng này: `Legacy/Integration-OriLife-snapshot-2026-07-11.md:31`
      #     — "KHÔNG có API-key tĩnh (`ALADIN_API_KEY` deprecated) — auth = token DID runtime".
      #
      # Giá của cổng thì đo được: lượt phát hành 33361993600 (31/08) là lượt DUY NHẤT
      # xanh sau bốn lượt hỏng, và gói của nó ra đời mang tên
      # `aladin-aab-KHONG-KHOA-API-KHONG-NOP-PLAY` — tự dán nhãn cấm nộp lên chính bản
      # hợp lệ. Một cổng canh thứ không ai đọc thì nó không canh gì cả; nó chỉ chặn.
      #
      # `ALADIN_API_KEY` vẫn được truyền tiếp xuống `rn-env` ngay dưới đây, và
      # `aladin-api.ts:75` vẫn gửi header đó. Gỡ cổng KHÔNG phải gỡ đường dây: có khoá
      # thì khoá vẫn đi tới nơi, chỉ là thiếu nó thì thôi chặn.

      # PHẢI trước gradle — lý do đầy đủ ở .github/actions/rn-env/action.yml.
      - name: Sinh biến môi trường React Native
        uses: ./.github/actions/rn-env
        with:
          aladin-api-key: ${{ secrets.ALADIN_API_KEY }}
          analytics-api-url: ${{ secrets.ANALYTICS_API_URL }}
          analytics-api-key: ${{ secrets.ANALYTICS_API_KEY }}
          cardano-network: ${{ vars.CARDANO_NETWORK || '0' }}
          # Thiếu dòng này thì mọi bản đều mang danh tính JS của app đầu tiên:
          # `app-instance` mặc định `aladin`, và một app dựng đúng vỏ native mà
          # sai instance JS thì mang tên, màu, pháp nhân của app kia — không có
          # bước nào đỏ.
          app-instance: ${{ env.FLAVOR }}

      - name: Create android/gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          # ĐO 2026-08-20: dòng NÀY mới cắt lát ABI, không phải `abiFilters`.
          # Dựng thật với `x86` ở đây + abiFilters KHÔNG có x86 ⇒ .aab vẫn ra lát
          # base/lib/x86 25 tệp (ba lát kia 28), thiếu đúng libtaad_enclave_core.so,
          # libchat_mls.so, libcardano_serialization_lib. Plugin com.facebook.react
          # đọc dòng này và ghi đè abiFilters viết tay. Đó là dạng hỏng của bản 87.
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          # Tắt tích hợp worklets của expo-modules-core. KHÔNG có dòng này thì
          # WorkletRuntimeInstaller.cpp biên dịch với WORKLETS_ENABLED=1 và đòi
          # <worklets/Compat/StableApi.h> — header chỉ có từ react-native-worklets
          # 0.8.0, mà dự án ghim 0.7.4 ⇒ build native gãy. Bản vá
          # patches/expo-modules-core+56.0.22.patch mở đúng công tắc này, nhưng
          # android/gradle.properties bị gitignore và bị heredoc dưới đây ghi đè,
          # nên bản vá vô tác dụng suốt từ 26/07 — 10/10 lần chạy CI đỏ vì nó.
          expo.enableWorkletsIntegration=false
          EOF
          echo "gradle.properties created (JVM heap: 4096m)"

      # ĐÃ GỠ 2026-08-10 — cổng ma. Chỗ này từng chặn: nếu không có
      # `android/app/secrets.properties` thì dừng build. Đó là lý do DUY NHẤT khiến
      # bản AAB hỏng ở lần chạy 11/07 (`##[error]android/app/secrets.properties
      # missing`, run 29165647429) — và AAB chỉ chạy 2 lần trong đời, hỏng cả 2.
      #
      # Nhưng KHÔNG có tệp gradle nào của Android đọc tệp đó:
      #   grep -rn "secrets\|Properties()" android/ --include=*.gradle  → trống
      #   android/settings.gradle chỉ include ':app' — không có module orilifesdk
      # Tệp này là của đường iOS (ios/LocalPods/ScannerModule/Core/APISecrets.swift)
      # và của Codemagic (codemagic.yaml:817 tự sinh nó). Bản Android trên GitHub
      # không dùng tới, nên cổng này chặn một tệp mà không ai đọc.
      #
      # KHÔNG thay bằng bước tự sinh tệp: sinh ra một tệp không ai đọc, mang giá trị
      # mặc định `API_KEY=mock-local-api-key`, nằm trong đường ra Play Store, là gài
      # mìn cho người sau. Khi nào Android thật sự cần thì thêm cùng lúc với mã đọc nó.

      - name: Restore keystore from secret
        env:
          # Tra tên bí mật THEO app đang dựng. Không đưa cả hai bộ khoá vào môi
          # trường rồi chọn trong bash: làm vậy là bản app này chạy với khoá app
          # kia nằm sẵn bên cạnh, và một dòng sai thứ tự đủ để ký nhầm.
          KHOA_B64: ${{ secrets[format('{0}_UPLOAD_STORE_FILE_B64', env.TIEN_TO)] }}
        run: |
          if [ -z "$KHOA_B64" ]; then
            echo "::error::Kho khoá ký chưa nạp — repo hiện có 0 secret."
            echo "Đo 2026-08-10 (kho khi đó còn ở AladinContract; nay là ${{ github.repository }}):"
            echo "               gh api repos/MagicSuperApp/SuperApp/actions/secrets"
            echo "               → {\"total_count\":0,\"secrets\":[]}"
            echo ""
            echo "⚠ TÊN BIẾN SUY TỪ MÃ APP kể từ 2026-08-29: <MÃ APP VIẾT HOA>_UPLOAD_*."
            echo "  Tên cũ gọi theo một nền tảng chứ không theo app, và nay nền mã này"
            echo "  dựng NHIỀU app nên tên khoá phải nói rõ nó ký cho app nào."
            echo "  Secret đã nạp dưới tên cũ thì đổi tên, KHÔNG cần sinh khoá mới —"
            echo "  sinh khoá mới là mất quyền cập nhật ứng dụng đã phát hành."
            echo ""
            echo "Cần nạp ĐỦ BỐN cái, thiếu một cái là bước ký gãy:"
            echo "  ${TIEN_TO}_UPLOAD_STORE_FILE_B64   (keystore .jks đã base64)"
            echo "  ${TIEN_TO}_UPLOAD_KEY_ALIAS"
            echo "  ${TIEN_TO}_UPLOAD_STORE_PASSWORD"
            echo "  ${TIEN_TO}_UPLOAD_KEY_PASSWORD"
            echo ""
            echo "App đang dựng: $FLAVOR. Mỗi app ký bằng khoá của CHÍNH pháp nhân"
            echo "sở hữu nó — khoá gắn vĩnh viễn với mục cửa hàng từ lần nộp đầu."
            echo ""
            echo "Chỉ CHỦ SỞ HỮU kho khoá nạp được — đây là khoá ký ra bản Play Store,"
            echo "mất là mất luôn quyền cập nhật ứng dụng đã phát hành."
            exit 1
          fi
          echo "$KHOA_B64" | base64 -d > android/app/keySigning.bin
          ls -lh android/app/keySigning.bin
          echo "Keystore restored ($(stat -c%s android/app/keySigning.bin) bytes)"

      # PHẢI trước gradle — lý do đầy đủ ở .github/actions/rust-android/action.yml.
      # Bản ra Play Store mà thiếu 2 .so này thì ví/DID/chat mã hoá im lặng không
      # dùng được, và build vẫn xanh.
      - name: Dựng Rust core (taad_enclave_core + chat_mls)
        uses: ./.github/actions/rust-android

      - name: Build signed AAB
        env:
          KHOA_ALIAS:    ${{ secrets[format('{0}_UPLOAD_KEY_ALIAS', env.TIEN_TO)] }}
          KHOA_STORE_PW: ${{ secrets[format('{0}_UPLOAD_STORE_PASSWORD', env.TIEN_TO)] }}
          KHOA_KEY_PW:   ${{ secrets[format('{0}_UPLOAD_KEY_PASSWORD', env.TIEN_TO)] }}
        run: |
          set -eo pipefail   # fail fast if gradle exit != 0 (don't let tee mask it)
          # Ba giá trị còn lại của bộ khoá phải CÓ MẶT, không chỉ mỗi kho khoá.
          # Thiếu một cái thì gradle vẫn chạy, `signingConfig` rơi về không ký,
          # và cổng ở `android/app/build.gradle` mới bắt — muộn hơn và khó đọc
          # hơn là dừng ngay ở đây.
          for TEN in KHOA_ALIAS KHOA_STORE_PW KHOA_KEY_PW; do
            if [ -z "${!TEN}" ]; then
              echo "::error::Thiếu bí mật cho app $FLAVOR — cần đủ bốn ${TIEN_TO}_UPLOAD_*"
              exit 1
            fi
          done
          cd android
          chmod +x gradlew
          # Flavor TƯỜNG MINH — xem chú thích cùng loại ở debug-apk.yml.
          # Viết hoa chữ đầu ngay tại đây thay vì mang thêm một biến môi trường
          # nữa: một biến suy ra mà để rỗng thì `bundleRelease` là task KHÔNG
          # tồn tại và gradle báo lỗi khó đoán.
          CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          echo "→ task: bundle${CAP}Release · khoá: ${TIEN_TO}_UPLOAD_*"
          ./gradlew "bundle${CAP}Release" \
            -P${TIEN_TO}_UPLOAD_STORE_FILE=keySigning.bin \
            -P${TIEN_TO}_UPLOAD_KEY_ALIAS="$KHOA_ALIAS" \
            -P${TIEN_TO}_UPLOAD_STORE_PASSWORD="$KHOA_STORE_PW" \
            -P${TIEN_TO}_UPLOAD_KEY_PASSWORD="$KHOA_KEY_PW" \
            --no-daemon \
            --stacktrace \
            2>&1 | tee android-release.log

      - name: Locate AAB + Generate SHA256
        id: aab-info
        run: |
          # `bundle/release` KHÔNG còn tồn tại sau khi có flavor — đường đúng là
          # `bundle/<mã app>Release`. Giữ đường cũ thì `find` trả rỗng và bước này
          # đỏ ở chỗ khó đoán ra nguyên nhân.
          AAB_FILE=$(find "android/app/build/outputs/bundle/${FLAVOR}Release" -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::AAB not found in expected directory"
            find android/app/build/outputs -type f | head -20
            exit 1
          fi
          echo "✅ AAB: $AAB_FILE"
          ls -lh "$AAB_FILE"

          mkdir -p dist
          # TÊN TỆP PHẢI MANG TÊN APP. Bản trước gõ cứng `superapp-release.aab`, nên
          # hai app cho ra hai tệp TRÙNG TÊN: lượt dựng vẫn xanh, hiện vật vẫn tải về
          # được, và cái sai chỉ lộ ở người cầm tệp đi nộp — nhầm cửa hàng, nhầm pháp
          # nhân ký. Đường Codemagic đã vá đúng lỗ này (`dist/${ANDROID_FLAVOR}-release.aab`);
          # đường này là tệp anh em bị bỏ sót.
          cp "$AAB_FILE" "dist/${FLAVOR}-release.aab"
          shasum -a 256 "dist/${FLAVOR}-release.aab" > "dist/${FLAVOR}-release.aab.sha256"
          cat "dist/${FLAVOR}-release.aab.sha256"

          # Output for downstream steps
          echo "aab_path=dist/${FLAVOR}-release.aab" >> $GITHUB_OUTPUT
          echo "aab_size=$(stat -c%s "dist/${FLAVOR}-release.aab")" >> $GITHUB_OUTPUT

      # ── VÌ SAO CÓ BƯỚC NÀY ──────────────────────────────────────────────────
      # Bước "Dựng Rust core" ở trên kiểm jniLibs — tức kiểm ĐẦU VÀO của gradle.
      # Nó KHÔNG kiểm gradle có thật sự gói hai `.so` đó vào gói cuối không, và
      # không kiểm tệp `.env` có thật sự tới được bundle JS không.
      #
      # Chỗ trống đó đã có người rơi vào: bản `app-release.aab` gửi 15/08 00:24
      # (versionCode 87, chữ ký ĐÚNG) có 25 `.so` nhưng KHÔNG có
      # libtaad_enclave_core.so lẫn libchat_mls.so ở CẢ BỐN lát ABI. Bundle của nó
      # có `api.orilife.io` (đúng) NHƯNG cũng nướng kèm `staging-api.orilife.io` và
      # hai host ngrok cá nhân, đồng thời THIẾU hẳn `api.aladin.work` và
      # `api.proofchat.me` — hai biến đó rỗng lúc dựng tay. Cầu Kotlin
      # vẫn nằm trong dex nên app KHÔNG sập — nó reject E_NATIVE_UNAVAILABLE
      # (TaadEnclaveModule.kt:295). Lỗi bị NUỐT ở phoenixKeyAuthService.ts:92-95 nên
      # đăng ký VẪN thành công: người cài mới CÓ danh tính, nhưng KHÔNG có ví và
      # KHÔNG có cụm 24 từ sao lưu. Hỏng câm, và mọi cổng phía trước đều xanh.
      #
      # Nên cổng thật phải soi chính tệp giao đi, không soi vật liệu làm ra nó.
      - name: Soi chính tệp AAB — .so, biến môi trường, versionCode
        run: |
          set -eo pipefail
          AAB="dist/${FLAVOR}-release.aab"
          WORK=$(mktemp -d)
          unzip -q -o "$AAB" -d "$WORK"

          echo "── Thư viện native theo ABI ─────────────────────────────────"
          ls "$WORK/base/lib/" || true
          FAIL=0
          # Duyệt theo lát ABI CÓ THẬT trong gói, không theo danh sách viết tay.
          # ĐÍNH CHÍNH 20/08: bản trước ghi "chỉ abiFilters mới cắt x86" — SAI. Dựng
          # thật với abiFilters KHÔNG có x86 mà reactNativeArchitectures CÒN x86 thì
          # .aab vẫn ra lát `base/lib/x86` 25 tệp (ba lát kia 28). Plugin
          # com.facebook.react đọc reactNativeArchitectures rồi ghi đè abiFilters, nên
          # chỗ cắt lát THẬT là dòng đó trong gradle.properties (heredoc trên đã bỏ
          # x86). Ai khai lại `x86` ở đó thì lát hỏng quay lại — Rust CỐ Ý không dựng cho x86
          # (`.github/actions/rust-android/action.yml:71,76,89`) nên lát ấy thiếu cả
          # hai `.so`. Danh sách viết tay sẽ không thấy, vì nó chỉ soi 3 lát nó biết.
          for ABIDIR in "$WORK"/base/lib/*/; do
            ABI=$(basename "$ABIDIR")
            for LIB in libtaad_enclave_core.so libchat_mls.so; do
              if [ ! -f "$ABIDIR/$LIB" ]; then
                echo "::error::THIẾU $ABI/$LIB trong AAB — gốc danh tính PhoenixKey sẽ chết câm trên máy người dùng"
                FAIL=1
              else
                echo "  OK  $ABI/$LIB ($(stat -c%s "$ABIDIR/$LIB") byte)"
              fi
            done
          done
          # Và ba lát BẮT BUỘC phải có mặt: arm64-v8a là ABI Play yêu cầu từ 2019,
          # hai lát kia còn thiết bị cũ và máy ảo. Vòng trên chỉ soi lát đang có —
          # nếu gradle nuốt mất cả một lát thì vòng trên im lặng.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -d "$WORK/base/lib/$ABI" ]; then
              echo "::error::AAB KHÔNG có lát $ABI — thiết bị dùng ABI đó sẽ không cài được"
              FAIL=1
            fi
          done

          echo "── Biến môi trường thật sự nướng vào bundle JS ──────────────"
          BUNDLE="$WORK/base/assets/index.android.bundle"
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Không tìm thấy index.android.bundle trong AAB"
            exit 1
          fi
          # Bundle là Hermes bytecode — chuỗi vẫn đọc được bằng `strings`.
          strings "$BUNDLE" > "$WORK/strings.txt"

          # PHẢI CÓ. Thiếu = tệp .env không tới được bundle ⇒ mọi biến @env là
          # undefined ⇒ app rơi về đường lui localhost, im lặng.
          #
          # Phải neo đầu chuỗi, KHÔNG được dùng `grep -F` trần. Đo được ca qua mặt:
          #   printf 'https://staging-api.orilife.io\n' | grep -qF 'api.orilife.io'  → KHỚP
          # Tức một gói chỉ chứa host chết `staging-api.orilife.io` vẫn được báo
          # "OK có api.orilife.io". Đúng lỗi của bản 87, mà cổng MUST không bắt được —
          # lần đó chỉ danh sách CẤM phía dưới cứu. Neo bằng lớp ký tự đứng trước:
          # ký tự trước host phải KHÔNG phải chữ/số/`-`/`.` (trong bundle là dấu `/`).
          for MUST in 'api.orilife.io' 'api.aladin.work' 'api.proofchat.me' 'api.phoenixkey.me'; do
            if grep -qE "(^|[^-A-Za-z0-9.])$(echo "$MUST" | sed 's/\./\\./g')" "$WORK/strings.txt"; then
              echo "  OK  có $MUST"
            else
              echo "::error::Bundle KHÔNG có '$MUST' — biến @env tương ứng là undefined, module rơi về mock/localhost vĩnh viễn"
              FAIL=1
            fi
          done

          # TUYỆT ĐỐI KHÔNG ĐƯỢC CÓ.
          for BAD in 'staging-api.orilife.io' 'localhost:8001' 'localhost:3000' 'ngrok-free.dev'; do
            if grep -qF "$BAD" "$WORK/strings.txt"; then
              echo "::error::Bundle CÓ '$BAD' — bản này dựng từ tệp .env sai (máy cá nhân?), không phải từ đường dựng của kho"
              FAIL=1
            else
              echo "  OK  không có $BAD"
            fi
          done

          # Khoá giả — CHỈ BÁO, không chặn. Trước 01/09 đây là lỗi chặn, dựa trên cổng
          # `ALADIN_API_KEY` phía trên. Cổng đó đã gỡ (lý do + số đo ở chỗ nó từng đứng),
          # nên phép so `KHOA_API = thieu` ở đây cũng không còn nghĩa: bỏ nguyên khối thì
          # chuỗi này có mặt ở MỌI gói và bản dựng nào cũng đỏ.
          #
          # Vẫn IN ra, vì nó là phép đo rẻ và thật: nó nói giá trị nào đã đi tới bundle.
          # Ngày nào máy chủ thật sự đọc `X-API-Key` thì chỗ này là nơi dựng lại cổng —
          # nhưng dựng lại phải kèm phép đo mới, đừng dựng lại vì thấy dòng chữ này.
          if grep -qF 'mock-local-api-key' "$WORK/strings.txt"; then
            echo "  ghi nhận  gói mang 'mock-local-api-key' (không có secret ALADIN_API_KEY)"
            echo "            máy chủ api.orilife.io không đọc header X-API-Key vào — không chặn"
          else
            echo "  ghi nhận  gói mang khoá API thật"
          fi

          echo "── versionCode thật trong manifest của gói ─────────────────"
          # Manifest trong AAB là protobuf, không phải XML nhị phân — đọc số bằng
          # `strings` thì không tin được. Đối chiếu với mã nguồn là đủ để chặn
          # trường hợp gradle dùng một giá trị khác cái vừa commit.
          grep -m1 -E 'versionCode [0-9]+' android/app/build.gradle

          rm -rf "$WORK"
          [ "$FAIL" -eq 0 ] || { echo "::error::AAB không đạt — ĐỪNG nộp Play"; exit 1; }
          echo "AAB đạt cả ba nhóm kiểm."

      # Tên tệp tải về: MỘT tên, không rẽ nhánh. Trước 01/09 tên đổi thành
      # `…-KHONG-KHOA-API-KHONG-NOP-PLAY` khi thiếu `ALADIN_API_KEY` — và vì khoá đó
      # chưa từng có, cái tên cấm-nộp là tên DUY NHẤT từng ra đời (lượt 33361993600,
      # 31/08). Một bản hợp lệ tự dán nhãn cấm nộp thì người làm đúng hướng dẫn sẽ
      # không nộp gì cả.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('{0}-release-aab', env.FLAVOR) }}
          path: |
            dist/${{ env.FLAVOR }}-release.aab
            dist/${{ env.FLAVOR }}-release.aab.sha256
            android-release.log
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Android AAB (SuperApp) — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`${FLAVOR}-release.aab\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $(($(stat -c%s "dist/${FLAVOR}-release.aab") / 1024 / 1024)) MB" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256:** $(cat "dist/${FLAVOR}-release.aab.sha256" | cut -d' ' -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode:** $(grep versionCode android/app/build.gradle | grep -oE '[0-9]+')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps" >> $GITHUB_STEP_SUMMARY
          # Tên gói đi theo app đang dựng, KHÔNG gõ cứng: `aladin-release-aab`,
          # `checkfarm-release-aab`… Gõ cứng một tên là chỉ sai đường cho app thứ hai.
          echo "1. Download artifact \`${FLAVOR}-release-aab\` (button at top right of this page)" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload \`.aab\` to Play Console → Production track → Create new release" >> $GITHUB_STEP_SUMMARY
          echo "3. Click 'Send for Review' → Google review 1-7 days" >> $GITHUB_STEP_SUMMARY
