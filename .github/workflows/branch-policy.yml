name: Branch policy

# Quy-tắc nhánh SuperApp (giai-đoạn sắp production):
#   feature/* , fix/* , claude/*  →  PR  →  develop        (nhánh tích-hợp)
#   develop                        →  PR  →  main           (chỉ khi sẵn-sàng production)
# Repo private + plan free nên GitHub chưa bật được branch protection cứng;
# workflow này là chốt MỀM: PR nhắm main mà KHÔNG xuất-phát từ develop → fail.

on:
  pull_request:
    branches: [main]

jobs:
  only-develop-into-main:
    # Chỉ đánh giá cho pull_request THẬT vào main. Guard chống misfire: nếu event
    # không phải pull_request (vd push tới nhánh) thì github.head_ref rỗng → bước
    # dưới sẽ fail nhầm. Skip job ở mọi event khác pull_request.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Chỉ cho develop → main
        if: ${{ github.head_ref != 'develop' }}
        run: |
          echo "::error title=Sai nhánh đích::PR vào 'main' phải xuất-phát từ 'develop'."
          echo "Nhánh nguồn hiện tại: '${{ github.head_ref }}'."
          echo "Quy-tắc: feature/fix → PR → develop; chỉ 'develop' mới được PR vào 'main' khi sẵn-sàng production."
          exit 1
      - name: Hợp-lệ
        if: ${{ github.head_ref == 'develop' }}
        run: echo "develop → main: hợp-lệ."
