name: Branch policy

# Quy-tac nhanh SuperApp (giai-doan sap production):
#   feature/* , fix/* , claude/*  ->  PR  ->  develop   (nhanh tich-hop)
#   develop                        ->  PR  ->  main      (chi khi san-sang production)
# Repo private + plan free nen GitHub chua bat duoc branch protection cung;
# workflow nay la chot MEM: PR nham main ma KHONG xuat-phat tu develop -> fail.

on:
  pull_request:
    branches: [main]

jobs:
  only-develop-into-main:
    # Guard: chi danh gia cho pull_request that vao main. O event khac (vd push
    # toi nhanh) github.head_ref rong -> bo qua job, tranh fail nham.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Chi cho develop vao main
        if: ${{ github.head_ref != 'develop' }}
        run: |
          echo "::error title=Sai nhanh dich::PR vao 'main' phai xuat-phat tu 'develop'."
          echo "Nhanh nguon hien tai: '${{ github.head_ref }}'."
          echo "Quy-tac: feature/fix -> PR -> develop; chi 'develop' moi duoc PR vao 'main'."
          exit 1
      - name: Hop-le
        if: ${{ github.head_ref == 'develop' }}
        run: |
          echo "develop -> main: hop-le."
