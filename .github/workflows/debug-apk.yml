name: Android Debug APK (SuperApp — sideload test)

# APK debug để tải về cài thẳng máy thật mà test — KHÔNG cần Play Store,
# KHÔNG cần keystore ký (dùng debug.keystore gradle tự sinh). Khác android-aab.yml (AAB ký).

on:
  push:
    branches:
      # Nhánh tích-hợp thật là `develop`. Trước ghi `dev` — nhánh KHÔNG tồn tại, nên
      # mọi lần đẩy lên develop không sinh APK nào, mà cũng không ai thấy đỏ.
      - develop
      - feat/**
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      # `rust/**` BẮT BUỘC có mặt: từ 2026-08-11 chính workflow này dựng lõi Rust
      # (bước `uses: ./.github/actions/rust-android`). Thiếu dòng này thì một commit
      # CHỈ đụng `rust/` không kích hoạt bản dựng nào — tức đúng thay đổi cần được
      # biên dịch lại là thay đổi duy nhất đi lọt. Đo được ở merge commit `ae1085b`
      # của PR #135: `gh api ".../actions/runs?head_sha=ae1085b" --jq '.total_count'`
      # trả 0 — không một workflow nào chạy.
      #
      # `.github/actions/**` phủ CẢ THƯ MỤC chứ không riêng `rust-android`: workflow
      # này còn gọi `./.github/actions/rn-env`, nên liệt kê từng cái là dựng lại đúng
      # cái lỗ vừa vá, chỉ ở tên khác.
      - 'rust/**'
      - '.github/actions/**'
      - '.github/workflows/debug-apk.yml'
      # `instances/**` phải có mặt vì gradle ĐỌC thư mục đó lúc cấu hình: mỗi
      # `instance.json` khai `superapp.rulesVersion` và danh tính native, và cổng
      # ở `android/app/build.gradle` nổ ngay pha cấu hình khi khai sai. Thiếu dòng
      # này thì đúng tệp mà cổng canh là tệp duy nhất sửa được mà không lượt dựng
      # nào chạy. Đo được ở PR #230: nó sửa CẢ HAI `instance.json` và không sinh
      # lượt `Build debug APK` nào — phải bấm `workflow_dispatch` tay mới có.
      - 'instances/**'
  # PR đụng tới tầng native: dựng TRƯỚC khi gộp, không phải sau.
  #
  # Vì sao thêm: đường `push` chỉ nghe `develop` và `feat/**`, nên một PR đổi
  # `android/**` chỉ được dựng SAU khi đã vào `develop` — tức chỗ duy nhất chứng
  # minh được "bản CheckFarm dựng được khi không có Firebase" lại nằm ở phía bên
  # kia của lượt gộp. Cổng đặt sau cửa thì không phải cổng.
  #
  # ⚠ ĐÍNH CHÍNH 2026-08-31 — chỗ này TỪNG ghi "lọc `paths` giữ nguyên (khai một
  # lần ở trên là áp cho cả hai sự kiện)". SAI: YAML khai LẠI một danh sách riêng
  # ngay bên dưới, và danh sách ấy HẸP HƠN đường `push` (thiếu `src/**`,
  # `package.json`). Câu chú thích nằm ngay cạnh thứ nó tả sai, và vẫn sống được
  # vì không ai đối chiếu hai danh sách.
  #
  # Giữ hẹp hơn là CÓ CHỦ Ý: PR chỉ đụng `src/**` đã có `verify-pr.yml` chạy
  # tsc+jest, không cần thêm 45 phút dựng APK. Nhưng `instances/**` thì phải có ở
  # CẢ HAI — lý do ghi ở khối `push` phía trên.
  pull_request:
    branches: [develop, main]
    paths:
      - 'android/**'
      - 'rust/**'
      - 'instances/**'
      - '.github/actions/**'
      - '.github/workflows/debug-apk.yml'
  workflow_dispatch:   # nút bấm build tay

# Gộp 3 PR liên tiếp vào `develop` lúc 07:37-07:38 ngày 17/08 sinh BA lượt dựng APK
# chạy song song (runs 32006654041, 32006680621, 32006716625), mỗi lượt ~40 phút.
# Hai lượt đầu vô nghĩa: đỉnh `develop` đã đổi trước khi chúng dựng xong. Ba lượt
# cùng lúc còn nhân ba lượng đĩa/máy chạy đúng lúc job này đang chết vì hết đĩa.
# `verify-pr.yml` đã có khoá này từ đầu; đường `push` thì chưa.
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CỔNG chất-lượng chạy TRƯỚC: tsc/jest đỏ thì đừng đốt 60 phút build APK. Trước đây
  # không cổng nào chạy tsc/jest trên CI nên suite đỏ lọt lưới nhiều đợt liền.
  verify:
    name: Verify (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      # --forceExit: xem lý do ở `verify-pr.yml` (jest treo vì handle còn mở thì
      # runner chạy tới hết bộ nhớ và báo đỏ dù test đã xanh).
      - name: Unit tests (jest)
        run: npx jest --ci --forceExit

  build-debug-apk:
    name: Build debug APK
    needs: verify
    runs-on: ubuntu-latest
    # `contents: write` để đẩy tệp lên bản phát hành `debug-latest` (xem bước
    # cuối). Mặc định của kho thuộc tổ chức thường là chỉ-đọc, và khi đó `gh
    # release upload` trượt với "Resource not accessible by integration" — lời
    # báo đó nói về quyền chứ không nói về tệp, nên dễ bị đọc thành lỗi khác.
    # Khai TỐI THIỂU: chỉ `contents`, và job `verify` không cần nên không khai.
    permissions:
      contents: write
    # 60 → 90: bước dựng Rust mới thêm vào tốn ~10-15 phút khi nhớ đệm trượt, mà
    # riêng gradle đã 30-39 phút (đo 4 lượt gần nhất). Để 60 thì lượt đầu sau khi
    # đổi Cargo.lock sẽ chạm trần — và chạm trần bị gắn nhãn `cancelled`, tức hỏng
    # mà đọc như có người bấm huỷ. Đúng cách develop giấu lỗi 5 ngày.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⛔ NGUYÊN NHÂN ĐỎ THẬT của job này — 5 lượt liên tiếp 15/08 → 17/08: HẾT ĐĨA.
      # KHÔNG phải gradle hỏng. Chính tiến trình runner chết khi ghi nhật ký của nó:
      #   System.IO.IOException: No space left on device :
      #   '/home/runner/actions-runner/cached/2.336.0/_diag/Worker_20260817-043812-utc.log'
      # (annotation của job 95285397387, và job 95186581759 hôm trước y hệt).
      # Runner chết TRƯỚC khi tải nhật ký lên ⇒ `gh run view --log` trả về gói chỉ có
      # log của job `verify`, còn job này KHÔNG có dòng nào. Lỗi vì thế đọc như "không
      # rõ nguyên nhân" trong khi nguyên nhân nằm nguyên trong annotation.
      # Đó là lý do phải dọn ở ĐẦU job: dọn sau khi thấy đỏ thì đã không còn log để đọc.
      - name: Dọn đĩa runner (ubuntu-latest chỉ còn ~14 GB trống)
        run: |
          echo "TRƯỚC:"; df -h / | tail -1
          # Chỉ gỡ thứ job này KHÔNG dùng. KHÔNG đụng /usr/local/lib/android
          # (Android SDK + NDK — bước dựng Rust cần nó) và KHÔNG xoá cả
          # /opt/hostedtoolcache (setup-node và setup-java cài vào trong đó).
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "SAU:"; df -h / | tail -1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # PHẢI trước gradle: gradle gọi Metro, Metro nướng giá trị @env vào bundle.
      # Thiếu bước này thì mọi biến @env là `undefined` và app trỏ localhost —
      # KHÔNG có lỗi nào được in ra. Lý do đầy đủ ở .github/actions/rn-env/action.yml.
      - name: Sinh biến môi trường React Native
        uses: ./.github/actions/rn-env
        with:
          aladin-api-key: ${{ secrets.ALADIN_API_KEY }}
          cardano-network: ${{ vars.CARDANO_NETWORK || '0' }}

      - name: Create android/gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          # 4 kiến trúc → 2. ĐÂY LÀ NGUYÊN NHÂN ĐỎ THẬT của job này, không phải cái
          # ghi ở chú thích worklets bên dưới. Log run 31786988791:
          #   09:59:54 ##[warning]You are running out of disk space. Free space left: 0 MB
          #   09:59:56 > Task :app:mergeDebugNativeLibs FAILED
          #   09:59:58 tee: android-debug.log: No space left on device
          # Runner ubuntu-latest có ~14 GB trống; nhân 4 ABI với .so Rust + Hermes +
          # maplibre + TFLite thì không đủ. Bản này là APK SIDELOAD để đội thực địa cài
          # lên MÁY THẬT — máy thật chỉ có arm. x86/x86_64 là kiến trúc máy ảo, ai cần
          # chạy máy ảo thì dựng tại chỗ. Bỏ 2 cái đó cắt gần nửa dung lượng native.
          # ⚠ Cổng "Soi chính tệp APK" bên dưới vì thế CHỈ soi 2 ABI này — khác
          # android-aab.yml (soi thêm x86_64, vì bản AAB có đóng gói x86_64).
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          # Tắt tích hợp worklets của expo-modules-core. KHÔNG có dòng này thì
          # WorkletRuntimeInstaller.cpp biên dịch với WORKLETS_ENABLED=1 và đòi
          # <worklets/Compat/StableApi.h> — header chỉ có từ react-native-worklets
          # 0.8.0, mà dự án ghim 0.7.4 ⇒ build native gãy. Bản vá
          # patches/expo-modules-core+56.0.22.patch mở đúng công tắc này, nhưng
          # android/gradle.properties bị gitignore và bị heredoc dưới đây ghi đè,
          # nên bản vá vô tác dụng suốt từ 26/07 — 10/10 lần chạy CI đỏ vì nó.
          expo.enableWorkletsIntegration=false
          EOF
          echo "gradle.properties created (JVM heap: 4096m)"

      # PHẢI trước gradle: gradle chỉ đóng gói .so có sẵn trong jniLibs, không dựng.
      # Lý do đầy đủ ở .github/actions/rust-android/action.yml.
      - name: Dựng Rust core (taad_enclave_core + chat_mls)
        uses: ./.github/actions/rust-android

      - name: Build debug APK
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew
          # Flavor TƯỜNG MINH. `assembleDebug` (không flavor) dựng CẢ HAI app rồi
          # đổ gói vào hai thư mục khác nhau — bước "Locate APK" bên dưới chỉ lấy
          # một, nên để nó dựng cả hai là tốn thời gian mà không dùng tới.
          ./gradlew assembleAladinDebug --no-daemon --stacktrace 2>&1 | tee android-debug.log

      # Dựng luôn bản CheckFarm — KHÔNG để giao ra, mà để CHỨNG MINH nó dựng được.
      #
      # CheckFarm cố ý không có `src/checkfarm/google-services.json`: app này chưa
      # đẩy tin nền nên không có lý do mở tài khoản Firebase trước khi dựng được
      # (xem khối "Firebase: CÓ ĐIỀU KIỆN" trong `android/app/build.gradle`). Cách
      # duy nhất để lời khẳng định đó không thành lời hứa suông là CI dựng thật.
      #
      # Bước này đỏ = một trong hai điều đã hỏng: hoặc bước tắt Firebase theo flavor
      # không còn chạy, hoặc CheckFarm đã có tệp cấu hình mà nó sai gói.
      - name: Dựng bản CheckFarm — chứng minh dựng được khi KHÔNG có Firebase
        run: |
          set -eo pipefail
          cd android
          ./gradlew assembleCheckfarmDebug --no-daemon --stacktrace 2>&1 | tee android-checkfarm.log
          CF=$(find app/build/outputs/apk/checkfarm/debug -name "*.apk" | head -1)
          if [ -z "$CF" ]; then
            echo "::error::CheckFarm APK không thấy"
            find app/build/outputs -type f | head -20
            exit 1
          fi
          echo "✅ CheckFarm APK: $CF ($(stat -c%s "$CF") bytes)"
          # Giao ra luôn, không chỉ chứng minh. Bản CheckFarm chưa có mục trên
          # Google Play (cần Play Console của pháp nhân CheckFarm), nên đường duy
          # nhất để người thử cầm được nó là tải tệp này về cài thẳng.
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$CF" "$GITHUB_WORKSPACE/dist/checkfarm-debug.apk"

      - name: Locate APK
        id: apk-info
        run: |
          # Đường dẫn nay có tên flavor. Dò ở thư mục cha kèm `head -1` là để
          # `find` nhặt gói của app nào đứng trước theo thứ tự chữ cái — đúng loại
          # hỏng câm: bản dựng xanh, tệp giao ra là của app kia.
          APK_FILE=$(find android/app/build/outputs/apk/aladin/debug -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK not found"
            find android/app/build/outputs -type f | head -20
            exit 1
          fi
          echo "✅ APK: $APK_FILE ($(stat -c%s "$APK_FILE") bytes)"
          mkdir -p dist
          cp "$APK_FILE" dist/superapp-debug.apk

      # Cùng lý do với bước tương ứng ở android-aab.yml: bước "Dựng Rust core" chỉ
      # kiểm ĐẦU VÀO của gradle. Bản đội thực địa cài là bản này, nên nếu gói thiếu
      # `.so` hoặc nướng nhầm host thì người ra vườn là người phát hiện, không phải CI.
      - name: Soi chính tệp APK — .so và biến môi trường
        run: |
          set -eo pipefail
          WORK=$(mktemp -d)
          unzip -q -o dist/superapp-debug.apk -d "$WORK"
          FAIL=0

          echo "── Thư viện native theo ABI ─────────────────────────────────"
          ls "$WORK/lib/" || true
          for ABI in arm64-v8a armeabi-v7a; do
            for LIB in libtaad_enclave_core.so libchat_mls.so; do
              if [ ! -f "$WORK/lib/$ABI/$LIB" ]; then
                echo "::error::THIẾU $ABI/$LIB — máy thực địa sẽ không tạo được danh tính, và app KHÔNG báo lỗi"
                FAIL=1
              else
                echo "  OK  $ABI/$LIB"
              fi
            done
          done

          echo "── Biến môi trường nướng vào bundle ────────────────────────"
          BUNDLE="$WORK/assets/index.android.bundle"
          if [ -f "$BUNDLE" ]; then
            strings "$BUNDLE" > "$WORK/strings.txt"
            for MUST in 'api.orilife.io' 'api.aladin.work' 'api.proofchat.me'; do
              grep -qF "$MUST" "$WORK/strings.txt" \
                && echo "  OK  có $MUST" \
                || { echo "::error::Bundle KHÔNG có '$MUST' — biến @env là undefined"; FAIL=1; }
            done
            for BAD in 'staging-api.orilife.io' 'localhost:8001'; do
              grep -qF "$BAD" "$WORK/strings.txt" \
                && { echo "::error::Bundle CÓ '$BAD' — dựng từ .env sai"; FAIL=1; } \
                || echo "  OK  không có $BAD"
            done
          else
            # Bản debug có thể nạp bundle qua Metro thay vì nhúng — đó là trạng thái
            # THỨ BA, không phải "đạt". Nói rõ ra thay vì im lặng cho qua.
            echo "::warning::APK không nhúng index.android.bundle (debug nạp qua Metro?) — KHÔNG ĐO ĐƯỢC phần biến môi trường"
          fi

          rm -rf "$WORK"
          [ "$FAIL" -eq 0 ] || { echo "::error::APK không đạt"; exit 1; }

      # ── GIAO QUA BẢN PHÁT HÀNH, KHÔNG QUA KHO TỆP ACTIONS ──────────────────
      #
      # `actions/upload-artifact` ghi vào kho tệp Actions, và kho đó CÓ HẠN MỨC:
      # gói free của tổ chức là 500 MB, dùng chung với GitHub Packages. Một gói
      # hai APK nặng 193 MB, nên kho chỉ chứa nổi HAI bản cùng lúc. Đo
      # 2026-09-06: 37 tệp / 6.528 MB, và lượt dựng đỏ ở đúng bước cuối:
      #
      #   Failed to CreateArtifact: Artifact storage quota has been hit.
      #
      # Bản dựng vẫn xanh; chỉ tệp là không ra. Hạ thời hạn giữ và ghi đè theo
      # nhánh chỉ dời được ngày chạm trần, KHÔNG gỡ được trần — một ứng dụng 96 MB
      # thì không có cách xếp nào cho vừa 500 MB ở mức đồng thời có ích.
      #
      # Tệp đính kèm BẢN PHÁT HÀNH không tính vào hạn mức đó. Tài liệu billing
      # định nghĩa phần bị tính là "GitHub Actions artifacts và GitHub Packages";
      # Releases không nằm trong danh sách:
      # https://docs.github.com/en/billing/concepts/product-billing/github-actions
      #
      # Dùng MỘT bản phát hành nháp cố định tên `debug-latest`, tệp đính kèm mang
      # tên nhánh và ghi đè mỗi lượt (`--clobber`). Không tạo bản phát hành mới
      # theo từng lượt đẩy: kho sẽ đầy trang phát hành, và mỗi bản mới lại gửi
      # thông báo cho người theo dõi kho.
      #
      # ⚠ Đây là bản NHÁP (`--prerelease`) và tên tag cố định. KHÔNG đổi nó thành
      #    bản phát hành thật, và KHÔNG đính bản đã ký lên đây — chỗ này là bản
      #    debug ký bằng `debug.keystore` mà gradle tự sinh, không phải bản nộp kho.
      - name: Suy tên tệp theo nhánh
        run: |
          NHANH="${{ github.head_ref || github.ref_name }}"
          echo "HAU_TO=$(echo "$NHANH" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Giao APK qua bản phát hành `debug-latest`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          mv dist/superapp-debug.apk  "dist/aladin-debug-${HAU_TO}.apk"
          mv dist/checkfarm-debug.apk "dist/checkfarm-debug-${HAU_TO}.apk"

          # Tạo bản phát hành nếu chưa có. `|| true` ở đây KHÔNG phải nuốt lỗi:
          # hai lượt dựng song song cùng thấy "chưa có" rồi cùng tạo, và lượt thua
          # nhận lỗi "đã tồn tại" — đúng trạng thái mong muốn. Bước tải lên ngay
          # dưới mới là chỗ phán đúng/sai, và nó KHÔNG có `|| true`.
          # Phần mô tả viết ra tệp rồi truyền bằng `--notes-file`. Nhét chuỗi
          # nhiều dòng thẳng vào `--notes` làm gãy chính khối YAML này: dòng nào
          # thụt ít hơn khối `run: |` thì YAML coi là đã hết khối.
          cat > /tmp/mo-ta-phat-hanh.md <<'MOTA'
          Tệp đính kèm ở đây do lượt dựng tự đẩy lên. Mỗi nhánh một bộ, bản mới đè bản cũ.

          - `aladin-debug-<nhánh>.apk` — bản Aladin
          - `checkfarm-debug-<nhánh>.apk` — bản CheckFarm

          Ký bằng `debug.keystore` do gradle tự sinh, KHÔNG phải khoá tải lên.
          Không nộp tệp ở đây lên cửa hàng.
          MOTA
          sed -i 's/^          //' /tmp/mo-ta-phat-hanh.md

          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest \
              --prerelease \
              --title "Bản debug mới nhất (cài thẳng máy — KHÔNG phải bản phát hành)" \
              --notes-file /tmp/mo-ta-phat-hanh.md \
            || true

          gh release upload debug-latest \
            "dist/aladin-debug-${HAU_TO}.apk" \
            "dist/checkfarm-debug-${HAU_TO}.apk" \
            --clobber

          echo "URL_PHAT_HANH=$(gh release view debug-latest --json url --jq .url)" >> "$GITHUB_ENV"

      - name: Build summary
        run: |
          echo "## SuperApp Debug APK — tải về cài test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tệp nằm ở bản phát hành **[debug-latest](${URL_PHAT_HANH})**, KHÔNG còn ở mục Artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hai ứng dụng dựng từ nhánh \`${HAU_TO}\`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`aladin-debug-${HAU_TO}.apk\` — bản Aladin" >> $GITHUB_STEP_SUMMARY
          echo "- \`checkfarm-debug-${HAU_TO}.apk\` — bản CheckFarm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tải tệp cần thử về, copy sang điện thoại Android, bật 'Cài từ nguồn không xác định' rồi mở tệp để cài." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nhật ký dựng nằm ở tab Logs của chính lượt chạy này." >> $GITHUB_STEP_SUMMARY
