name: Android Debug APK (SuperApp — sideload test)

# APK debug để tải về cài thẳng máy thật mà test — KHÔNG cần Play Store,
# KHÔNG cần keystore ký (dùng debug.keystore gradle tự sinh). Khác android-aab.yml (AAB ký).

on:
  push:
    branches:
      - develop        # nhánh tích-hợp THẬT (trước ghi 'dev' — sai tên → develop không build APK nào)
      - feat/**
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/debug-apk.yml'
  workflow_dispatch:   # nút bấm build tay

jobs:
  # CỔNG chất-lượng: đỏ tsc/jest thì KHÔNG tốn 60 phút build APK (bắt hồi-quy sớm).
  # Trước đây không cổng nào chạy tsc/jest → suite đỏ lọt lưới (vd resolveGateItems sau #53).
  verify:
    name: Verify (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (jest)
        run: npx jest --ci

  build-debug-apk:
    name: Build debug APK
    needs: verify          # chỉ build khi verify xanh
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;26.1.10909125'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Create android/gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          # Chỉ 2 ABI máy-thật (arm64 phổ biến + armeabi-v7a máy cũ/rẻ nông dân hay dùng).
          # Bỏ x86/x86_64 (chỉ giả-lập) → APK universal gọn hơn nhiều (trước 4 ABI = 258MB).
          reactNativeArchitectures=arm64-v8a,armeabi-v7a
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          EOF
          echo "gradle.properties created (JVM heap: 4096m)"

      - name: Build debug APK
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee android-debug.log

      - name: Locate APK
        id: apk-info
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK not found"
            find android/app/build/outputs -type f | head -20
            exit 1
          fi
          echo "✅ APK: $APK_FILE ($(stat -c%s "$APK_FILE") bytes)"
          mkdir -p dist
          cp "$APK_FILE" dist/superapp-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: superapp-debug-apk
          path: |
            dist/superapp-debug.apk
            android-debug.log
          # 3 ngày (trước 30): APK ~100-150MB × nhiều bản 30 ngày = vỡ quota Actions
          # (~500MB gói free) → upload chết "storage quota has been hit" → không tải được bản test.
          retention-days: 3

      - name: Build summary
        run: |
          echo "## SuperApp Debug APK — tải về cài test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Tải artifact **superapp-debug-apk** (nút góc phải trên trang này)." >> $GITHUB_STEP_SUMMARY
          echo "2. Giải nén, copy \`superapp-debug.apk\` sang điện thoại Android." >> $GITHUB_STEP_SUMMARY
          echo "3. Bật 'Cài từ nguồn không xác định' → mở file APK để cài." >> $GITHUB_STEP_SUMMARY
