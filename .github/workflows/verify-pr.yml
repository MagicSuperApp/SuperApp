name: Verify PR (tsc + jest + cargo)

# VÌ SAO CÓ FILE NÀY:
# Cổng chất-lượng `verify` trong `debug-apk.yml` chạy ở `on: push` tới `develop` —
# tức CHỈ chạy SAU KHI đã merge. PR không bao giờ bị kiểm, nên mọi PR hiện lên là
# "no checks reported" và người duyệt không có gì để nhìn. Đó đúng là cách develop
# đỏ tsc từ 05/08 (issue #106): hai hệ đa ngôn ngữ trộn nhau lọt qua vì không cổng
# nào chạy TRƯỚC merge. Cổng này chạy TRÊN PR, trước khi hỏng vào nhánh chung.
#
# Cố ý KHÔNG build APK ở đây: chỉ tsc + jest (~3-5 phút). Việc dựng APK/AAB vẫn để
# `debug-apk.yml` / `android-aab.yml` lo sau merge.
#
# VÀ MỘT LỖ NỮA, VÁ 2026-08-14: cổng này trước chỉ chạy tsc + jest, tức cổng chạy
# TRƯỚC merge không hề chạm tới Rust.
#
# ⚠ Bản viết đầu của khối này nói "KHÔNG cổng nào trong repo biên dịch Rust" — SAI,
# và sai vì đo nhầm chỗ: phép đếm grep `cargo|rustup|jniLibs` chạy trên ba tệp
# workflow, trong khi bước dựng nằm trong composite action gọi qua `uses:`. Thực tế
# `android-aab.yml:169` và `debug-apk.yml:113` đều gọi
# `./.github/actions/rust-android` từ 2026-08-11 (`1db7871`, `2524427`), và action đó
# dựng 2 crate × 3 ABI rồi kiểm 6 tệp `.so`. Ghi lại câu sai này thay vì lặng lẽ xoá,
# vì nó đã suýt thành "sự thật" chỉ nhờ nằm trong tệp workflow.
#
# Hai lỗ THẬT, và đây là thứ job `rust` + bản vá `paths:` đóng:
#   1. Hai workflow kia chạy `on: push`, tức SAU merge. PR #135 (sửa
#      `rust/taad_enclave_core/src/taad_did.rs`) hiện dấu xanh, mà dấu đó chỉ nói về
#      tsc/jest.
#   2. `paths:` của hai workflow kia KHÔNG liệt kê `rust/**`, nên commit chỉ đụng
#      `rust/` không kích hoạt bản dựng nào. Đo được ở merge commit `ae1085b` của
#      PR #135: `gh api ".../actions/runs?head_sha=ae1085b" --jq '.total_count'` → 0.
#      Không một workflow nào chạy.

on:
  pull_request:
    branches: [develop, main]

# PR đẩy thêm commit thì huỷ lượt chạy cũ — đỡ tốn phút chạy.
concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` để bước soi khoá dưới đây có sha gốc của PR trong
          # kho local. Bản cắt nông mặc định (depth 1) KHÔNG có nó, và
          # `git diff base...head` sẽ chết bằng "bad object" chứ không phải "xanh".
          fetch-depth: 0

      # Chốt này thay cho "secret scanning" của GitHub — tính năng đó chỉ có ở kho
      # công khai hoặc gói trả tiền, kho này riêng tư + org gói free nên KHÔNG có
      # (đo: `GET /repos/.../rulesets` → 403 "Upgrade to GitHub Pro..."). Máy anh
      # có chốt pre-commit tương tự, nhưng nó nằm ở MÁY anh — commit từ máy khác
      # không đi qua nó. Đặt TRƯỚC `npm install` để đỏ sớm, khỏi tốn 3 phút cài.
      - name: Soi khoá/token lọt vào diff
        run: bash scripts/soi-khoa.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      # Cổng này soi KHE GIỮA các tầng — chỗ mà mọi cổng khác trong tệp này không nhìn
      # tới. `tsc`/`jest` chỉ chứng minh phía TS; `cargo test` chỉ chứng minh phía Rust.
      # Một hàm Rust không có cầu thì cả hai vẫn xanh, và nó chết lặng. Đã xảy ra thật:
      # commit 5ab0635 (25/06/2026) đổ 46 hàm Rust vào repo với đúng 3 cây cầu, và không
      # ai biết trong gần hai tháng. Không cần cài gì — chỉ đọc tệp nguồn, chạy vài giây.
      - name: Soi mạch dọc (cầu native không được đứt)
        run: node scripts/soi-mach.js

      # Ghim nội dung hai cây vendored bằng băm tree của git. Cần `fetch-depth` đủ để
      # `git rev-parse HEAD:<đường dẫn>` chạy được — bước checkout ở trên đã lấy cây
      # làm việc nên đối tượng tree có sẵn cục bộ, không cần lịch sử.
      #
      # Cổng này bắt bản chép trong kho TRÔI, và KHÔNG bắt được kho nguồn đổi. Chính
      # nó in ra lời rào đó mỗi lượt chạy, nên đừng đọc màu xanh của nó thành "hai cây
      # còn khớp". Nửa còn lại dựa vào cam kết gửi thư của bên giữ nguồn.
      - name: Ghim nội dung cây vendored
        run: node scripts/check-vendored-tree.js

      # `--forceExit`: test xanh rồi mà jest vẫn treo thì đó là handle còn mở, KHÔNG
      # phải mã sai — nhưng runner cứ chạy tiếp tới lúc hết bộ nhớ và báo đỏ (đã xảy
      # ra: treo ~19 phút rồi exit 134). Nguyên nhân gốc là bộ đếm giờ rò trong
      # `runtimeGate.probeOne` (đã vá ở PR này). Cờ này là lưới đỡ cho những vòng lặp
      # `Animated` của màn được render trong test — chúng vốn chạy mãi theo thiết kế.
      # Kết quả test đã in TRƯỚC khi thoát nên cờ này không che được ca đỏ nào.
      # ── VÌ SAO CHẠY HAI LƯỢT ─────────────────────────────────────────────────
      # Kho này dựng NHIỀU app từ một nền mã (`instances/<mã>`). Tới 2026-09-10
      # bước này chạy MỘT lượt `npx jest` và cả tệp workflow không có bước sinh tệp
      # biến môi trường nào ⟹ `APP_INSTANCE` rỗng ⟹ `resolveInstance` trả app mặc
      # định (`src/config/instance.config.ts:524`). Tức mọi lần duyệt yêu cầu gộp
      # mã từ trước tới nay chỉ chứng minh được MỘT app; đường mã riêng của app kia
      # chưa lần nào chạy trong CI. Đã có một bài đỏ thật lọt qua đúng khe này.
      #
      # `--cacheDirectory` RIÊNG cho từng lượt là phần bắt buộc, không phải tối ưu:
      # `react-native-dotenv` là bộ chuyển mã của Babel, nó nướng giá trị vào lúc
      # BIẾN ĐỔI MÃ. Dùng chung bộ đệm thì lượt sau ăn lại mã đã nướng giá trị của
      # lượt trước, hai lượt cho ra CÙNG một app — và cả hai vẫn xanh, báo cáo vẫn
      # in hai tên app khác nhau. Đo được ca đó thật: đọc `process.env` trong chính
      # tệp bài kiểm cũng bị nướng theo.
      #
      # `EXPECTED_APP_INSTANCE` là lời khai ĐỘC LẬP của CI, cố ý khác tên với
      # `APP_INSTANCE`. `src/config/instanceUnderTest.test.ts` so hai bên; lệch thì
      # đỏ. Đừng gộp hai biến làm một — một nguồn đóng vai hai bên của phép so thì
      # phép so ấy không phân biệt được gì.
      - name: Unit tests (jest) — app `aladin`
        env:
          APP_INSTANCE: aladin
          EXPECTED_APP_INSTANCE: aladin
        run: npx jest --ci --forceExit --cacheDirectory /tmp/jest-cache-aladin

      - name: Unit tests (jest) — app `checkfarm`
        env:
          APP_INSTANCE: checkfarm
          EXPECTED_APP_INSTANCE: checkfarm
        run: npx jest --ci --forceExit --cacheDirectory /tmp/jest-cache-checkfarm

  rust:
    name: Verify Rust (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # PHẢI là 2, không phải mặc-định 1. Bản checkout của `pull_request` là
          # commit GỘP THỬ; depth 1 chỉ lấy đúng commit đó, hai cha nằm ở ranh giới
          # nông nên KHÔNG có cây tệp để `git diff` — bước dò phạm vi dưới sẽ ngã vì
          # lý do không liên quan gì tới PR. Depth 2 lấy đủ cả hai cha.
          fetch-depth: 2

      # Chỉ chạy phần nặng khi PR THẬT SỰ đụng `rust/`. Không dùng `on.pull_request
      # .paths` vì bộ lọc đó chặn CẢ workflow — mọi PR không đụng Rust sẽ mất luôn
      # cổng tsc + jest, tức vá lỗ này thì thủng lỗ to hơn.
      #
      # Ở event `pull_request`, actions/checkout lấy commit GỘP THỬ: `HEAD^1` là
      # nhánh đích, `HEAD^2` là nhánh nguồn. So hai cái đó thì không phải fetch thêm
      # và không cần action bên thứ ba.
      #
      # Nói cho đúng: phép so này KHÔNG bằng chính xác "tập tệp PR đổi" — nó còn
      # tính cả thứ nhánh đích có mà nhánh nguồn chưa có. Nên nó sai được theo đúng
      # MỘT chiều: chạy cargo trong lượt lẽ ra không cần. Tốn vài phút, không bỏ sót
      # lượt nào — và đó là chiều sai duy nhất chấp nhận được cho một cổng kiểm.
      # (Bản chuẩn cần `git merge-base`, mà cái đó đòi lịch sử sâu hơn depth 2.)
      - name: PR có đụng rust/ không
        id: scope
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^1 HEAD^2 | grep -qE '^rust/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "PR có đổi tệp dưới rust/ → chạy cargo test."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR không đụng rust/ → bỏ qua (vẫn báo xanh)."
          fi

      - name: Nhớ đệm cargo
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/taad_enclave_core/target
            rust/chat_mls/target
          key: cargo-verify-${{ runner.os }}-${{ hashFiles('rust/*/Cargo.toml') }}
          restore-keys: cargo-verify-${{ runner.os }}-

      # `rustup`/`cargo` có sẵn trên ubuntu-latest.
      #
      # KHÔNG dùng `--locked`, và đây là dữ kiện chứ không phải lười: `git ls-files
      # rust/taad_enclave_core/Cargo.lock rust/chat_mls/Cargo.lock` trả RỖNG — hai
      # tệp có trên máy nhưng chưa bao giờ vào git (`.gitignore` cũng không nhắc
      # tới chúng, nên đây là bỏ sót chứ không phải cố ý). Bản checkout của CI không
      # có lock, `--locked` sẽ đỏ ngay lượt đầu vì lý do chẳng liên quan gì tới mã.
      #
      # ⚠ Hệ quả còn treo: mỗi lượt dựng tự giải phụ thuộc lại, nên bản Codemagic
      # mang ra vườn hôm nay và bản dựng tuần sau CÓ THỂ khác dep mà không ai đổi
      # một dòng mã nào. Việc đưa hai Cargo.lock vào git là việc riêng, đáng làm,
      # nhưng nó đổi thứ Codemagic đang dựng nên không gộp chung vào lần vá cổng
      # này — tách ra để nếu có vỡ thì biết vỡ vì cái gì.
      - name: cargo test — taad_enclave_core
        if: steps.scope.outputs.run == 'true'
        run: cargo test --manifest-path rust/taad_enclave_core/Cargo.toml

      - name: cargo test — chat_mls
        if: steps.scope.outputs.run == 'true'
        run: cargo test --manifest-path rust/chat_mls/Cargo.toml

      # ── VÌ SAO PHẢI CÓ BƯỚC THỨ HAI, THEO TARGET ANDROID ──────────────────
      #
      # Hai bước `cargo test` trên chạy trên `ubuntu-latest`, tức dựng cho host
      # `x86_64-unknown-linux-gnu`. Nhưng đúng tầng cầu nối sang Kotlin lại nằm
      # sau một cổng biên dịch có điều kiện:
      #
      #   rust/taad_enclave_core/src/lib.rs:28-29   #[cfg(target_os = "android")]
      #   rust/chat_mls/src/lib.rs:18-19            #[cfg(target_os = "android")]
      #
      # và `jni` chỉ khai dưới `[target.'cfg(target_os = "android")'.dependencies]`.
      # Trên host, rustc KHÔNG ĐỌC một dòng nào của hai tệp `android_jni.rs`
      # (297 + 236 = 533 dòng). Đã dựng crate thử để đo: cùng một tệp, có dòng
      # `cfg` thì `cargo check` trả 0 kể cả khi nội dung là rác hoàn toàn; gỡ
      # dòng `cfg` ra thì trả 101.
      #
      # Ca hỏng nếu chỉ có cổng host: đổi tên một symbol
      # `Java_com_aladincontract_company_TaadEnclaveModule_native…`
      # (`android_jni.rs:27`) hoặc nâng `jni` 0.21→0.22 có đổi API → cổng xanh
      # trong vài giây → gộp → `cargo ndk build` vẫn ra `.so` hợp lệ (chỉ sai
      # symbol) → bước kiểm jniLibs vẫn xanh vì tệp CÓ TỒN TẠI → AAB phát hành
      # → `System.loadLibrary` thành công → `UnsatisfiedLinkError` lúc gọi
      # method → Kotlin bắt, đặt `libLoaded=false` → toàn bộ tầng PhoenixKey
      # (ví · DID · Master_KEK · seed) tắt câm. Đúng loại lỗi mà
      # `.github/actions/rust-android/action.yml` đã ghi: "build xanh, người
      # dùng mới thấy".
      #
      # `check` chứ không `build`: chỉ cần rustc ĐỌC được 533 dòng đó và soi
      # kiểu, không cần ra tệp `.so`. Một ABI là đủ — ba ABI dùng chung mã.
      - name: Setup Android SDK (chỉ NDK, cho cargo ndk check)
        if: steps.scope.outputs.run == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.1.12297006'

      - name: cargo check — cầu JNI (target Android thật)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -eo pipefail
          rustup target add aarch64-linux-android
          command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked
          ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "::error::Không thấy NDK trong $ANDROID_SDK_ROOT/ndk"
            exit 1
          fi
          export ANDROID_NDK_HOME
          for crate in taad_enclave_core chat_mls; do
            echo "── soi cầu JNI: $crate ──"
            ( cd "rust/$crate" && cargo ndk -t arm64-v8a check --lib )
          done
