apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    // CỐ Ý KHÔNG dùng entryFile/cliFile/bundleCommand="export:embed" mà
    // install-expo-modules thêm vào: app vẫn đóng gói bằng RN CLI + metro RN gốc.
    // Chỉ mượn expo-modules-core để autolink expo-gl (nền 3D).
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ── MỖI APP = MỘT THƯ MỤC TRONG `instances/` ────────────────────────────
//
// Trước đợt này, tên app + mã gói + biểu tượng nằm rải ở ba chỗ: khối
// `productFlavors` viết tay dưới đây, `strings.xml`, và `src/main/res/mipmap-*`.
// Hệ quả: đối tác muốn dựng app mang nhận diện của họ thì phải nhờ người sửa
// gradle hộ. Đó là chỗ nghẽn ở NGƯỜI, không phải ở kỹ thuật.
//
// Nay gradle ĐỌC thư mục. Thêm một app = thêm `instances/<mã>/instance.json`
// + một ảnh vuông 1024 ở `instances/<mã>/brand/icon-1024.png`, rồi chạy
// `python3 scripts/sinh-bieu-tuong.py <mã>`. KHÔNG sửa tệp này.
//
// Chi tiết + ví dụ đầy đủ: `instances/README.md`.
def thuMucApp = new File(rootDir, '../instances')

// ── LUẬT SUPERAPP — phiên bản đọc từ chính tệp luật ─────────────────────
//
// Mỗi `instance.json` phải khai `superapp.rulesVersion` ĐÚNG số này. Sửa luật
// là nâng số ở `instances/LUAT-SUPERAPP.md`, và khi ấy mọi app đỏ cho tới khi
// có người đọc luật mới rồi ký nhận trong tệp của app mình.
//
// Cố ý làm phiền: luật không tự lan sang app đã có. Không có bước này thì một
// ràng buộc mới thêm vào tài liệu sẽ đúng với app viết SAU nó và im lặng sai
// với mọi app viết TRƯỚC — mà không ai đỏ.
def tepLuat = new File(thuMucApp, 'LUAT-SUPERAPP.md')
if (!tepLuat.isFile()) {
    throw new GradleException("Không thấy ${tepLuat} — mọi app khai tuân luật SuperApp, mà tệp luật không còn")
}
def khopLuat = (tepLuat.text =~ /rulesVersion:\s*(\d+)/)
if (!khopLuat) {
    throw new GradleException("${tepLuat} thiếu dòng `<!-- rulesVersion: N -->` ở đầu tệp")
}
def LUAT_HIEN_TAI = khopLuat[0][1] as int

// ── MIỄN TẠM DID — hai app có TRƯỚC khi luật §1 ra đời ──────────────────
//
// 2026-08-30: chưa có đường cấp DID cho một *instance* (khác DID của người
// dùng, thứ đã có sẵn). Hai app này ra đời trước ràng buộc đó nên được miễn
// TẠM, ghi thẳng tên ở đây để ai cũng thấy đó là NỢ chứ không phải mặc định.
//
// ⛔ KHÔNG thêm tên vào danh sách này để cho một app mới đi lọt. Danh sách chỉ
//    được RÚT NGẮN. App thứ ba trở đi phải có DID thật — đó là toàn bộ điểm
//    của luật §1, và nới ở đây là gỡ luôn cái cổng.
def MIEN_TAM_DID = ['aladin', 'checkfarm'] as Set

def cacApp = (thuMucApp.listFiles() ?: new File[0])
        .findAll { it.isDirectory() && new File(it, 'instance.json').isFile() }
        .sort { it.name }
        .collect { thuMuc ->
            def khai = new groovy.json.JsonSlurper().parse(new File(thuMuc, 'instance.json'))
            // Sai ở đây phải NỔ, không được đoán: một `applicationId` rỗng lọt
            // xuống dưới là dựng ra gói mang mã của app khác, và không có triệu
            // chứng nào cho tới lúc nộp cửa hàng.
            if (khai.id != thuMuc.name) {
                throw new GradleException("instances/${thuMuc.name}/instance.json khai id='${khai.id}' — phải trùng tên thư mục")
            }
            if (!(khai.id ==~ /^[a-z][a-z0-9]*$/)) {
                throw new GradleException("mã app '${khai.id}' phải là chữ thường + số, bắt đầu bằng chữ (gradle dùng nó làm tên flavor)")
            }
            if (!khai.android?.applicationId) {
                throw new GradleException("instances/${khai.id}/instance.json thiếu android.applicationId")
            }
            if (!khai.displayName) {
                throw new GradleException("instances/${khai.id}/instance.json thiếu displayName")
            }
            // ── Luật SuperApp (instances/LUAT-SUPERAPP.md) ──────────────
            if (khai.superapp == null) {
                throw new GradleException(
                    "instances/${khai.id}/instance.json thiếu khối `superapp`.\n" +
                    "  Một app dựng từ kho này phải khai nó tuân luật nào. Đọc instances/LUAT-SUPERAPP.md rồi thêm:\n" +
                    "    \"superapp\": { \"rulesVersion\": ${LUAT_HIEN_TAI}, \"phoenixDid\": \"did:...\" }")
            }
            if (khai.superapp.rulesVersion != LUAT_HIEN_TAI) {
                throw new GradleException(
                    "instances/${khai.id}: khai rulesVersion=${khai.superapp.rulesVersion}, luật hiện hành là ${LUAT_HIEN_TAI}.\n" +
                    "  Đọc instances/LUAT-SUPERAPP.md rồi sửa số — đừng sửa số mà không đọc.")
            }
            def did = khai.superapp.phoenixDid
            if (did == null) {
                if (!MIEN_TAM_DID.contains(khai.id)) {
                    throw new GradleException(
                        "instances/${khai.id}: `superapp.phoenixDid` là null.\n" +
                        "  Luật §1 — mỗi app một danh tính PhoenixKey riêng. Một app không có danh tính\n" +
                        "  thì nó là một thư mục, không phải một app trong hệ sinh thái.")
                }
            } else if (!(did ==~ /^did:[a-z0-9]+:[A-Za-z0-9._:-]+$/)) {
                throw new GradleException("instances/${khai.id}: `superapp.phoenixDid` = '${did}' không đúng hình một DID")
            }
            khai
        }
if (cacApp.isEmpty()) {
    throw new GradleException("Không thấy app nào trong ${thuMucApp} — mỗi app cần một thư mục chứa instance.json")
}
def trungMaGoi = cacApp.groupBy { it.android.applicationId }.findAll { it.value.size() > 1 }
if (trungMaGoi) {
    throw new GradleException("Hai app dùng chung applicationId ${trungMaGoi.keySet()} — cửa hàng coi đó là MỘT app, bản sau đè bản trước")
}

// Luật §1, nửa sau: "RIÊNG" nghĩa là không ai dùng chung. `null` không tính là
// trùng nhau — hai app cùng CHƯA có danh tính thì chưa vi phạm, chỉ là chưa có.
def trungDid = cacApp.findAll { it.superapp.phoenixDid != null }
        .groupBy { it.superapp.phoenixDid }.findAll { it.value.size() > 1 }
if (trungDid) {
    throw new GradleException("Hai app dùng chung phoenixDid ${trungDid.keySet()} — luật §1 đòi mỗi app một danh tính RIÊNG")
}


    android {
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // ── MỖI APP MỘT KHOÁ KÝ ─────────────────────────────────────────────
        //
        // Trước bản này chỉ có MỘT khối `release` mang bốn biến `ORILIFE_UPLOAD_*`,
        // và `buildTypes.release` gán nó cho MỌI flavor. Nghĩa là
        // `assembleCheckfarmRelease` ký CheckFarm bằng khoá của Aladin.
        //
        // ⛔ Đó là hỏng ĐẮT, tuy KHÔNG phải không sửa được. Một mục CheckFarm
        //    trót nhận bản ký bằng khoá Aladin thì phía CheckFarm phải xin đặt
        //    lại khoá tải lên mới nộp được bản của họ — làm được, nhưng đi qua
        //    bộ phận hỗ trợ của Google và không nhanh. Nặng hơn: chừng nào chưa
        //    đặt lại, Aladin Contract vẫn ký được bản cập nhật cho app của pháp
        //    nhân khác. Đó mới là lý do tách khoá, không phải chuyện mất vĩnh viễn.
        //
        //    Bản trước viết ở đây là "KHÔNG BAO GIỜ nộp được nữa, cũng không
        //    chuyển giao được". Sai với app dùng Play App Signing — tài liệu
        //    Google nói rõ mất khoá tải lên thì không bị khoá khỏi app, và không
        //    nói gì về chuyện chuyển giao. Chi tiết + trích nguyên văn ở
        //    `scripts/tao-khoa-ky.sh`, khối đầu tệp.
        //
        // Nay tên biến SUY từ mã app: `aladin` → `ALADIN_UPLOAD_*`,
        // `checkfarm` → `CHECKFARM_UPLOAD_*`. Đối tác thêm `instances/<mã>/` là có
        // ngay vùng khoá riêng mang tên họ, không phải nhờ ai sửa tệp này.
        // ⛔ Phải soát ĐỦ BỐN, không phải chỉ `STORE_FILE`.
        //
        // Bản trước chỉ hỏi `hasProperty(STORE_FILE)` rồi đọc thẳng ba cái còn lại.
        // Nạp thiếu một bí mật — chuyện thường gặp nhất khi thêm app mới, vì phải tạo
        // bốn secret bằng bốn lần bấm tay — thì Gradle nổ ở giữa khối này:
        //
        //   Could not get unknown property 'CHECKFARM_UPLOAD_STORE_PASSWORD'
        //
        // Lời báo đó nêu đúng MỘT tên, ở một dòng trong tệp dựng, không nói còn thiếu
        // gì nữa và không nói phải đặt ở đâu. Trong khi cổng ở cuối tệp này đã có sẵn
        // câu báo đủ bốn tên kèm chỗ đặt — chỉ là dòng trên nổ trước nên không ai tới
        // được đó. Một cổng nằm sau chỗ nổ thì không phải cổng.
        //
        // Cùng LỚP lỗi với bộ `ORILIFE_UPLOAD_*` (bí mật rỗng và bí mật thiếu cho ra
        // cùng một lời báo), chỉ ở hình dạng khác: ở đây là bí mật nạp THIẾU MỘT PHẦN.
        def DUOI = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
        cacApp.each { khai ->
            def tienTo = khai.id.toUpperCase() + '_UPLOAD_'
            def co = DUOI.findAll { project.hasProperty(tienTo + it) }
            if (co.isEmpty()) return          // app này chưa cấu hình khoá — bình thường
            if (co.size() < DUOI.size()) {
                // Nạp NỬA VỜI nguy hơn không nạp: không nạp thì cổng cuối tệp báo rõ,
                // còn nửa vời thì trước đây nổ bằng một lời báo nêu sai vấn đề.
                throw new GradleException(
                    "App '${khai.id}' nạp THIẾU khoá ký: có ${co.size()}/${DUOI.size()} giá trị.\n" +
                    "  đã có   : " + co.collect { tienTo + it }.join(', ') + "\n" +
                    "  còn thiếu: " + (DUOI - co).collect { tienTo + it }.join(', ') + "\n" +
                    "Đặt trong android/gradle.properties, hoặc truyền -P, hoặc (trên CI)\n" +
                    "thêm secret cùng tên rồi ánh xạ vào bước dựng.\n" +
                    "LƯU Ý: một secret ĐẶT RỒI NHƯNG RỖNG cũng đi tới đây — danh sách secret\n" +
                    "chỉ chứng minh biến TỒN TẠI, chỉ log lượt chạy mới chứng minh nó CÓ GIÁ TRỊ."
                )
            }
            create(khai.id) {
                storeFile file(project.property(tienTo + 'STORE_FILE'))
                storePassword project.property(tienTo + 'STORE_PASSWORD')
                keyAlias project.property(tienTo + 'KEY_ALIAS')
                keyPassword project.property(tienTo + 'KEY_PASSWORD')
            }
        }
    }

    // ✅ Clean config (react-native-fast-tflite uninstalled → no litert conflict)
    configurations.all {
        resolutionStrategy {
            // Just ensure consistent TensorFlow Lite version
            // ✅ Consistent TensorFlow Lite version
        force 'org.tensorflow:tensorflow-lite:2.14.0'
        // ✅ Fix crash: react-native-geolocation-service bundles play-services-location:18.0.0
        // Do NOT add explicit play-services-location here to avoid IncompatibleClassChangeError
        force 'com.google.android.gms:play-services-location:18.0.0'
        }
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aladincontract.company"

    // ── HAI APP TỪ MỘT NỀN MÃ ────────────────────────────────────────────────
    // `APP_INSTANCE` ở tầng JS (`src/config/instance.config.ts`) chỉ đổi được
    // CHỮ trong app. Mã gói, tên hiện dưới biểu tượng và khoá ký nằm ở tầng
    // này — nên trước bản này, dựng với `APP_INSTANCE=checkfarm` vẫn ra một gói
    // mang `com.aladincontract.company`, tức ra app Aladin đội tên CheckFarm.
    //
    // Hai app RIÊNG ⇒ hai mã gói riêng, hai khoá tải lên riêng. Không dùng chung.
    //
    // Bản trước suy điều đó từ "hai pháp nhân riêng". Vế suy ấy KHÔNG còn đúng:
    // từ 2026-09-10 cả hai app phát hành dưới pháp nhân Aladin, CheckFarm Inc
    // nhận chuyển giao sau (`instances/LUAT-SUPERAPP.md §6`). Kết luận thì không
    // đổi, nhưng lý do đổi hẳn — và lý do mới nặng hơn:
    //
    //   Google Play khoá mục ứng dụng VĨNH VIỄN theo khoá của tệp ĐẦU TIÊN tải
    //   lên. Hai app chung một khoá thì ngày chuyển giao một trong hai sang pháp
    //   nhân khác, khoá ấy vẫn nằm ở cả hai bên — và đường duy nhất để gỡ là đi
    //   qua bộ phận hỗ trợ của Google.
    //
    // Tức là: cùng pháp nhân KHÔNG phải lý do để gộp khoá.
    //
    // ⛔ `com.checkfarm.app` KHÔNG ĐỔI ĐƯỢC sau lần tải bản dựng đầu tiên lên
    //    Google Play. Sửa dòng đó sau đó là mất luôn chỗ đứng của ứng dụng.
    flavorDimensions "app"
    productFlavors {
        cacApp.each { khai ->
            create(khai.id) {
                dimension "app"
                applicationId khai.android.applicationId
                resValue "string", "app_name", khai.displayName
                // Khoá ký gắn ở FLAVOR, không ở buildType — buildType chỉ có một
                // mà app thì nhiều. Thiếu khoá thì KHÔNG gán gì, và cổng
                // `taskGraph.whenReady` ở cuối tệp chặn bản phát hành lại.
                if (signingConfigs.findByName(khai.id) != null) {
                    signingConfig signingConfigs.getByName(khai.id)
                }
            }
        }
    }

    sourceSets {
        cacApp.each { khai ->
            getByName(khai.id) {
                // Biểu tượng của app nằm trong thư mục của chính app đó, KHÔNG ở
                // `src/main/res`. Cố ý: app mới quên bộ biểu tượng thì bản dựng ĐỎ
                // ngay ("resource mipmap/ic_launcher not found"), thay vì lặng lẽ
                // mượn biểu tượng của app đứng trước.
                res.srcDirs += new File(thuMucApp, "${khai.id}/android/res")
            }
        }
    }

    defaultConfig {
        // KHÔNG khai `applicationId` ở đây: mỗi flavor tự khai. Để lại một giá
        // trị mặc định ở đây là dựng sẵn một đường rơi câm cho flavor nào quên
        // khai — và cái rơi đó ra đúng mã gói của app kia.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Build 52 (2026-05-18): bumped 25 → 52 for parity with iOS CFBundleVersion=52.
        // Build 54 (2026-05-18): V5 Independent Feature Operation — Quick Actions
        // (1-tap Cây/Quả/Vườn), implicit farm 22m × 22m, biometric login,
        // walk-away auto-stop, drag-to-edit polygon. Field test target Đắk Lắk.
        // Câu "keep in lockstep with iOS CFBundleVersion" từng đúng, nay KHÔNG.
        // iOS tự tăng theo TestFlight mới nhất + 1 mỗi lượt dựng ký
        // (`codemagic.yaml:845-860`); Android thì sửa TAY ở đây. Hai bên đã rời
        // nhau từ lâu, và giữ câu cũ làm người đọc tưởng còn một thoả thuận đang
        // được ai đó giữ. Giữ đồng bộ thật thì phải cho Android đọc cùng nguồn —
        // chưa làm, nên nói thẳng là chưa.
        // Build 74 (2026-07-10): fix ví/mạng PhoenixKey (/wallet/all + Standard CIP-1852),
        // guardian đúng route §6, fix đơ iOS displayLink, YOLO gate C + A/B đăng-ký cây.
        // Build 75 (2026-07-10): tự phát hiện DID mồ côi + nút đăng-ký-lại khi server reset.
        // Build 76 (2026-07-13): hiện 2 ví (Standard+Phoenix) + stake_address CIP-1852;
        // fix "Phiên hết hạn" khi tạo vườn (tự lấy token field-reid); gộp fix cây + P0 nhiệt.
        // Build 98 (2026-09-01): tăng CHỦ ĐỘNG, không kèm tính năng nào.
        // Lượt phát hành 33361993600 (31/08) đã dựng ra một gói mang đúng số 97.
        // Gói đó ra đời với tên `…-KHONG-KHOA-API-KHONG-NOP-PLAY` nên nhiều khả
        // năng chưa ai tải lên — nhưng đó là SUY ĐOÁN, chỉ Play Console trả lời
        // được 97 còn trống hay đã tiêu.
        //
        // Tăng vì hai đường không cân nhau, không phải vì đã biết câu trả lời:
        //   97 còn trống  → nhảy sang 98 mất KHÔNG GÌ (Play chỉ đòi số tăng dần,
        //                   không đòi liên tiếp)
        //   97 đã tiêu    → giữ 97 là Play từ chối, mất trọn một vòng dựng-nộp
        // Rẻ một chiều thì chọn chiều rẻ, đừng chờ đo cái không đo được.
        // Build 99 (2026-09-09): tăng CHỦ ĐỘNG trước một lượt dựng tay, không kèm
        // tính năng nào. 98 nằm trong `develop` từ 01/09; kho này KHÔNG chứa bằng
        // chứng nào nói 98 đã lên Play hay chưa — chỉ Play Console trả lời được.
        // Vẫn nhảy sang 99 vì hai đường không cân nhau, y như lần trước:
        //   98 còn trống → nhảy mất KHÔNG GÌ (Play đòi số TĂNG DẦN, không đòi liền kề)
        //   98 đã tiêu   → giữ 98 là Play từ chối, mất trọn một vòng dựng-nộp
        //
        // Build 100 (2026-09-10): lần này KHÔNG phải suy đoán. 99 đã dựng thật bằng
        // `scripts/build-aab.ps1` và bản đó đã lên kênh thử nghiệm — tức 99 ĐÃ TIÊU.
        // Cùng lúc đó `.github/workflows/android-aab.yml` đọc THẲNG con số trong tệp
        // này, không cộng thêm số lượt dựng như đường Codemagic. Nên để nguyên 99 là
        // dựng ra một gói chắc chắn bị Play từ chối, và lượt dựng vẫn báo xanh —
        // cái sai chỉ lộ ở bước tải lên.
        versionCode 100
        versionName "2.0"

        // ✅ Support 16KB page size (required by Google Play Store 2024)
        // ⚠ ĐÍNH CHÍNH 2026-08-20 — `abiFilters` ở đây KHÔNG cắt được lát nào.
        //
        // Chú thích cũ (giữ nguyên bên dưới) tin rằng bỏ 'x86' khỏi danh sách này là
        // đủ để lát x86 không vào gói. Dựng thật hôm nay chứng minh ngược lại: với
        // đúng dòng `abiFilters` dưới đây (không có x86) mà `gradle.properties` còn
        // khai `reactNativeArchitectures=...,x86,...`, tệp .aab ra vẫn có
        // `base/lib/x86/` với 25 tệp — trong khi ba lát kia 28 — thiếu đúng
        // libtaad_enclave_core.so, libchat_mls.so và libcardano_serialization_lib.
        // Plugin `com.facebook.react` đọc `reactNativeArchitectures` và ghi đè khối
        // này. Nên chỗ THẬT SỰ cắt lát là `android/gradle.properties`, và hai nơi
        // phải khớp nhau. Giữ `abiFilters` vì nó vẫn là lời khai đúng ý định.
        //
        // Bỏ 'x86' (32-bit) từ 2026-08-15. Lý do: `.github/actions/rust-android/action.yml:71,76,89`
        // và `codemagic.yaml` CỐ Ý không dựng Rust cho x86 (máy thật không dùng nó).
        // Nhưng gradle vẫn đóng gói theo danh sách NÀY, nên bản dựng ĐÚNG vẫn đẻ ra một
        // lát `base/lib/x86/` thiếu `libtaad_enclave_core.so` + `libchat_mls.so`. Play giao
        // lát đó cho thiết bị x86 ⇒ đúng lỗi "mất cụm 24 từ sao lưu trong im lặng" mà bản
        // dựng tay 87 mắc phải, chỉ khác là chỉ một nhóm máy dính. Giữ x86_64 vì Rust CÓ
        // dựng cho nó (`action.yml:35,76`), tức lát đó đủ thư viện.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        debug {
            // `AndroidManifest.xml:36` dùng ${usesCleartextTraffic} nhưng KHÔNG chỗ nào trong
            // repo (build.gradle, gradle.properties, codemagic.yaml, .github/workflows/) định
            // nghĩa giá trị. Bản dựng nào không truyền -P sẽ gãy ở bước merge manifest.
            // Đặt tường minh: debug MỞ (Metro chạy http qua LAN), release ĐÓNG.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            signingConfig signingConfigs.debug
        }
        release {
            // Bản phát hành KHÔNG đi http trần. Mọi base URL trong `.env.example` đều https
            // và `grep -rnoE "http://" src/` không còn URL thật nào (chỉ 1 chuỗi trong test).
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            // KHÔNG gán `signingConfig` ở đây. buildType ĐÈ flavor, nên một dòng
            // ở chỗ này là ép mọi app ký bằng cùng một khoá — đúng lỗi vừa gỡ.
            // Khoá gắn ở từng flavor phía trên.
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Model .tflite phải KHÔNG nén để TFLite memory-map (FileUtil.loadMappedFile).
    aaptOptions {
        noCompress 'tflite'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Hermes is the default JS engine since RN 0.71. hermesEnabled property
    // was removed in RN 0.71+ — the React Native Gradle Plugin handles it.
    implementation("com.facebook.react:hermes-android")

    // MapLibre native dependency
    implementation 'org.maplibre.gl:android-sdk-opengl:11.12.1'
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // AndroidX
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.1")
    implementation("androidx.lifecycle:lifecycle-process:2.6.1")
    implementation("androidx.biometric:biometric:1.1.0")

    // CameraX — TreeReID guided realtime capture (parity với iOS TreeReIDBridge)
    def camerax_version = '1.3.1'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // TFLite — gate YOLO chất-lượng chụp (Plan A, TreeReIDYolo). Model yolov26seg.tflite
    // đặt ở app/src/main/assets (tự bỏ vào). Version khớp resolutionStrategy.force ở trên.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    // GPU delegate — chạy YOLO gate trên GPU thay CPU. Conv-net trên GPU tiêu-thụ điện
    // THẤP hơn nhiều so với CPU 2 luồng → máy MÁT hơn hẳn (field: máy nóng 13/07).
    // Máy không hỗ-trợ → TreeReIDYolo tự rơi về CPU (có fallback, không crash).
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.14.0'

    // LOCATION - play-services-location được cung cấp bởi react-native-geolocation-service

    // Firebase Analytics
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
}

// ── Firebase: CÓ ĐIỀU KIỆN, theo từng app ───────────────────────────────────
//
// Bản trước áp thẳng plugin này cho MỌI flavor, và `google-services.json` nằm ở
// gốc `app/` — mà gốc `app/` nằm trong đường tìm của MỌI variant. Hệ quả: dựng
// CheckFarm thì plugin nhặt đúng tệp của Aladin rồi đỏ ngay:
//
//     No matching client found for package name 'com.checkfarm.app'
//
// Nên tệp của Aladin chuyển vào `src/aladin/` — đường tìm của riêng nó — và
// flavor nào KHÔNG có tệp của chính mình thì tắt bước xử lý Firebase cho flavor
// đó, thay vì để nó nhặt nhầm tệp của app khác.
//
// Vì sao đây là hướng đúng chứ không phải đường tạm: Firebase trong app này chỉ
// phục vụ MỘT việc — đánh thức app khi bị tắt, cho hai loại tin `sign_request`
// và `activation`. Cả hai đều là luồng danh tính PhoenixKey. `pushHandler.ts`
// nạp module bằng `await import(...)` trong `try` và trả `null` khi không có,
// nên phía JS chịu được việc vắng Firebase mà không cần đổi một dòng nào. Một
// app chưa cần đẩy tin nền thì không có lý do gì phải mở tài khoản ở bên thứ ba
// trước khi dựng được.
//
// Ngày CheckFarm cần đẩy tin nền: bỏ `google-services.json` của dự án Firebase
// ĐỨNG TÊN pháp nhân CheckFarm vào `src/checkfarm/` là plugin tự bật lại — không
// phải sửa dòng nào ở đây.
apply plugin: 'com.google.gms.google-services'

android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    def coCauHinh = file("src/${flavor}/google-services.json").exists()
    if (!coCauHinh) {
        def ten = "process${variant.name.capitalize()}GoogleServices"
        tasks.matching { it.name == ten }.configureEach { it.enabled = false }
        logger.lifecycle("[firebase] ${flavor}: không có google-services.json → tắt ${ten}")
    }
}

// ── CỔNG CHẶN: bản PHÁT HÀNH không có khoá của chính app đó thì NỔ ──────────
//
// Không có cổng này, `assembleCheckfarmRelease` khi thiếu `CHECKFARM_UPLOAD_*`
// vẫn chạy tới cùng và ra một gói KHÔNG KÝ. Nó không lỗi ở máy dựng; nó lỗi ở
// cửa Play Console, sau khi người ta đã tải lên và tưởng là xong.
//
// Chặn ở `taskGraph.whenReady` chứ không ở lúc cấu hình: lúc cấu hình chưa biết
// người ta định dựng flavor nào, nên ném ở đó là chặn cả `assembleAladinDebug`
// của người chỉ muốn chạy thử máy mình.
gradle.taskGraph.whenReady { doThi ->
    def thieu = [] as Set
    doThi.allTasks.each { cong ->
        def khop = cong.name =~ /^(?:assemble|bundle)([A-Z][A-Za-z0-9]*)Release$/
        if (!khop) return
        def maApp = khop[0][1]
        maApp = maApp[0].toLowerCase() + maApp.substring(1)
        if (!cacApp.any { it.id == maApp }) return
        if (android.signingConfigs.findByName(maApp) == null) {
            thieu << maApp
        }
    }
    if (thieu) {
        throw new GradleException(
            "Bản phát hành của app ${thieu} KHÔNG có khoá ký của chính app đó.\n" +
            thieu.collect { ma ->
                def T = ma.toUpperCase()
                "  ${ma}: cần ${T}_UPLOAD_STORE_FILE, ${T}_UPLOAD_STORE_PASSWORD, " +
                "${T}_UPLOAD_KEY_ALIAS, ${T}_UPLOAD_KEY_PASSWORD"
            }.join("\n") + "\n" +
            "Đặt trong android/gradle.properties hoặc truyền -P.\n" +
            "KHÔNG mượn khoá của app khác: khoá tải lên gắn vĩnh viễn với mục ứng dụng\n" +
            "trên cửa hàng, ký nhầm một lần là mục đó không chuyển giao được nữa."
        )
    }
}
