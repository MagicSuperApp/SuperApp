apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    // CỐ Ý KHÔNG dùng entryFile/cliFile/bundleCommand="export:embed" mà
    // install-expo-modules thêm vào: app vẫn đóng gói bằng RN CLI + metro RN gốc.
    // Chỉ mượn expo-modules-core để autolink expo-gl (nền 3D).
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

    android {
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (project.hasProperty('ORILIFE_UPLOAD_STORE_FILE')) {
                storeFile file(ORILIFE_UPLOAD_STORE_FILE)
                storePassword ORILIFE_UPLOAD_STORE_PASSWORD
                keyAlias ORILIFE_UPLOAD_KEY_ALIAS
                keyPassword ORILIFE_UPLOAD_KEY_PASSWORD
            }
        }
    }

    // ✅ Clean config (react-native-fast-tflite uninstalled → no litert conflict)
    configurations.all {
        resolutionStrategy {
            // Just ensure consistent TensorFlow Lite version
            // ✅ Consistent TensorFlow Lite version
        force 'org.tensorflow:tensorflow-lite:2.14.0'
        // ✅ Fix crash: react-native-geolocation-service bundles play-services-location:18.0.0
        // Do NOT add explicit play-services-location here to avoid IncompatibleClassChangeError
        force 'com.google.android.gms:play-services-location:18.0.0'
        }
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aladincontract.company"

    // ── HAI APP TỪ MỘT NỀN MÃ ────────────────────────────────────────────────
    // `APP_INSTANCE` ở tầng JS (`src/config/instance.config.ts`) chỉ đổi được
    // CHỮ trong app. Mã gói, tên hiện dưới biểu tượng và khoá ký nằm ở tầng
    // này — nên trước bản này, dựng với `APP_INSTANCE=checkfarm` vẫn ra một gói
    // mang `com.aladincontract.company`, tức ra app Aladin đội tên CheckFarm.
    //
    // Hai pháp nhân RIÊNG (Aladin Contract và Công ty Cổ phần CheckFarm) ⇒ hai
    // mã gói riêng, hai khoá ký riêng. Không dùng chung.
    //
    // ⛔ `com.checkfarm.app` KHÔNG ĐỔI ĐƯỢC sau lần tải bản dựng đầu tiên lên
    //    Google Play. Sửa dòng đó sau đó là mất luôn chỗ đứng của ứng dụng.
    flavorDimensions "app"
    productFlavors {
        aladin {
            dimension "app"
            applicationId "com.aladincontract.company"
            resValue "string", "app_name", "Aladin"
        }
        checkfarm {
            dimension "app"
            applicationId "com.checkfarm.app"
            resValue "string", "app_name", "CheckFarm"
        }
    }

    defaultConfig {
        // KHÔNG khai `applicationId` ở đây: mỗi flavor tự khai. Để lại một giá
        // trị mặc định ở đây là dựng sẵn một đường rơi câm cho flavor nào quên
        // khai — và cái rơi đó ra đúng mã gói của app kia.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Build 52 (2026-05-18): bumped 25 → 52 for parity with iOS CFBundleVersion=52.
        // Build 54 (2026-05-18): V5 Independent Feature Operation — Quick Actions
        // (1-tap Cây/Quả/Vườn), implicit farm 22m × 22m, biometric login,
        // walk-away auto-stop, drag-to-edit polygon. Field test target Đắk Lắk.
        // Keep Android versionCode in lockstep with iOS CFBundleVersion.
        // Build 74 (2026-07-10): fix ví/mạng PhoenixKey (/wallet/all + Standard CIP-1852),
        // guardian đúng route §6, fix đơ iOS displayLink, YOLO gate C + A/B đăng-ký cây.
        // Build 75 (2026-07-10): tự phát hiện DID mồ côi + nút đăng-ký-lại khi server reset.
        // Build 76 (2026-07-13): hiện 2 ví (Standard+Phoenix) + stake_address CIP-1852;
        // fix "Phiên hết hạn" khi tạo vườn (tự lấy token field-reid); gộp fix cây + P0 nhiệt.
        versionCode 92
        versionName "2.0"

        // ✅ Support 16KB page size (required by Google Play Store 2024)
        // ⚠ ĐÍNH CHÍNH 2026-08-20 — `abiFilters` ở đây KHÔNG cắt được lát nào.
        //
        // Chú thích cũ (giữ nguyên bên dưới) tin rằng bỏ 'x86' khỏi danh sách này là
        // đủ để lát x86 không vào gói. Dựng thật hôm nay chứng minh ngược lại: với
        // đúng dòng `abiFilters` dưới đây (không có x86) mà `gradle.properties` còn
        // khai `reactNativeArchitectures=...,x86,...`, tệp .aab ra vẫn có
        // `base/lib/x86/` với 25 tệp — trong khi ba lát kia 28 — thiếu đúng
        // libtaad_enclave_core.so, libchat_mls.so và libcardano_serialization_lib.
        // Plugin `com.facebook.react` đọc `reactNativeArchitectures` và ghi đè khối
        // này. Nên chỗ THẬT SỰ cắt lát là `android/gradle.properties`, và hai nơi
        // phải khớp nhau. Giữ `abiFilters` vì nó vẫn là lời khai đúng ý định.
        //
        // Bỏ 'x86' (32-bit) từ 2026-08-15. Lý do: `.github/actions/rust-android/action.yml:71,76,89`
        // và `codemagic.yaml` CỐ Ý không dựng Rust cho x86 (máy thật không dùng nó).
        // Nhưng gradle vẫn đóng gói theo danh sách NÀY, nên bản dựng ĐÚNG vẫn đẻ ra một
        // lát `base/lib/x86/` thiếu `libtaad_enclave_core.so` + `libchat_mls.so`. Play giao
        // lát đó cho thiết bị x86 ⇒ đúng lỗi "mất cụm 24 từ sao lưu trong im lặng" mà bản
        // dựng tay 87 mắc phải, chỉ khác là chỉ một nhóm máy dính. Giữ x86_64 vì Rust CÓ
        // dựng cho nó (`action.yml:35,76`), tức lát đó đủ thư viện.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        debug {
            // `AndroidManifest.xml:36` dùng ${usesCleartextTraffic} nhưng KHÔNG chỗ nào trong
            // repo (build.gradle, gradle.properties, codemagic.yaml, .github/workflows/) định
            // nghĩa giá trị. Bản dựng nào không truyền -P sẽ gãy ở bước merge manifest.
            // Đặt tường minh: debug MỞ (Metro chạy http qua LAN), release ĐÓNG.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            signingConfig signingConfigs.debug
        }
        release {
            // Bản phát hành KHÔNG đi http trần. Mọi base URL trong `.env.example` đều https
            // và `grep -rnoE "http://" src/` không còn URL thật nào (chỉ 1 chuỗi trong test).
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Model .tflite phải KHÔNG nén để TFLite memory-map (FileUtil.loadMappedFile).
    aaptOptions {
        noCompress 'tflite'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Hermes is the default JS engine since RN 0.71. hermesEnabled property
    // was removed in RN 0.71+ — the React Native Gradle Plugin handles it.
    implementation("com.facebook.react:hermes-android")

    // MapLibre native dependency
    implementation 'org.maplibre.gl:android-sdk-opengl:11.12.1'
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // AndroidX
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.1")
    implementation("androidx.lifecycle:lifecycle-process:2.6.1")
    implementation("androidx.biometric:biometric:1.1.0")

    // CameraX — TreeReID guided realtime capture (parity với iOS TreeReIDBridge)
    def camerax_version = '1.3.1'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // TFLite — gate YOLO chất-lượng chụp (Plan A, TreeReIDYolo). Model yolov26seg.tflite
    // đặt ở app/src/main/assets (tự bỏ vào). Version khớp resolutionStrategy.force ở trên.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    // GPU delegate — chạy YOLO gate trên GPU thay CPU. Conv-net trên GPU tiêu-thụ điện
    // THẤP hơn nhiều so với CPU 2 luồng → máy MÁT hơn hẳn (field: máy nóng 13/07).
    // Máy không hỗ-trợ → TreeReIDYolo tự rơi về CPU (có fallback, không crash).
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.14.0'

    // LOCATION - play-services-location được cung cấp bởi react-native-geolocation-service

    // Firebase Analytics
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
}

// ── Firebase: CÓ ĐIỀU KIỆN, theo từng app ───────────────────────────────────
//
// Bản trước áp thẳng plugin này cho MỌI flavor, và `google-services.json` nằm ở
// gốc `app/` — mà gốc `app/` nằm trong đường tìm của MỌI variant. Hệ quả: dựng
// CheckFarm thì plugin nhặt đúng tệp của Aladin rồi đỏ ngay:
//
//     No matching client found for package name 'com.checkfarm.app'
//
// Nên tệp của Aladin chuyển vào `src/aladin/` — đường tìm của riêng nó — và
// flavor nào KHÔNG có tệp của chính mình thì tắt bước xử lý Firebase cho flavor
// đó, thay vì để nó nhặt nhầm tệp của app khác.
//
// Vì sao đây là hướng đúng chứ không phải đường tạm: Firebase trong app này chỉ
// phục vụ MỘT việc — đánh thức app khi bị tắt, cho hai loại tin `sign_request`
// và `activation`. Cả hai đều là luồng danh tính PhoenixKey. `pushHandler.ts`
// nạp module bằng `await import(...)` trong `try` và trả `null` khi không có,
// nên phía JS chịu được việc vắng Firebase mà không cần đổi một dòng nào. Một
// app chưa cần đẩy tin nền thì không có lý do gì phải mở tài khoản ở bên thứ ba
// trước khi dựng được.
//
// Ngày CheckFarm cần đẩy tin nền: bỏ `google-services.json` của dự án Firebase
// ĐỨNG TÊN pháp nhân CheckFarm vào `src/checkfarm/` là plugin tự bật lại — không
// phải sửa dòng nào ở đây.
apply plugin: 'com.google.gms.google-services'

android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    def coCauHinh = file("src/${flavor}/google-services.json").exists()
    if (!coCauHinh) {
        def ten = "process${variant.name.capitalize()}GoogleServices"
        tasks.matching { it.name == ten }.configureEach { it.enabled = false }
        logger.lifecycle("[firebase] ${flavor}: không có google-services.json → tắt ${ten}")
    }
}
