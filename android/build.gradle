buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
        // KSP 2.1.20 for Kotlin 2.1.20 (from RN Gradle Plugin)
        classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.20-1.0.32")
    }
}

// ✅ Fix deprecated jcenter() for react-native-sqlite-storage & other libs
allprojects {
    repositories {
        google()
        mavenCentral()
        // Fallback for old jcenter() references (redirects to mavenCentral)
        maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    }
}

apply plugin: "com.facebook.react.rootproject"
