import java.util.Properties

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

def getLocalProperty(String key, String defaultValue) {
    def secrets = new Properties()
    // rootProject = android/ root → app/ = android/app/
    def secretsFile = rootProject.file("app/secrets.properties")
    if (secretsFile.exists()) {
        secrets.load(new FileInputStream(secretsFile))
        println("✅ [orilifesdk] Loaded secrets from: ${secretsFile.absolutePath}")
    } else {
        println("⚠️  [orilifesdk] secrets.properties not found at: ${secretsFile.absolutePath}")
    }
    return secrets.getProperty(key, defaultValue)
}

android {
    namespace 'com.mvp.orilife'
    compileSdk 36

    // ✅ Load secrets from app/secrets.properties
    def apiUrl = getLocalProperty('TREE_DETECTION_API', '')
    def baseApiUrl = getLocalProperty('BASE_API_URL', 'http://localhost:8001')
    def apiKey = getLocalProperty('API_KEY', 'mock-local-api-key')
    def regionCode = getLocalProperty('REGION_CODE', 'vn-south-01')

    defaultConfig {
        minSdk 26
        targetSdk 36
        ndk {
            abiFilters 'arm64-v8a'
        }

        // ✅ BuildConfig fields for API configuration
        buildConfigField 'String', 'TREE_DETECTION_API', "\"${apiUrl}\""
        buildConfigField 'String', 'BASE_API_URL', "\"${baseApiUrl}\""
        buildConfigField 'String', 'API_KEY', "\"${apiKey}\""
        buildConfigField 'String', 'REGION_CODE', "\"${regionCode}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // CameraX
    def camerax_version = '1.3.1'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // TensorFlow Lite — aligned with app's forced version 2.14.0
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-api:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'

    // ONNX Runtime Mobile
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Location — must match react-native-geolocation-service version (18.0.0)
    // Using 21.0.1 here caused NoClassDefFoundError on LocationRequest$Builder
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // Room (KSP 2.1.20-1.0.32 for Kotlin 2.1.20)
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:${room_version}"
    implementation "androidx.room:room-ktx:${room_version}"
    ksp "androidx.room:room-compiler:${room_version}"

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Socket.IO
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase Analytics
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
}
