pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // ✅ Fix deprecated jcenter() for react-native-sqlite-storage
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
    }

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins { id("com.facebook.react.settings") 
id("expo-autolinking-settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand) }

dependencyResolutionManagement {
    // PREFER_PROJECT (KHÔNG phải PREFER_SETTINGS) vì expo-modules SDK 57 ship AAR
    // dựng sẵn trong `node_modules/<gói>/local-maven-repo`, và plugin của expo
    // (`expoAutolinking.useExpoModules()`) đăng ký các repo đó ở MỨC PROJECT
    // (rootProject.allprojects { linkLocalMavenRepository }). PREFER_SETTINGS bỏ
    // qua toàn bộ repo mức project → không tìm thấy expo.modules.gl/asset/...
    // Lý do cũ đặt PREFER_SETTINGS (ép các lib còn gọi jcenter đi mavenCentral)
    // KHÔNG còn cần: patch react-native-sqlite-storage đã đổi jcenter→mavenCentral
    // ngay trong module autolinking dùng (platforms/android), mà đó lại là repo
    // của `buildscript` nên vốn không chịu ảnh hưởng của khối này.
    repositoriesMode = RepositoriesMode.PREFER_PROJECT
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    }
}

rootProject.name = 'aladincontract'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
includeBuild(expoAutolinking.reactNativeGradlePlugin)
