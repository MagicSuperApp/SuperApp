# ============================================================
# Codemagic CI/CD — OriLife iOS & Android Build
# ============================================================
#
# Stack:
#   - React Native 0.84.1 (Metro bundle)
#   - Swift 5.9 (ScannerModule: AVFoundation, YOLO TFLite, SQLite)
#   - CocoaPods (TensorFlowLiteSwift ~2.17.0, SQLite.swift ~0.15.0)
#   - Local pod: ios/LocalPods/ScannerModule
#   - secrets.plist keys READ by native (ScannerConfig.swift):
#       TREE_DETECTION_API  — base URL cho scanner module API calls
#       API_KEY             — X-API-Key header
#       REGION_CODE         — vùng xử lý
#
# Codemagic env groups cần có:
#   scanner_secrets:
#     TREE_DETECTION_API, BASE_API_URL, API_KEY, REGION_CODE
#     PHOENIXKEY_API_URL, ORILIFE_API_BASE_URL, PHOENIX_WALLET_ENABLED
#   android_signing_aladin (chỉ android-aab-aladin):
#     ALADIN_UPLOAD_STORE_FILE_B64, ALADIN_UPLOAD_STORE_PASSWORD,
#     ALADIN_UPLOAD_KEY_ALIAS, ALADIN_UPLOAD_KEY_PASSWORD
#   android_signing_checkfarm (chỉ android-aab-checkfarm):
#     CHECKFARM_UPLOAD_STORE_FILE_B64, CHECKFARM_UPLOAD_STORE_PASSWORD,
#     CHECKFARM_UPLOAD_KEY_ALIAS, CHECKFARM_UPLOAD_KEY_PASSWORD
#   Hai nhóm RIÊNG. KHÔNG phải vì hai pháp nhân — từ 10/09/2026 chỉ còn một.
#   Vì Google Play khoá mục ứng dụng VĨNH VIỄN theo khoá của tệp ĐẦU TIÊN tải
#   lên: chung khoá thì ngày chuyển giao một app sang pháp nhân khác, khoá ấy
#   vẫn nằm ở cả hai bên, và đường gỡ duy nhất đi qua hỗ trợ của Google.
#   (Dòng cũ ghi "vì hai pháp nhân riêng" — đúng kết luận, sai lý do. Người sau
#   đọc lý do, thấy nó hết hiệu lực, rồi gộp hai nhóm lại.)
#
# iOS Code Signing (ios-appstore):
#   Certificate : aladin-ios-cert  (production, upload Codemagic UI)
#   Profile     : aladin_appstore_profile  (app_store, upload Codemagic UI)
#   Bundle ID   : vn.aladinapp
#   Team        : ALADIN CONTRACT COMPANY LIMITED (3666KPJX5R)
# ============================================================

workflows:

  # ============================================================
  # Workflow 1: iOS unsigned IPA — AltStore / Sideloadly
  # ============================================================
  ios-adhoc-ipa:
    name: iOS IPA Build (Unsigned — AltStore/Sideloadly)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: 26.4  # PIN 26.4 CỤ THỂ — KHÔNG để `26` (resolve = 26.0 = Swift < 6.2) hay
                   # `latest` (trôi về 26.0). expo-modules-jsi (expo 56) dùng `weak let`
                   # (SE-0481, chỉ có ở Swift 6.2) → 26.0 FAIL "'weak' must be a mutable
                   # variable"; 16.4=Swift 6.1 FAIL "Swift tools 6.2 but installed 6.1".
                   # Xcode 26.4 = Swift 6.2 → ĐÃ chứng minh compile được ExpoModulesJSI.
      cocoapods: default
      groups:
        - scanner_secrets
      vars:
        # ── HAI APP ─────────────────────────────────────────────────────────
        # `BUNDLE_ID` trước bản này là biến CHẾT: khai ở đây, 0 chỗ đọc, còn
        # mã gói thật ghi cứng trong `project.pbxproj:298,331`. Nay nó được
        # truyền thẳng vào `xcodebuild` nên đổi ở đây là đổi thật.
        # `CFBundleDisplayName` trong `Info.plist` nay là `$(APP_DISPLAY_NAME)`.
        # Luồng iOS nay dựng được nhiều app. Bộ biểu tượng chọn theo `APP_INSTANCE`
        # ở bước "Soát danh tính app iOS" (chép `instances/<app>/ios/AppIcon.appiconset`
        # vào chỗ Xcode đọc, rồi đo lại chính tệp vừa chép).
        #
        # ⚠ BA biến dưới đây phải đổi CÙNG NHAU, và `ios_signing.bundle_identifier`
        # là biến thứ tư. Đổi ba quên một thì lượt dựng đi tới tận bước ký rồi mới
        # đỏ — hoặc tệ hơn, ký được bằng hồ sơ của app kia. Đừng đặt đè từng biến
        # khi chạy tay; dùng đúng luồng của app đó.
        #
        # Bản CheckFarm nằm ở luồng `ios-appstore-checkfarm` bên dưới.
        BUNDLE_ID: vn.aladinapp
        APP_DISPLAY_NAME: Aladin
        APP_INSTANCE: aladin
        XCODE_WORKSPACE: ios/SuperApp.xcworkspace
        XCODE_SCHEME: SuperApp
        ARCHIVE_PATH: $CM_BUILD_DIR/build/ios/OriLife.xcarchive
        IPA_OUTPUT_DIR: $CM_BUILD_DIR/build/ios/ipa

    # GỠ KHỎI `main` VÀ `develop` (2026-08-18). Workflow này cho ra IPA KHÔNG KÝ để cài
    # tay qua AltStore/Sideloadly — hữu ích trên nhánh đang làm dở, thừa trên hai nhánh
    # đã có đường TestFlight thật.
    #
    # Vì sao gỡ, chứ không phải "dọn cho gọn": mỗi lượt đẩy `develop` trước đây khởi BA
    # bản dựng, trong đó HAI là iOS trên cùng `mac_mini_m2`. Số bản dựng chạy song song
    # mà gói Codemagic cho phép thì bên này KHÔNG đo được (không có khoá API), nên đây
    # là nghi phạm hàng đầu cho việc gộp #181 (15:37 giờ VN 18/08) và #183 (16:38) mà
    # tới 20:10 vẫn không có bản nào lên TestFlight — trong khi nếp trước đó là 15–22
    # phút (ba cặp khớp, đo qua App Store Connect API).
    #
    # Cái MẤT: kênh cài tay bản không ký từ `main`/`develop`. Grep toàn kho + toàn bộ
    # thư giữa các nhà: KHÔNG chỗ nào ghi nhận người thật đang dùng kênh đó. Đó là
    # "không tìm thấy bằng chứng", không phải "chứng minh không ai dùng" — có người báo
    # thiếu thì thêm lại hai dòng `branch_patterns`, một commit, không đụng dữ liệu nào.
    #
    # Và nếu gỡ rồi mà kiểu sự cố "gộp xong không thấy bản mới" VẪN tái diễn thì giả
    # thuyết này sai — đừng coi việc gỡ ở đây là đã sửa xong.
    #
    # Còn `feat/*` thì KHÔNG giữ lại, vì nó chưa từng khớp gì. Quy ước nhánh của kho là
    # `feature/*`, `fix/*`, `claude/*` (`.github/workflows/branch-policy.yml:4`), và
    # danh sách nhánh thật trên remote hôm nay chỉ có tiền tố `claude/`, `develop`,
    # `main`. Đổi `feat/*` thành `claude/*` thì mỗi lượt đẩy nhánh làm việc lại khởi một
    # bản dựng mac — đắt hơn hẳn thứ nó đem lại. Nên: CHẠY TAY.
    # Đây vẫn là công cụ chẩn đoán có giá trị (bản không ký nạp được ExpoModulesJSI,
    # bản ký thì không) — thứ cần khi đang truy lỗi, không phải mỗi lượt đẩy.
    triggering:
      events: []

    scripts:

      # secrets.plist — chỉ 3 key mà ScannerConfig.swift thực sự đọc.
      # Không thêm key thừa: LAMPNET_*, CAPTURES_3D_URL dùng .env phía RN.
      - name: Create secrets.plist
        script: |
          SECRETS_DIR="ios/LocalPods/ScannerModule/Resources"
          mkdir -p "$SECRETS_DIR"
          cat > "$SECRETS_DIR/secrets.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!-- ScannerConfig.swift: ScannerConfig.treeDetectionAPI / baseApiUrl -->
              <key>TREE_DETECTION_API</key>
              <string>${TREE_DETECTION_API:-https://api.orilife.io}</string>

              <!-- ScannerConfig.swift: ScannerConfig.apiKey (X-API-Key header) -->
              <key>API_KEY</key>
              <string>${API_KEY:-mock-local-api-key}</string>

              <!-- ScannerConfig.swift: ScannerConfig.regionCode -->
              <key>REGION_CODE</key>
              <string>${REGION_CODE:-vn-south-01}</string>
          </dict>
          </plist>
          EOF
          echo "✅ secrets.plist created (3 keys: TREE_DETECTION_API, API_KEY, REGION_CODE)"
          echo "   TREE_DETECTION_API=${TREE_DETECTION_API:-[USING STAGING FALLBACK]}"

      # .env — tất cả vars mà React Native (react-native-dotenv) cần.
      # Khớp với .env.example. ANALYTICS_API_URL dùng production endpoint (không có localhost).
      - name: Create .env for React Native
        script: |
          cat > .env <<EOF

          # OriLife / Aladin backend
          ALADIN_API_URL=${BASE_API_URL:-https://api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}

          # PhoenixKey + Ví Phượng hoàng
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          # false = backend Phase-2 chưa deploy, nút ký disable. Set true SAU khi backend sẵn sàng.
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}

          # TreeReID / identify cây (RN layer)
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://api.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://api.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://api.orilife.io}

          # LampNet 3D
          # HOST = `api.lampnet.cloud`, KHÔNG phải `lampnet.cloud`. Hai host hôm nay trỏ
          # cùng một node (đo 12/08: cùng peer id) nhưng KHÔNG có cam kết nào giữ mãi thế.
          # `joinService.ts:24-30` đã chọn `api.` làm mặc định vì đúng lý do đó, rồi bị
          # chính bốn dòng này ghi đè ngược về — nên mặc định trong mã là mã CHẾT ở mọi
          # bản dựng thật. `videoProofReconcile.ts:19` nói rõ vai trò hai host khác nhau:
          # `api.` phục vụ put/inspect, còn `lampnet.cloud` là cổng XEM công khai theo CID.
          # Ngày LampNet tách chúng ra, Kết đèn chết mà phần đối soát video vẫn chạy —
          # đúng kiểu hỏng lệch pha khó truy nhất.
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://api.lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://api.lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://api.orilife.io/captures/3d}

          # AladinWork (Việc làm). THIẾU biến này = cổng runtime tắt vĩnh viễn, module
          # rơi về rỗng DÙ máy chủ sống (đo 05/08: api.aladin.work/api/v1/health = 200).
          WORK_API_URL=${WORK_API_URL:-https://api.aladin.work/api/v1}

          # ProofChat. Cờ mặc định `off` = MỌI bản phát hành chạy dữ liệu giả, dù máy
          # chủ sống. Bật là quyết định của người phát hành, không phải hệ quả phụ của
          # việc máy chủ hồi sinh.
          #
          # ĐÍNH CHÍNH 2026-08-18: lý do cũ ghi ở đây ("token production còn nằm trần
          # trong AsyncStorage") ĐÃ HẾT HIỆU LỰC — commit 48efb57 chuyển token phiên
          # sang Keychain/Keystore qua `taad.secureStore` (`proofchat-api.ts`).
          # Còn lại một chặn THẬT, đo 2026-08-18 và nằm ở phía ProofChat chứ không
          # phải ở app: `GET https://api.proofchat.me/api/v1/users/search` → 404
          # ("Cannot GET"), tức cửa TÌM NGƯỜI để mở hội thoại vẫn đóng
          # (`proofchat-api.ts:465` đã ghi: khối `@Get('search')` bị bình luận ở BE).
          # Bật cờ lúc này chỉ đổi "chat giả" thành "chat thật nhưng không tìm được ai".
          PROOFCHAT_API_URL=${PROOFCHAT_API_URL:-https://api.proofchat.me/api/v1}
          PROOFCHAT_WS_URL=${PROOFCHAT_WS_URL:-https://api.proofchat.me}
          PROOFCHAT_WS_PATH=${PROOFCHAT_WS_PATH:-/socket.io}
          PROOFCHAT_BACKEND_ENABLED=${PROOFCHAT_BACKEND_ENABLED:-off}

          # ⚠ analytics.orilife.io KHÔNG phân giải được (DNS NXDOMAIN, đo 05/08) — để
          # trống thay vì nướng một host không tồn tại vào mọi bản build. Để trống CHỈ
          # an toàn sau khi đã gỡ đường lui viết cứng trong analyticsApi.ts (trước đây
          # chuỗi rỗng làm nó lui về một tunnel ngrok tạm + khoá dev). Nay rỗng = TẮT.
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-}

          # Bốn biến dưới đây `src/` CÓ import nhưng codemagic.yaml TỪNG KHÔNG ghi
          # (đo 15/08: 0 dòng trong cả 4 khối). Thiếu ở đây không đỏ, không cảnh báo —
          # react-native-dotenv mặc định `allowUndefined: true` nên biến thành
          # `undefined` lặng lẽ. Đường GitHub có cổng đối chiếu
          # (.github/actions/rn-env/action.yml) bắt được; đường Codemagic thì không,
          # nên phải ghi tay và giữ đồng bộ. Giá trị đặt đúng bằng bản GitHub ghi.
          ORG_MINT_ENABLED=${ORG_MINT_ENABLED:-false}
          # 0 = preprod (chuỗi thử) · 1 = mainnet (tiền thật). Lên mainnet thì đặt
          # CARDANO_NETWORK=1 ở nhóm biến Codemagic, không sửa dòng này.
          CARDANO_NETWORK=${CARDANO_NETWORK:-0}
          # `aladin` | `checkfarm` — app nào được dựng ra từ nền mã này. Đặt ở
          # nhóm biến của TỪNG workflow, không sửa dòng này. Giá trị lạ ⇒ app ném
          # ngay lúc nạp module (config/instance.config.ts), cố ý không rơi sạch.
          APP_INSTANCE=${APP_INSTANCE:-aladin}
          # Trống = để cổng runtime /health quyết (config.ts:38 chỉ chặn khi đúng 'off').
          WORK_BACKEND_ENABLED=${WORK_BACKEND_ENABLED:-}
          # Trống = TẮT hẳn. ĐỪNG điền tunnel ngrok — xem remoteLogger.ts, aladinChat.ts.
          REMOTE_LOG_URL=${REMOTE_LOG_URL:-}
          ALADIN_CHAT_URL=${ALADIN_CHAT_URL:-}
          # ── Truy vết bản dựng ────────────────────────────────────────────────
          # Báo cáo thực địa trước nay chỉ có "2.0 (86)". Số đó KHÔNG chỉ về commit
          # nào: `main` và `develop` cùng đẩy lên MỘT luồng TestFlight, và số build
          # do App Store Connect cấp chứ không do kho sinh. Ba biến dưới được nướng
          # vào bundle và app in ra ở màn "Phiên bản ứng dụng"
          # (`src/screens/AccountScreen.tsx`) → ảnh chụp màn của người thử là truy
          # ngược được đúng commit. Codemagic đặt sẵn CM_COMMIT/CM_BRANCH/CM_BUILD_ID.
          # Sửa ở đây thì sửa CẢ `.github/actions/rn-env/action.yml` (hai đường build
          # lệch nhau là quay lại đúng lỗi mà tệp action đó đang chống).
          BUILD_COMMIT=${CM_COMMIT:0:12}
          BUILD_BRANCH=${CM_BRANCH:-}
          BUILD_ID=${CM_BUILD_ID:-}
          EOF
          # Dọn whitespace lạc (tab/space) mà biến môi trường Codemagic có thể dính
          # vào value khi paste — nếu không, URL như "\thttps://..." sẽ làm fetch ném
          # "Network request failed" trên device. Cắt khoảng trắng sau '=' và cuối dòng.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env created"
          echo "--- ALADIN_API_URL  : $(grep ALADIN_API_URL .env | head -1)"
          echo "--- ORILIFE_API_BASE: $(grep ORILIFE_API_BASE_URL .env | head -1)"
          echo "--- PHOENIX_WALLET  : $(grep PHOENIX_WALLET_ENABLED .env)"

      - name: Verify .env file
        script: |
          echo "=== Verifying .env ==="
          if [ ! -f .env ]; then
            echo "❌ .env NOT FOUND"; exit 1
          fi
          # Chặn giá trị nguy hiểm (bỏ qua comment lines)
          if grep -v "^#" .env | grep -q "localhost"; then
            echo "❌ .env chứa localhost — không dùng được trên device!"
            grep -v "^#" .env | grep "localhost"
            exit 1
          fi
          # Chặn whitespace lạc trong value (vd "KEY=\thttps://...") — sẽ làm
          # fetch ném "Network request failed" trên device. Đáng lẽ đã được perl dọn.
          if grep -nE '^[A-Za-z_][A-Za-z0-9_]*=[[:space:]]' .env; then
            echo "❌ .env còn whitespace ngay sau '=' — kiểm tra biến môi trường Codemagic"
            exit 1
          fi
          # Kiểm tra URL hợp lệ: orilife.io hoặc lampnet.cloud
          if grep -qE "(orilife\.io|lampnet\.cloud|phoenixkey\.me)" .env; then
            echo "✅ .env chứa URL hợp lệ (orilife.io / lampnet.cloud / phoenixkey.me)"
          else
            echo "⚠️  Không tìm thấy URL orilife.io — kiểm tra biến môi trường Codemagic"
          fi
          echo "--- Content (API keys ẩn):"
          grep -v "API_KEY\|PASSWORD\|TOKEN\|SECRET" .env

      - name: Install npm dependencies
        script: |
          set -e
          node --version && npm --version
          # --ignore-scripts: bỏ qua postinstall-postinstall (nó gọi `yarn run postinstall`
          # nhưng Codemagic có Yarn Berry → fail vì project không phải Yarn Berry workspace)
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

          # Verify react-native installed — CocoaPods dùng file này để load Podfile
          if [ ! -f "node_modules/react-native/scripts/react_native_pods.rb" ]; then
            echo "❌ react-native/scripts/react_native_pods.rb NOT FOUND sau npm install"
            ls node_modules/react-native/ 2>/dev/null || echo "react-native chưa install"
            exit 1
          fi
          echo "✅ npm install done — react_native_pods.rb OK"

      - name: Build Rust core (iOS)
        script: |
          set -e
          # PhoenixKey Enclave Rust core (rust/taad_enclave_core) → static lib +
          # cbindgen header cho pod `taad_enclave_core`. PHẢI chạy TRƯỚC pod install
          # vì podspec tham chiếu libtaad_enclave_core.a + taad_enclave_core.h.
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          command -v cbindgen &> /dev/null || cargo install cbindgen --version "^0.27"

          # Device-only (adhoc IPA chạy trên iPhone thật — không cần simulator slice).
          # Gọi qua `bash` vì file commit từ Windows không giữ exec bit (chmod +x cũng được).
          ( cd rust/taad_enclave_core && bash build_ios.sh device )

          echo "=== Rust iOS outputs ==="
          ls -lh rust/taad_enclave_core/ios/
          if [ ! -f rust/taad_enclave_core/ios/libtaad_enclave_core.a ]; then
            echo "❌ libtaad_enclave_core.a NOT built"; exit 1
          fi
          if [ ! -f rust/taad_enclave_core/ios/taad_enclave_core.h ]; then
            echo "❌ taad_enclave_core.h (cbindgen) NOT generated"; exit 1
          fi

      - name: Build Rust chat_mls (iOS)
        script: |
          set -e
          # ProofChat E2EE Rust core (rust/chat_mls) → libchat_mls.a + chat_mls.h (build.rs)
          # cho pod `chat_mls`. PHẢI chạy TRƯỚC pod install. Rust/cbindgen đã cài ở step taad.
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          ( cd rust/chat_mls && bash build_ios.sh device )
          ls -lh rust/chat_mls/ios/
          if [ ! -f rust/chat_mls/ios/libchat_mls.a ]; then
            echo "❌ libchat_mls.a NOT built"; exit 1
          fi
          if [ ! -f rust/chat_mls/ios/chat_mls.h ]; then
            echo "❌ chat_mls.h (cbindgen) NOT generated"; exit 1
          fi

      - name: CocoaPods install
        script: |
          set -e
          # Đặt NODE_BINARY để pod install dùng đúng node của Codemagic
          # (không dùng /usr/local/bin/node là system node cũ)
          export NODE_BINARY=$(which node)
          echo "NODE_BINARY=$NODE_BINARY ($(node --version))"
          # Ghi vào .xcode.env.local để cả Xcode lẫn pod đều dùng đúng node
          echo "export NODE_BINARY=$NODE_BINARY" > ios/.xcode.env.local

          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

          echo "=== Workspace check ==="
          FOUND_WS=$(find ios -maxdepth 2 -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          echo "workspace: ${FOUND_WS:-NOT FOUND}"
          if [ -z "$FOUND_WS" ]; then
            echo "❌ No xcworkspace!"; ls -la ios/; exit 1
          fi

      # ── Bản khai quyền riêng tư phải sống sót qua `pod install` ────────────────
      # `pod install` ghi lại nhiều thứ dưới `ios/`, và tệp này là tệp Apple ĐỌC khi
      # duyệt bản nộp. Mất nó thì bản dựng vẫn xanh, `.ipa` vẫn ra, và chỗ hỏng chỉ lộ
      # ở khâu duyệt — sau khi đã tốn một lượt nộp.
      #
      # Cổng này FAIL-SAFE (đỏ khi lệch), đúng chiều theo Forall §Cổng gác cho cổng CI:
      # cổng chặn thao tác hỏng thì người BIẾT mình bị chặn, còn cổng CI cho qua thì
      # không ai biết, và màu xanh đó đi thẳng vào quyết định nộp bản.
      #
      # Phép so là `git diff` chứ không phải "tệp có tồn tại": một tệp bị ghi rỗng vẫn
      # tồn tại, và đó đúng là hình dạng hỏng mà một nhà khác trong hệ báo gặp.
      - name: Bản khai quyền riêng tư còn nguyên sau pod install
        script: |
          set -e
          MANIFEST=ios/SuperApp/PrivacyInfo.xcprivacy
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ $MANIFEST KHÔNG còn trên đĩa sau pod install."
            exit 1
          fi
          # Trạng thái thứ ba — KHÔNG ĐO ĐƯỢC — phải kêu to hơn trạng thái lệch.
          # Không có kho git (bản tải về dạng nén) thì cổng này không nói được gì, và
          # im lặng ở đây là im lặng đúng lúc nó vô dụng.
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "❌ CỔNG KHÔNG CHẠY ĐƯỢC: không có kho git để đối chiếu."
            echo "   Cổng này đo bằng git diff, nên không có git là không đo được gì."
            exit 1
          fi
          if ! git diff --quiet -- "$MANIFEST"; then
            echo "❌ $MANIFEST ĐÃ BỊ ĐỔI trong lượt dựng này (nghi `pod install` ghi đè)."
            echo "   Số dòng bây giờ: $(wc -l < "$MANIFEST")"
            git --no-pager diff --stat -- "$MANIFEST"
            exit 1
          fi
          echo "✅ $MANIFEST nguyên vẹn — $(wc -l < "$MANIFEST") dòng, khớp bản trong kho."

      # Chẩn-đoán vì sao globalThis.expo KHÔNG được cài trên bản signed → 3D/expo-gl +
      # video/expo-file-system crash. In các thứ SINH RA lúc pod install (không có ở
      # checkout Windows). Đọc log step này gửi lại để chỉ đúng gốc. Không chặn build.
      - name: Diagnose Expo modules (globalThis.expo)
        script: |
          echo "════════ EXPO DIAGNOSE ════════"
          echo "--- 1) ExpoModulesProvider.swift (module nào được ĐĂNG KÝ) ---"
          PROV=$(find ios -iname "ExpoModulesProvider.swift" 2>/dev/null | head -1)
          echo "path: ${PROV:-KHÔNG TÌM THẤY (autolinking hỏng?)}"
          [ -n "$PROV" ] && { echo "----- nội dung -----"; cat "$PROV"; echo "----- hết -----"; }
          echo
          echo "--- 2) Expo pods trong Podfile.lock ---"
          grep -iE "ExpoModulesCore|ExpoGL|EXGL|ExpoFileSystem|ExpoAsset|^  - Expo|EXManifests|ExpoModulesProvider" ios/Podfile.lock 2>/dev/null | head -30 || echo "(không có)"
          echo
          echo "--- 3) New Arch flag trong xcconfig (RCT_NEW_ARCH_ENABLED) ---"
          grep -rniE "RCT_NEW_ARCH_ENABLED|EX_DEV_CLIENT|USE_HERMES" ios/Pods/Target\ Support\ Files/Pods-*/*.release.xcconfig 2>/dev/null | head
          echo
          echo "--- 4) Có ExpoModulesCore TurboModule codegen không (New Arch) ---"
          find ios -ipath "*ExpoModulesCore*" \( -iname "*.h" -o -iname "*JSI*" \) 2>/dev/null | head -10
          echo "--- version expo-modules-core cài trên máy build ---"
          node -e "console.log('expo-modules-core:', require('./node_modules/expo-modules-core/package.json').version, '| expo:', require('./node_modules/expo/package.json').version)"
          echo "════════ /EXPO DIAGNOSE ════════"

      - name: Clean DerivedData & SPM
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/com.apple.dt.Xcode/SwiftPM
          rm -rf ios/SuperApp.xcworkspace/xcshareddata/swiftpm/checkouts 2>/dev/null || true
          echo "✅ DerivedData + SPM cleaned"

      # Xuất JS bundle + SOURCEMAP để de-minify stack crash JS (VD "Cannot read
      # property 'default' of undefined" tại main.jsbundle:LINE:COL). Chạy CÙNG lệnh
      # + CÙNG .env như phase bundle của Xcode (@expo/cli export:embed, dev=false,
      # macOS) → bundle khớp byte, map giải đúng số dòng runtime. EXPO_UNSAFE_DOTENV_KEYS
      # để expo chịu nạp var ENV/NODE_ENV trong .env (nếu không sẽ từ chối). Best-effort:
      # lỗi ở đây KHÔNG được chặn archive.
      - name: Export JS sourcemap (debug crash)
        script: |
          mkdir -p "$CM_BUILD_DIR/build/jsmap"
          EXPO_UNSAFE_DOTENV_KEYS=ENV,NODE_ENV npx expo export:embed \
            --platform ios --dev false --entry-file index.js \
            --bundle-output "$CM_BUILD_DIR/build/jsmap/main.jsbundle" \
            --sourcemap-output "$CM_BUILD_DIR/build/jsmap/main.jsbundle.map" \
            2>&1 | tail -20 || echo "⚠️ export sourcemap lỗi (không chặn build)"
          ls -lh "$CM_BUILD_DIR/build/jsmap/" 2>/dev/null || true

      # ── CỔNG: danh tính app iOS phải khớp `instances/<app>/instance.json` ─
      # Bên Android đã có phép so này từ lâu — `APP_INSTANCE` vs `ANDROID_FLAVOR`
      # trong workflow `android-aab-aladin`, kèm câu nói đúng cái hại: *"lệch
      # hai biến này là dựng vỏ app này với chữ của app kia"*. Nửa iOS KHÔNG có
      # phép so tương ứng nào, và nửa iOS mới là nửa nguy hơn: `BUNDLE_ID`,
      # `APP_DISPLAY_NAME`, `APP_INSTANCE` và `ios_signing.bundle_identifier` là
      # BỐN chỗ gõ tay cùng một sự thật, không chỗ nào trỏ về chỗ nào.
      #
      # Đặt lệch một trong bốn thì bản dựng vẫn ra, vẫn chạy, vẫn ký được, và
      # mang tên app này với mã gói app kia. Không có gì đỏ cho tới lúc Apple soát
      # gói đã nộp — hoặc không bao giờ đỏ, nếu chỗ lệch là tên hiển thị.
      #
      # Cổng này KHÔNG so hai biến gõ tay với nhau. Nó đọc `instances/` làm nguồn —
      # cùng nguồn mà `android/app/build.gradle` và `src/config/instanceRules.test.ts`
      # đọc — nên thêm app thứ ba không phải sửa cổng.
      #
      # CÒN HỞ, ghi ra để đừng ai đọc dấu ✅ dưới đây rộng hơn nó nói: dòng
      # `ios_signing.bundle_identifier` là YAML tĩnh của workflow, không phải biến,
      # nên cổng chạy lúc dựng không đọc được nó cho ĐÚNG workflow đang chạy. Chỗ
      # kiểm đúng của nó là một bài kiểm tĩnh trên chính tệp này, chưa có.
      - name: Soát danh tính app iOS khớp instances/
        script: |
          set -eu
          : "${APP_INSTANCE:?APP_INSTANCE rỗng — không đoán app}"
          KHAI="instances/${APP_INSTANCE}/instance.json"
          if [ ! -f "$KHAI" ]; then
            echo "❌ không có $KHAI"
            echo "   APP_INSTANCE='$APP_INSTANCE' không phải app nào trong instances/:"
            ls instances/
            exit 1
          fi
          CHO_BUNDLE=$(node -p "JSON.parse(require('fs').readFileSync('$KHAI','utf8')).ios.bundleId")
          CHO_TEN=$(node -p "JSON.parse(require('fs').readFileSync('$KHAI','utf8')).displayName")
          LECH=0
          if [ "${BUNDLE_ID:-}" != "$CHO_BUNDLE" ]; then
            echo "❌ BUNDLE_ID='${BUNDLE_ID:-}' khác ios.bundleId='$CHO_BUNDLE' khai ở $KHAI"
            LECH=1
          fi
          if [ "${APP_DISPLAY_NAME:-}" != "$CHO_TEN" ]; then
            echo "❌ APP_DISPLAY_NAME='${APP_DISPLAY_NAME:-}' khác displayName='$CHO_TEN' khai ở $KHAI"
            LECH=1
          fi
          if [ "$LECH" -ne 0 ]; then
            echo "   Sửa ở: nhóm biến của workflow này trong codemagic.yaml, HOẶC ở $KHAI."
            echo "   Lệch là dựng vỏ app này với chữ của app kia — và nó KHÔNG đỏ ở đâu khác."
            exit 1
          fi
          echo "✅ instance=$APP_INSTANCE bundle=$BUNDLE_ID tên='$APP_DISPLAY_NAME' — khớp $KHAI"

          # ── Biểu tượng iOS: MỘT bộ dùng chung, chưa có đường theo app ──────
          # `ios/SuperApp/Images.xcassets/AppIcon.appiconset` là bộ DUY NHẤT, và
          # `instances/<app>/` mới chỉ mang `android/` + `brand/` — không có `ios/`.
          # Nên bản iOS của app khác `aladin` dựng ra hôm nay mang biểu tượng
          # Aladin, chạy được, ký được, và không có gì đỏ. Chặn ở đây thay vì để
          # nó ra tới tay người thử.
          #
          # Mở khoá cần BA thứ, không phải một:
          #   (a) `instances/<app>/ios/AppIcon-1024.png` có mặt;
          #   (b) tệp đó 1024×1024 và KHÔNG có kênh alpha;
          #   (c) một bước sinh `AppIcon.appiconset` từ tệp đó, chạy trước `xcodebuild`.
          # Có (a) mà thiếu (c) thì biểu tượng vẫn là Aladin — ĐỪNG gỡ cổng theo sự
          # có mặt của tệp.
          #
          # Vì sao tên là `AppIcon-1024.png` chứ không phải `icon-1024.png`: bản trước
          # của cổng này đề nghị tên `icon-1024.png`, và nhà CheckFarm chỉ ra rằng ở
          # kho họ có ĐÚNG một tệp mang tên đó — 1024×1024, khác byte, và `hasAlpha:
          # yes`. Tệp đúng của họ tên `AppIcon-1024.png`, do bộ sinh `make-icons.mjs`
          # đặt. Tức câu chỉ đường của cổng cũ dẫn thẳng vào tệp sai.
          #
          # Vì sao alpha là chuyện phải chặn ở ĐÂY: App Store Connect từ chối kênh
          # alpha ở bước NỘP, không ở bước dựng. Bản dựng xanh, tải lên xong, rồi bị
          # chặn ở lượt xử lý bằng một dòng nói về "transparency" — cách chỗ gõ nhầm
          # vài tiếng và vài bước. Đo bằng `sips`, có sẵn trên máy dựng macOS.
          # ⚠ Một bản trước của khối này đo ĐÚNG MỘT tệp — `instances/<app>/ios/AppIcon-1024.png`
          # — và bọc nó trong `if [ -f ]`. Tệp đó KHÔNG tồn tại cho `aladin`, mà `aladin`
          # lại là app DUY NHẤT luồng này dựng được lúc ấy. Nên với mọi lượt dựng thật,
          # phép đo alpha chưa bao giờ chạy một lần nào, và cổng vẫn in `✅ … khớp` rồi
          # thoát 0 — cổng có tên đúng mà đo sai đại lượng.
          #
          # Bài học đó quyết định THỨ TỰ hai việc dưới đây, và thứ tự mới là phần quan
          # trọng: **chép bộ biểu tượng của app TRƯỚC, đo SAU**. Đo phải rơi vào đúng tệp
          # sắp đi vào gói nộp. Đo trước khi chép là đo bộ của lượt dựng trước đó — vẫn
          # ra một dấu ✅, vẫn không nói gì về bản đang dựng.
          command -v sips >/dev/null 2>&1 || {
            echo "⛔ KHÔNG ĐO ĐƯỢC kênh alpha: máy dựng không có 'sips'."
            echo "   Đây là trạng thái MÙ, không phải trạng thái đạt — nên cổng đỏ."
            exit 1
          }

          do_bieu_tuong() {
            T="$1"
            RONG=$(sips -g pixelWidth  "$T" 2>/dev/null | awk '/pixelWidth/{print $2}')
            CAO=$(sips  -g pixelHeight "$T" 2>/dev/null | awk '/pixelHeight/{print $2}')
            ALPHA=$(sips -g hasAlpha   "$T" 2>/dev/null | awk '/hasAlpha/{print $2}')
            # `$(sips … | awk …)` nuốt mã thoát của `sips`: `awk` luôn trả 0, nên một
            # tệp 0 byte hay không phải ảnh cho ba biến RỖNG. So chuỗi rỗng với "1024"
            # thì đỏ, nhưng đỏ kèm câu "là ×, cần 1024×1024" — câu đó nói LỆCH trong khi
            # sự thật là KHÔNG ĐO ĐƯỢC, và nó dẫn người sửa đi tìm sai chỗ.
            if [ -z "$RONG" ] || [ -z "$CAO" ] || [ -z "$ALPHA" ]; then
              echo "⛔ KHÔNG ĐO ĐƯỢC $T — sips không trả đủ ba giá trị."
              echo "   Tệp 0 byte, không phải ảnh, hoặc sips hỏng. Đây KHÔNG phải 'ảnh sai cỡ'."
              exit 1
            fi
            if [ "$RONG" != "1024" ] || [ "$CAO" != "1024" ]; then
              echo "❌ $T là ${RONG}×${CAO}, cần 1024×1024."
              exit 1
            fi
            if [ "$ALPHA" != "no" ]; then
              echo "❌ $T CÓ kênh alpha (hasAlpha=$ALPHA)."
              echo "   App Store Connect từ chối ở bước NỘP, không ở bước dựng — nên nếu"
              echo "   không chặn ở đây thì chỗ hỏng lộ ra cách chỗ gõ nhầm vài tiếng đồng hồ."
              echo "   Lấy bản KHÔNG alpha; đừng lấy theo tên, hai tệp cùng cỡ có thể khác kênh."
              exit 1
            fi
            echo "✅ $T 1024×1024, không alpha"
          }

          # ── CHÉP BỘ BIỂU TƯỢNG CỦA ĐÚNG APP ĐANG DỰNG ──────────────────────
          # Thư mục `ios/SuperApp/Images.xcassets/AppIcon.appiconset` là chỗ Xcode
          # đọc, KHÔNG phải tài sản của app nào. Mỗi lượt dựng chép đè nó bằng bộ
          # của app đang dựng, giữ trong `instances/<app>/ios/AppIcon.appiconset/`.
          #
          # Trước bản này chỗ đây là một cổng `exit 1` cho mọi app khác `aladin`,
          # kèm câu "chưa có bước sinh bộ đó theo app". Câu ấy ĐÚNG với trạng thái
          # lúc nó được viết; nay bước đó có thật nên cổng hết việc. Và cái nó dặn
          # thì vẫn giữ nguyên hiệu lực: mở khoá bằng BƯỚC CHỌN, không phải bằng sự
          # có mặt của một tệp ảnh.
          NGUON_BIEU_TUONG="instances/${APP_INSTANCE}/ios/AppIcon.appiconset"
          DICH_BIEU_TUONG="ios/SuperApp/Images.xcassets/AppIcon.appiconset"
          if [ ! -d "$NGUON_BIEU_TUONG" ]; then
            echo "❌ thiếu $NGUON_BIEU_TUONG"
            echo "   Mỗi app tự mang bộ biểu tượng iOS của mình. Sinh bằng:"
            echo "     python3 scripts/sinh-bieu-tuong.py ${APP_INSTANCE}"
            echo "   rồi commit kết quả. KHÔNG mượn bộ của app khác — mượn được thì"
            echo "   bản dựng vẫn xanh và vẫn ký được, sai chỉ lộ khi có người nhìn máy."
            exit 1
          fi
          rm -rf "$DICH_BIEU_TUONG"
          mkdir -p "$DICH_BIEU_TUONG"
          cp "$NGUON_BIEU_TUONG"/* "$DICH_BIEU_TUONG"/

          # Chép xong thì ĐỌC LẠI, không tin là `cp` đã chạy. `cmp` so đúng tệp sắp
          # đi vào gói với tệp nguồn của app này: chép hụt, chép nhầm thư mục, hay
          # `cp` thất bại lặng đều đỏ ở đây — thay vì lộ ra dưới dạng một bản mang
          # biểu tượng của app khác, thứ không phép kiểm tự động nào bắt được.
          if ! cmp -s "$NGUON_BIEU_TUONG/icon-1024.png" "$DICH_BIEU_TUONG/icon-1024.png"; then
            echo "❌ bộ biểu tượng đã chép KHÔNG khớp nguồn của '$APP_INSTANCE'."
            exit 1
          fi
          echo "✅ biểu tượng iOS: $NGUON_BIEU_TUONG → $DICH_BIEU_TUONG"

          BO_DONG_GOI="$DICH_BIEU_TUONG/icon-1024.png"
          if [ ! -f "$BO_DONG_GOI" ]; then
            echo "❌ thiếu $BO_DONG_GOI — đây là ảnh đi vào gói nộp, không phải tệp tuỳ chọn."
            exit 1
          fi
          do_bieu_tuong "$BO_DONG_GOI"

          # ── CHÉP MÀN CHÀO CỦA ĐÚNG APP ĐANG DỰNG ───────────────────────────
          # Cùng luật với bộ biểu tượng ngay trên: `ios/SuperApp/LaunchScreen.storyboard`
          # là chỗ Xcode ĐỌC, không phải tài sản của app nào.
          #
          # Vì sao phải chép chứ không thay biến như `Info.plist`: Xcode chỉ làm phép
          # thay `$(BIẾN)` bên trong `Info.plist`. Với `.storyboard` thì KHÔNG — đó là
          # ảnh tĩnh biên dịch sẵn lúc dựng. Nên tới trước bản này, MỌI app dựng từ
          # nền mã này đều hiện chữ "Aladin" cùng khẩu hiệu tiếng Anh của Aladin ở
          # màn chào. Đó là màn ĐẦU TIÊN người dùng thấy, trước cả màn đăng nhập.
          #
          # Chỗ này cố ý KHÔNG có đường lùi "thiếu thì bỏ qua": bỏ qua nghĩa là dựng
          # ra app mang màn chào của app khác, và bản dựng vẫn xanh, vẫn ký được.
          NGUON_MAN_CHAO="instances/${APP_INSTANCE}/ios/LaunchScreen.storyboard"
          DICH_MAN_CHAO="ios/SuperApp/LaunchScreen.storyboard"
          if [ ! -f "$NGUON_MAN_CHAO" ]; then
            echo "❌ thiếu $NGUON_MAN_CHAO"
            echo "   Mỗi app tự mang màn chào của mình. Chép từ một app đã có rồi"
            echo "   đổi tên + khẩu hiệu + màu nền theo instances/${APP_INSTANCE}/instance.json."
            echo "   KHÔNG mượn của app khác — mượn được thì bản dựng vẫn xanh."
            exit 1
          fi
          cp "$NGUON_MAN_CHAO" "$DICH_MAN_CHAO"

          # Đọc lại, không tin là `cp` đã chạy — cùng lý do với bộ biểu tượng.
          if ! cmp -s "$NGUON_MAN_CHAO" "$DICH_MAN_CHAO"; then
            echo "❌ màn chào đã chép KHÔNG khớp nguồn của '$APP_INSTANCE'."
            exit 1
          fi
          # Và đo NỘI DUNG, không chỉ đo byte: `cmp` xanh vẫn có thể là chép đúng một
          # tệp nguồn mang tên app khác. Tên hiển thị của app phải có mặt trong tệp.
          if ! grep -q "$APP_DISPLAY_NAME" "$DICH_MAN_CHAO"; then
            echo "❌ màn chào không chứa tên '$APP_DISPLAY_NAME' — nguồn của app này đặt sai nội dung."
            exit 1
          fi
          echo "✅ màn chào iOS: $NGUON_MAN_CHAO → $DICH_MAN_CHAO (có '$APP_DISPLAY_NAME')"

      # ── CHỐT MÃ GÓI iOS ─────────────────────────────────────────────────
      # Vì sao KHÔNG truyền `PRODUCT_BUNDLE_IDENTIFIER=` trên dòng lệnh
      # `xcodebuild`: setting truyền kiểu đó áp cho MỌI target trong workspace,
      # kể cả các bundle tài nguyên do CocoaPods sinh. Chúng sẽ mang chung một
      # mã gói, và chỗ đó KHÔNG đỏ lúc dựng — nó đỏ lúc Apple soát gói đã nộp.
      #
      # Nên sửa đúng hai dòng của target ứng dụng trong `project.pbxproj`, rồi
      # ĐỌC LẠI để chứng minh đã đổi. Không đổi được thì DỪNG: dựng tiếp là ra
      # một tệp mang mã gói của app kia, không dấu hiệu nào cho tới lúc nộp.
      #
      # (`APP_DISPLAY_NAME` thì vẫn truyền trên dòng lệnh được — đó là setting
      # do mình đặt, chỉ `Info.plist` của app này đọc, không target nào khác.)
      - name: Chốt mã gói iOS
        script: |
          set -eu
          PBX=ios/SuperApp.xcodeproj/project.pbxproj
          : "${BUNDLE_ID:?BUNDLE_ID rỗng — không đoán mã gói}"
          echo "→ đặt PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID"
          /usr/bin/sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PBX"
          GOT=$(grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBX" || true)
          if [ "$GOT" -ne 2 ]; then
            echo "❌ chờ 2 dòng mang '$BUNDLE_ID', đếm được $GOT"
            grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBX" || true
            exit 1
          fi
          echo "✅ mã gói iOS = $BUNDLE_ID (2/2 cấu hình)"

      - name: Build iOS Archive (unsigned)
        script: |
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          rm -rf "$ARCHIVE_PATH"
          mkdir -p "$IPA_OUTPUT_DIR"
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No xcworkspace"; exit 1
          fi
          echo "WORKSPACE : $WORKSPACE"
          echo "SCHEME    : $XCODE_SCHEME"
          echo "ARCHIVE   : $ARCHIVE_PATH"
          LOG_FILE="$CM_BUILD_DIR/xcodebuild.log"

          xcodebuild \
            -quiet \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            APP_DISPLAY_NAME="$APP_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_SIGNATURE_AGGREGATION=NO \
            SWIFT_VERSION=5.9 \
            CLANG_SCAN_DEPS_ENABLE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CODE_SIGN_FLAGS="--ignore-non-resolved-imports" \
            'OTHER_LDFLAGS=$(inherited) -ObjC -lc++' \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ xcodebuild FAILED (exit $BUILD_EXIT). Last 80 lines:"
            tail -80 "$LOG_FILE"
            exit $BUILD_EXIT
          fi
          echo "✅ Archive:"
          ls -lhd "$ARCHIVE_PATH"


      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ No .app!"; exit 1; fi

          PAYLOAD_DIR="$IPA_OUTPUT_DIR/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -r "$APP_PATH" "$PAYLOAD_DIR/"
          IPA_NAME="OriLife-unsigned.ipa"
          cd "$IPA_OUTPUT_DIR"
          zip -r "$IPA_NAME" Payload/
          rm -rf Payload/

          echo "✅ IPA:"
          ls -lh "$IPA_OUTPUT_DIR/$IPA_NAME"
          echo "✅ IPA packaged"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/OriLife.xcarchive/dSYMs/*.dSYM
      # Sourcemap + bundle JS để de-minify stack crash (tải về gửi lại để giải frame).
      - build/jsmap/main.jsbundle.map
      - build/jsmap/main.jsbundle

  # ============================================================
  # Workflow 2: iOS App Store (Signed)
  # ============================================================
  # ⚠ BA KHỐI DƯỚI ĐÂY (`environment`, `scripts`, `artifacts`) MANG MỎ NEO YAML và
  # được `ios-production` — đường NỘP APP STORE THẬT — dùng lại nguyên vẹn. Sửa bất kỳ
  # bước nào ở đây là sửa CẢ đường phát hành cho người dùng phổ thông, dù diff chỉ hiện
  # thay đổi trong khối `ios-appstore`. Đây là đánh đổi có chủ ý: một nguồn duy nhất để
  # hai bản dựng không bao giờ lệch nhau, đổi lấy việc người sửa phải nhớ điều này.
  # Muốn đổi hành vi của RIÊNG đường thử thì tách bước đó ra khỏi mỏ neo trước đã.
  ios-appstore:
    name: iOS TestFlight (nhánh develop — nhóm thử nội bộ)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment: &ios_release_environment
      node: 22.11.0
      xcode: 26.4  # PIN 26.4 CỤ THỂ — KHÔNG để `26` (resolve = 26.0 = Swift < 6.2) hay
                   # `latest` (trôi về 26.0). expo-modules-jsi (expo 56) dùng `weak let`
                   # (SE-0481, chỉ có ở Swift 6.2) → 26.0 FAIL "'weak' must be a mutable
                   # variable"; 16.4=Swift 6.1 FAIL "Swift tools 6.2 but installed 6.1".
                   # Xcode 26.4 = Swift 6.2 → ĐÃ chứng minh compile được ExpoModulesJSI.
      cocoapods: default
      groups:
        - scanner_secrets
      vars:
        # ── HAI APP ─────────────────────────────────────────────────────────
        # `BUNDLE_ID` trước bản này là biến CHẾT: khai ở đây, 0 chỗ đọc, còn
        # mã gói thật ghi cứng trong `project.pbxproj:298,331`. Nay nó được
        # truyền thẳng vào `xcodebuild` nên đổi ở đây là đổi thật.
        # `CFBundleDisplayName` trong `Info.plist` nay là `$(APP_DISPLAY_NAME)`.
        # Luồng iOS nay dựng được nhiều app. Bộ biểu tượng chọn theo `APP_INSTANCE`
        # ở bước "Soát danh tính app iOS" (chép `instances/<app>/ios/AppIcon.appiconset`
        # vào chỗ Xcode đọc, rồi đo lại chính tệp vừa chép).
        #
        # ⚠ BA biến dưới đây phải đổi CÙNG NHAU, và `ios_signing.bundle_identifier`
        # là biến thứ tư. Đổi ba quên một thì lượt dựng đi tới tận bước ký rồi mới
        # đỏ — hoặc tệ hơn, ký được bằng hồ sơ của app kia. Đừng đặt đè từng biến
        # khi chạy tay; dùng đúng luồng của app đó.
        #
        # Bản CheckFarm nằm ở luồng `ios-appstore-checkfarm` bên dưới.
        BUNDLE_ID: vn.aladinapp
        APP_DISPLAY_NAME: Aladin
        APP_INSTANCE: aladin
        XCODE_SCHEME: SuperApp
        ARCHIVE_PATH: build/ios/OriLife.xcarchive
        IPA_OUTPUT_DIR: build/ios/ipa
        APPLE_TEAM_ID: 3666KPJX5R
      ios_signing:
        distribution_type: app_store
        bundle_identifier: vn.aladinapp

    # CHỈ `develop`. Trước 18/08 workflow này ăn cả `main` lẫn `develop` và cả hai
    # cùng đổ vào MỘT luồng TestFlight — nên không ai phân biệt được bản người thử
    # đang cầm là bản thử hay bản phát hành, và số build ("86") thì do App Store
    # Connect cấp chứ không chỉ về nhánh nào. Nay tách: `develop` → TestFlight ở
    # đây; `main` → `ios-production` bên dưới (cùng script, khác cửa phát hành).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
      cancel_previous_builds: true

    scripts: &ios_release_scripts

      # CỔNG SOÁT — cùng lý do với `android-aab-aladin` (đọc chú thích dài ở đó).
      # Workflow này bắn thẳng lên TestFlight (`publishing.app_store_connect`) nên
      # bản thiếu khoá tới tay người thử ngay, không kịp rút lại.
      - name: Soát khoá API trước khi phát hành
        script: |
          if [ -n "$API_KEY" ]; then
            # Chỉ nói CÓ MẶT, không nói dài bao nhiêu: trình che log của Codemagic che
            # GIÁ TRỊ, không che con số suy ra từ giá trị. Độ dài là một mẩu tin thật về
            # một bí mật, in ra vĩnh viễn trong log mà không đổi lại được gì.
            echo "✅ API_KEY có mặt."
          elif [ "$ALLOW_NO_API_KEY" = "1" ]; then
            echo "⚠️  Không có API_KEY — dựng tiếp vì ALLOW_NO_API_KEY=1."
            echo "    Bản này nướng 'mock-local-api-key' vào header X-API-Key (aladin-api.ts:75)."
            echo "    Chỉ chạm client aladin-api (ĐÃ deprecated, xem chú thích đầu tệp đó);"
            echo "    farmService / treeReIDService / provenanceService KHÔNG gửi header này."
          else
            echo "❌ Không có API_KEY."
            echo "   Nạp ở: Codemagic → Environment variables → nhóm 'scanner_secrets' → biến API_KEY."
            echo "   HOẶC, nếu chốt là bản này không cần: đặt ALLOW_NO_API_KEY=1 rồi dựng lại."
            echo "   Đo 2026-08-17 trước khi quyết: mã máy chủ OriLife KHÔNG có chỗ nào đọc header"
            echo "   X-API-Key, và hai cửa ĐỌC công khai trả lời bình thường khi không gửi khoá"
            echo "   (GET /api/health → 200; GET /api/tree_by_code/<mã> → 404 đúng hợp đồng, không 401)."
            echo "   Cửa GHI thì CHƯA đo được — đó là lý do cổng này còn đứng thay vì bỏ hẳn."
            exit 1
          fi

      # ── CỔNG: danh tính app iOS phải khớp `instances/<app>/instance.json` ─
      # Bên Android đã có phép so này từ lâu — `APP_INSTANCE` vs `ANDROID_FLAVOR`
      # trong workflow `android-aab-aladin`, kèm câu nói đúng cái hại: *"lệch
      # hai biến này là dựng vỏ app này với chữ của app kia"*. Nửa iOS KHÔNG có
      # phép so tương ứng nào, và nửa iOS mới là nửa nguy hơn: `BUNDLE_ID`,
      # `APP_DISPLAY_NAME`, `APP_INSTANCE` và `ios_signing.bundle_identifier` là
      # BỐN chỗ gõ tay cùng một sự thật, không chỗ nào trỏ về chỗ nào.
      #
      # Đặt lệch một trong bốn thì bản dựng vẫn ra, vẫn chạy, vẫn ký được, và
      # mang tên app này với mã gói app kia. Không có gì đỏ cho tới lúc Apple soát
      # gói đã nộp — hoặc không bao giờ đỏ, nếu chỗ lệch là tên hiển thị.
      #
      # Cổng này KHÔNG so hai biến gõ tay với nhau. Nó đọc `instances/` làm nguồn —
      # cùng nguồn mà `android/app/build.gradle` và `src/config/instanceRules.test.ts`
      # đọc — nên thêm app thứ ba không phải sửa cổng.
      #
      # CÒN HỞ, ghi ra để đừng ai đọc dấu ✅ dưới đây rộng hơn nó nói: dòng
      # `ios_signing.bundle_identifier` là YAML tĩnh của workflow, không phải biến,
      # nên cổng chạy lúc dựng không đọc được nó cho ĐÚNG workflow đang chạy. Chỗ
      # kiểm đúng của nó là một bài kiểm tĩnh trên chính tệp này, chưa có.
      - name: Soát danh tính app iOS khớp instances/
        script: |
          set -eu
          : "${APP_INSTANCE:?APP_INSTANCE rỗng — không đoán app}"
          KHAI="instances/${APP_INSTANCE}/instance.json"
          if [ ! -f "$KHAI" ]; then
            echo "❌ không có $KHAI"
            echo "   APP_INSTANCE='$APP_INSTANCE' không phải app nào trong instances/:"
            ls instances/
            exit 1
          fi
          CHO_BUNDLE=$(node -p "JSON.parse(require('fs').readFileSync('$KHAI','utf8')).ios.bundleId")
          CHO_TEN=$(node -p "JSON.parse(require('fs').readFileSync('$KHAI','utf8')).displayName")
          LECH=0
          if [ "${BUNDLE_ID:-}" != "$CHO_BUNDLE" ]; then
            echo "❌ BUNDLE_ID='${BUNDLE_ID:-}' khác ios.bundleId='$CHO_BUNDLE' khai ở $KHAI"
            LECH=1
          fi
          if [ "${APP_DISPLAY_NAME:-}" != "$CHO_TEN" ]; then
            echo "❌ APP_DISPLAY_NAME='${APP_DISPLAY_NAME:-}' khác displayName='$CHO_TEN' khai ở $KHAI"
            LECH=1
          fi
          if [ "$LECH" -ne 0 ]; then
            echo "   Sửa ở: nhóm biến của workflow này trong codemagic.yaml, HOẶC ở $KHAI."
            echo "   Lệch là dựng vỏ app này với chữ của app kia — và nó KHÔNG đỏ ở đâu khác."
            exit 1
          fi
          echo "✅ instance=$APP_INSTANCE bundle=$BUNDLE_ID tên='$APP_DISPLAY_NAME' — khớp $KHAI"

          # ── Biểu tượng iOS: MỘT bộ dùng chung, chưa có đường theo app ──────
          # `ios/SuperApp/Images.xcassets/AppIcon.appiconset` là bộ DUY NHẤT, và
          # `instances/<app>/` mới chỉ mang `android/` + `brand/` — không có `ios/`.
          # Nên bản iOS của app khác `aladin` dựng ra hôm nay mang biểu tượng
          # Aladin, chạy được, ký được, và không có gì đỏ. Chặn ở đây thay vì để
          # nó ra tới tay người thử.
          #
          # Mở khoá cần BA thứ, không phải một:
          #   (a) `instances/<app>/ios/AppIcon-1024.png` có mặt;
          #   (b) tệp đó 1024×1024 và KHÔNG có kênh alpha;
          #   (c) một bước sinh `AppIcon.appiconset` từ tệp đó, chạy trước `xcodebuild`.
          # Có (a) mà thiếu (c) thì biểu tượng vẫn là Aladin — ĐỪNG gỡ cổng theo sự
          # có mặt của tệp.
          #
          # Vì sao tên là `AppIcon-1024.png` chứ không phải `icon-1024.png`: bản trước
          # của cổng này đề nghị tên `icon-1024.png`, và nhà CheckFarm chỉ ra rằng ở
          # kho họ có ĐÚNG một tệp mang tên đó — 1024×1024, khác byte, và `hasAlpha:
          # yes`. Tệp đúng của họ tên `AppIcon-1024.png`, do bộ sinh `make-icons.mjs`
          # đặt. Tức câu chỉ đường của cổng cũ dẫn thẳng vào tệp sai.
          #
          # Vì sao alpha là chuyện phải chặn ở ĐÂY: App Store Connect từ chối kênh
          # alpha ở bước NỘP, không ở bước dựng. Bản dựng xanh, tải lên xong, rồi bị
          # chặn ở lượt xử lý bằng một dòng nói về "transparency" — cách chỗ gõ nhầm
          # vài tiếng và vài bước. Đo bằng `sips`, có sẵn trên máy dựng macOS.
          # ⚠ Một bản trước của khối này đo ĐÚNG MỘT tệp — `instances/<app>/ios/AppIcon-1024.png`
          # — và bọc nó trong `if [ -f ]`. Tệp đó KHÔNG tồn tại cho `aladin`, mà `aladin`
          # lại là app DUY NHẤT luồng này dựng được lúc ấy. Nên với mọi lượt dựng thật,
          # phép đo alpha chưa bao giờ chạy một lần nào, và cổng vẫn in `✅ … khớp` rồi
          # thoát 0 — cổng có tên đúng mà đo sai đại lượng.
          #
          # Bài học đó quyết định THỨ TỰ hai việc dưới đây, và thứ tự mới là phần quan
          # trọng: **chép bộ biểu tượng của app TRƯỚC, đo SAU**. Đo phải rơi vào đúng tệp
          # sắp đi vào gói nộp. Đo trước khi chép là đo bộ của lượt dựng trước đó — vẫn
          # ra một dấu ✅, vẫn không nói gì về bản đang dựng.
          command -v sips >/dev/null 2>&1 || {
            echo "⛔ KHÔNG ĐO ĐƯỢC kênh alpha: máy dựng không có 'sips'."
            echo "   Đây là trạng thái MÙ, không phải trạng thái đạt — nên cổng đỏ."
            exit 1
          }

          do_bieu_tuong() {
            T="$1"
            RONG=$(sips -g pixelWidth  "$T" 2>/dev/null | awk '/pixelWidth/{print $2}')
            CAO=$(sips  -g pixelHeight "$T" 2>/dev/null | awk '/pixelHeight/{print $2}')
            ALPHA=$(sips -g hasAlpha   "$T" 2>/dev/null | awk '/hasAlpha/{print $2}')
            # `$(sips … | awk …)` nuốt mã thoát của `sips`: `awk` luôn trả 0, nên một
            # tệp 0 byte hay không phải ảnh cho ba biến RỖNG. So chuỗi rỗng với "1024"
            # thì đỏ, nhưng đỏ kèm câu "là ×, cần 1024×1024" — câu đó nói LỆCH trong khi
            # sự thật là KHÔNG ĐO ĐƯỢC, và nó dẫn người sửa đi tìm sai chỗ.
            if [ -z "$RONG" ] || [ -z "$CAO" ] || [ -z "$ALPHA" ]; then
              echo "⛔ KHÔNG ĐO ĐƯỢC $T — sips không trả đủ ba giá trị."
              echo "   Tệp 0 byte, không phải ảnh, hoặc sips hỏng. Đây KHÔNG phải 'ảnh sai cỡ'."
              exit 1
            fi
            if [ "$RONG" != "1024" ] || [ "$CAO" != "1024" ]; then
              echo "❌ $T là ${RONG}×${CAO}, cần 1024×1024."
              exit 1
            fi
            if [ "$ALPHA" != "no" ]; then
              echo "❌ $T CÓ kênh alpha (hasAlpha=$ALPHA)."
              echo "   App Store Connect từ chối ở bước NỘP, không ở bước dựng — nên nếu"
              echo "   không chặn ở đây thì chỗ hỏng lộ ra cách chỗ gõ nhầm vài tiếng đồng hồ."
              echo "   Lấy bản KHÔNG alpha; đừng lấy theo tên, hai tệp cùng cỡ có thể khác kênh."
              exit 1
            fi
            echo "✅ $T 1024×1024, không alpha"
          }

          # ── CHÉP BỘ BIỂU TƯỢNG CỦA ĐÚNG APP ĐANG DỰNG ──────────────────────
          # Thư mục `ios/SuperApp/Images.xcassets/AppIcon.appiconset` là chỗ Xcode
          # đọc, KHÔNG phải tài sản của app nào. Mỗi lượt dựng chép đè nó bằng bộ
          # của app đang dựng, giữ trong `instances/<app>/ios/AppIcon.appiconset/`.
          #
          # Trước bản này chỗ đây là một cổng `exit 1` cho mọi app khác `aladin`,
          # kèm câu "chưa có bước sinh bộ đó theo app". Câu ấy ĐÚNG với trạng thái
          # lúc nó được viết; nay bước đó có thật nên cổng hết việc. Và cái nó dặn
          # thì vẫn giữ nguyên hiệu lực: mở khoá bằng BƯỚC CHỌN, không phải bằng sự
          # có mặt của một tệp ảnh.
          NGUON_BIEU_TUONG="instances/${APP_INSTANCE}/ios/AppIcon.appiconset"
          DICH_BIEU_TUONG="ios/SuperApp/Images.xcassets/AppIcon.appiconset"
          if [ ! -d "$NGUON_BIEU_TUONG" ]; then
            echo "❌ thiếu $NGUON_BIEU_TUONG"
            echo "   Mỗi app tự mang bộ biểu tượng iOS của mình. Sinh bằng:"
            echo "     python3 scripts/sinh-bieu-tuong.py ${APP_INSTANCE}"
            echo "   rồi commit kết quả. KHÔNG mượn bộ của app khác — mượn được thì"
            echo "   bản dựng vẫn xanh và vẫn ký được, sai chỉ lộ khi có người nhìn máy."
            exit 1
          fi
          rm -rf "$DICH_BIEU_TUONG"
          mkdir -p "$DICH_BIEU_TUONG"
          cp "$NGUON_BIEU_TUONG"/* "$DICH_BIEU_TUONG"/

          # Chép xong thì ĐỌC LẠI, không tin là `cp` đã chạy. `cmp` so đúng tệp sắp
          # đi vào gói với tệp nguồn của app này: chép hụt, chép nhầm thư mục, hay
          # `cp` thất bại lặng đều đỏ ở đây — thay vì lộ ra dưới dạng một bản mang
          # biểu tượng của app khác, thứ không phép kiểm tự động nào bắt được.
          if ! cmp -s "$NGUON_BIEU_TUONG/icon-1024.png" "$DICH_BIEU_TUONG/icon-1024.png"; then
            echo "❌ bộ biểu tượng đã chép KHÔNG khớp nguồn của '$APP_INSTANCE'."
            exit 1
          fi
          echo "✅ biểu tượng iOS: $NGUON_BIEU_TUONG → $DICH_BIEU_TUONG"

          BO_DONG_GOI="$DICH_BIEU_TUONG/icon-1024.png"
          if [ ! -f "$BO_DONG_GOI" ]; then
            echo "❌ thiếu $BO_DONG_GOI — đây là ảnh đi vào gói nộp, không phải tệp tuỳ chọn."
            exit 1
          fi
          do_bieu_tuong "$BO_DONG_GOI"

          # ── CHÉP MÀN CHÀO CỦA ĐÚNG APP ĐANG DỰNG ───────────────────────────
          # Cùng luật với bộ biểu tượng ngay trên: `ios/SuperApp/LaunchScreen.storyboard`
          # là chỗ Xcode ĐỌC, không phải tài sản của app nào.
          #
          # Vì sao phải chép chứ không thay biến như `Info.plist`: Xcode chỉ làm phép
          # thay `$(BIẾN)` bên trong `Info.plist`. Với `.storyboard` thì KHÔNG — đó là
          # ảnh tĩnh biên dịch sẵn lúc dựng. Nên tới trước bản này, MỌI app dựng từ
          # nền mã này đều hiện chữ "Aladin" cùng khẩu hiệu tiếng Anh của Aladin ở
          # màn chào. Đó là màn ĐẦU TIÊN người dùng thấy, trước cả màn đăng nhập.
          #
          # Chỗ này cố ý KHÔNG có đường lùi "thiếu thì bỏ qua": bỏ qua nghĩa là dựng
          # ra app mang màn chào của app khác, và bản dựng vẫn xanh, vẫn ký được.
          NGUON_MAN_CHAO="instances/${APP_INSTANCE}/ios/LaunchScreen.storyboard"
          DICH_MAN_CHAO="ios/SuperApp/LaunchScreen.storyboard"
          if [ ! -f "$NGUON_MAN_CHAO" ]; then
            echo "❌ thiếu $NGUON_MAN_CHAO"
            echo "   Mỗi app tự mang màn chào của mình. Chép từ một app đã có rồi"
            echo "   đổi tên + khẩu hiệu + màu nền theo instances/${APP_INSTANCE}/instance.json."
            echo "   KHÔNG mượn của app khác — mượn được thì bản dựng vẫn xanh."
            exit 1
          fi
          cp "$NGUON_MAN_CHAO" "$DICH_MAN_CHAO"

          # Đọc lại, không tin là `cp` đã chạy — cùng lý do với bộ biểu tượng.
          if ! cmp -s "$NGUON_MAN_CHAO" "$DICH_MAN_CHAO"; then
            echo "❌ màn chào đã chép KHÔNG khớp nguồn của '$APP_INSTANCE'."
            exit 1
          fi
          # Và đo NỘI DUNG, không chỉ đo byte: `cmp` xanh vẫn có thể là chép đúng một
          # tệp nguồn mang tên app khác. Tên hiển thị của app phải có mặt trong tệp.
          if ! grep -q "$APP_DISPLAY_NAME" "$DICH_MAN_CHAO"; then
            echo "❌ màn chào không chứa tên '$APP_DISPLAY_NAME' — nguồn của app này đặt sai nội dung."
            exit 1
          fi
          echo "✅ màn chào iOS: $NGUON_MAN_CHAO → $DICH_MAN_CHAO (có '$APP_DISPLAY_NAME')"

      # ── CHỐT MÃ GÓI iOS ─────────────────────────────────────────────────
      # Vì sao KHÔNG truyền `PRODUCT_BUNDLE_IDENTIFIER=` trên dòng lệnh
      # `xcodebuild`: setting truyền kiểu đó áp cho MỌI target trong workspace,
      # kể cả các bundle tài nguyên do CocoaPods sinh. Chúng sẽ mang chung một
      # mã gói, và chỗ đó KHÔNG đỏ lúc dựng — nó đỏ lúc Apple soát gói đã nộp.
      #
      # Nên sửa đúng hai dòng của target ứng dụng trong `project.pbxproj`, rồi
      # ĐỌC LẠI để chứng minh đã đổi. Không đổi được thì DỪNG: dựng tiếp là ra
      # một tệp mang mã gói của app kia, không dấu hiệu nào cho tới lúc nộp.
      #
      # (`APP_DISPLAY_NAME` thì vẫn truyền trên dòng lệnh được — đó là setting
      # do mình đặt, chỉ `Info.plist` của app này đọc, không target nào khác.)
      - name: Chốt mã gói iOS
        script: |
          set -eu
          PBX=ios/SuperApp.xcodeproj/project.pbxproj
          : "${BUNDLE_ID:?BUNDLE_ID rỗng — không đoán mã gói}"
          echo "→ đặt PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID"
          /usr/bin/sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PBX"
          GOT=$(grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBX" || true)
          if [ "$GOT" -ne 2 ]; then
            echo "❌ chờ 2 dòng mang '$BUNDLE_ID', đếm được $GOT"
            grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBX" || true
            exit 1
          fi
          echo "✅ mã gói iOS = $BUNDLE_ID (2/2 cấu hình)"

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          echo "=== Certificates ==="
          security find-identity -v -p codesigning 2>/dev/null | head -10 || true
          echo "✅ Keychain + cert OK"

      - name: Create secrets.plist
        script: |
          SECRETS_DIR="ios/LocalPods/ScannerModule/Resources"
          mkdir -p "$SECRETS_DIR"
          cat > "$SECRETS_DIR/secrets.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>TREE_DETECTION_API</key>
              <string>${TREE_DETECTION_API:-https://api.orilife.io}</string>
              <key>API_KEY</key>
              <string>${API_KEY:-mock-local-api-key}</string>
              <key>REGION_CODE</key>
              <string>${REGION_CODE:-vn-south-01}</string>
          </dict>
          </plist>
          EOF
          echo "✅ secrets.plist (prod)"

      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ALADIN_API_URL=${BASE_API_URL:-https://api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://api.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://api.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://api.orilife.io}
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://api.lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://api.lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://api.orilife.io/captures/3d}
          # AladinWork (Việc làm). THIẾU biến này = cổng runtime tắt vĩnh viễn, module
          # rơi về rỗng DÙ máy chủ sống (đo 05/08: api.aladin.work/api/v1/health = 200).
          WORK_API_URL=${WORK_API_URL:-https://api.aladin.work/api/v1}

          # ProofChat. Cờ mặc định `off` = MỌI bản phát hành chạy dữ liệu giả, dù máy
          # chủ sống. Bật là quyết định của người phát hành, không phải hệ quả phụ của
          # việc máy chủ hồi sinh.
          #
          # ĐÍNH CHÍNH 2026-08-18: lý do cũ ghi ở đây ("token production còn nằm trần
          # trong AsyncStorage") ĐÃ HẾT HIỆU LỰC — commit 48efb57 chuyển token phiên
          # sang Keychain/Keystore qua `taad.secureStore` (`proofchat-api.ts`).
          # Còn lại một chặn THẬT, đo 2026-08-18 và nằm ở phía ProofChat chứ không
          # phải ở app: `GET https://api.proofchat.me/api/v1/users/search` → 404
          # ("Cannot GET"), tức cửa TÌM NGƯỜI để mở hội thoại vẫn đóng
          # (`proofchat-api.ts:465` đã ghi: khối `@Get('search')` bị bình luận ở BE).
          # Bật cờ lúc này chỉ đổi "chat giả" thành "chat thật nhưng không tìm được ai".
          PROOFCHAT_API_URL=${PROOFCHAT_API_URL:-https://api.proofchat.me/api/v1}
          PROOFCHAT_WS_URL=${PROOFCHAT_WS_URL:-https://api.proofchat.me}
          PROOFCHAT_WS_PATH=${PROOFCHAT_WS_PATH:-/socket.io}
          PROOFCHAT_BACKEND_ENABLED=${PROOFCHAT_BACKEND_ENABLED:-off}

          # ⚠ analytics.orilife.io KHÔNG phân giải được (DNS NXDOMAIN, đo 05/08) — để
          # trống thay vì nướng một host không tồn tại vào mọi bản build. Để trống CHỈ
          # an toàn sau khi đã gỡ đường lui viết cứng trong analyticsApi.ts (trước đây
          # chuỗi rỗng làm nó lui về một tunnel ngrok tạm + khoá dev). Nay rỗng = TẮT.
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-}

          # Bốn biến dưới đây `src/` CÓ import nhưng codemagic.yaml TỪNG KHÔNG ghi
          # (đo 15/08: 0 dòng trong cả 4 khối). Thiếu ở đây không đỏ, không cảnh báo —
          # react-native-dotenv mặc định `allowUndefined: true` nên biến thành
          # `undefined` lặng lẽ. Đường GitHub có cổng đối chiếu
          # (.github/actions/rn-env/action.yml) bắt được; đường Codemagic thì không,
          # nên phải ghi tay và giữ đồng bộ. Giá trị đặt đúng bằng bản GitHub ghi.
          ORG_MINT_ENABLED=${ORG_MINT_ENABLED:-false}
          # 0 = preprod (chuỗi thử) · 1 = mainnet (tiền thật). Lên mainnet thì đặt
          # CARDANO_NETWORK=1 ở nhóm biến Codemagic, không sửa dòng này.
          CARDANO_NETWORK=${CARDANO_NETWORK:-0}
          # `aladin` | `checkfarm` — app nào được dựng ra từ nền mã này. Đặt ở
          # nhóm biến của TỪNG workflow, không sửa dòng này. Giá trị lạ ⇒ app ném
          # ngay lúc nạp module (config/instance.config.ts), cố ý không rơi sạch.
          APP_INSTANCE=${APP_INSTANCE:-aladin}
          # Trống = để cổng runtime /health quyết (config.ts:38 chỉ chặn khi đúng 'off').
          WORK_BACKEND_ENABLED=${WORK_BACKEND_ENABLED:-}
          # Trống = TẮT hẳn. ĐỪNG điền tunnel ngrok — xem remoteLogger.ts, aladinChat.ts.
          REMOTE_LOG_URL=${REMOTE_LOG_URL:-}
          ALADIN_CHAT_URL=${ALADIN_CHAT_URL:-}
          # Truy vết bản dựng — xem lời dẫn dài ở khối `ios-adhoc-ipa` phía trên.
          BUILD_COMMIT=${CM_COMMIT:0:12}
          BUILD_BRANCH=${CM_BRANCH:-}
          BUILD_ID=${CM_BUILD_ID:-}
          EOF
          # Dọn whitespace lạc (tab/space) trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env (prod)"

      - name: Disable NSAllowsArbitraryLoads (production)
        script: |
          PLIST=ios/SuperApp/Info.plist
          # Đặt ATS TẮT cho prod. `Set` đỏ nếu khoá chưa có → thử `Add`; cây cha chưa có
          # thì tạo dict trước. (issue #144 mục 2.4)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool false" "$PLIST"
          # ĐỌC LẠI giá trị thật — chỉ in ✅ khi đúng là false, sai thì ĐỎ build. Trước đây
          # `|| true` nuốt lỗi rồi vẫn in ✅ dối: bản có thể lên kho với ATS còn mở.
          val=$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$PLIST" 2>/dev/null)
          if [ "$val" = "false" ]; then
            echo "✅ NSAllowsArbitraryLoads = false"
          else
            echo "❌ Không đặt được NSAllowsArbitraryLoads=false (đọc lại: '$val')"; exit 1
          fi

      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

      - name: Build Rust core (iOS)
        script: |
          set -e
          # PhoenixKey Enclave Rust core → static lib + cbindgen header cho pod
          # `taad_enclave_core`. PHẢI chạy TRƯỚC pod install (podspec tham chiếu .a + .h).
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          command -v cbindgen &> /dev/null || cargo install cbindgen --version "^0.27"
          ( cd rust/taad_enclave_core && bash build_ios.sh device )
          ls -lh rust/taad_enclave_core/ios/
          if [ ! -f rust/taad_enclave_core/ios/libtaad_enclave_core.a ]; then
            echo "❌ libtaad_enclave_core.a NOT built"; exit 1
          fi
          if [ ! -f rust/taad_enclave_core/ios/taad_enclave_core.h ]; then
            echo "❌ taad_enclave_core.h (cbindgen) NOT generated"; exit 1
          fi

      - name: Build Rust chat_mls (iOS)
        script: |
          set -e
          # ProofChat E2EE Rust core (rust/chat_mls) → libchat_mls.a + chat_mls.h (build.rs)
          # cho pod `chat_mls`. PHẢI chạy TRƯỚC pod install. Rust/cbindgen đã cài ở step taad.
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          ( cd rust/chat_mls && bash build_ios.sh device )
          ls -lh rust/chat_mls/ios/
          if [ ! -f rust/chat_mls/ios/libchat_mls.a ]; then
            echo "❌ libchat_mls.a NOT built"; exit 1
          fi
          if [ ! -f rust/chat_mls/ios/chat_mls.h ]; then
            echo "❌ chat_mls.h (cbindgen) NOT generated"; exit 1
          fi

      - name: CocoaPods install
        script: |
          set -e
          cd ios
          rm -rf ~/Library/Caches/CocoaPods Pods Podfile.lock
          pod install --repo-update
          cd ..

      # Bản sao thứ hai của cùng một cổng — lý do đầy đủ ở khối cùng tên phía trên,
      # trong luồng `ios-adhoc-ipa`. Phải có HAI bản vì tệp này khai `CocoaPods install`
      # ở hai chỗ, phục vụ bốn luồng iOS; đặt ở một chỗ thì ba luồng NỘP BẢN THẬT
      # (`ios-appstore`, `ios-production`, `ios-appstore-checkfarm`) đi qua cửa mở —
      # tức đúng ba luồng mà cổng này sinh ra để canh. Sửa bản này thì sửa cả bản kia.
      - name: Bản khai quyền riêng tư còn nguyên sau pod install
        script: |
          set -e
          MANIFEST=ios/SuperApp/PrivacyInfo.xcprivacy
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ $MANIFEST KHÔNG còn trên đĩa sau pod install."
            exit 1
          fi
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "❌ CỔNG KHÔNG CHẠY ĐƯỢC: không có kho git để đối chiếu."
            exit 1
          fi
          if ! git diff --quiet -- "$MANIFEST"; then
            echo "❌ $MANIFEST ĐÃ BỊ ĐỔI trong lượt dựng này (nghi `pod install` ghi đè)."
            echo "   Số dòng bây giờ: $(wc -l < "$MANIFEST")"
            git --no-pager diff --stat -- "$MANIFEST"
            exit 1
          fi
          echo "✅ $MANIFEST nguyên vẹn — $(wc -l < "$MANIFEST") dòng, khớp bản trong kho."

      # Chẩn-đoán globalThis.expo (xem chú-thích ở workflow unsigned). In file sinh lúc
      # pod install để chỉ đúng gốc 3D/video crash trên bản signed. Không chặn build.
      - name: Diagnose Expo modules (globalThis.expo)
        script: |
          echo "════════ EXPO DIAGNOSE ════════"
          PROV=$(find ios -iname "ExpoModulesProvider.swift" 2>/dev/null | head -1)
          echo "ExpoModulesProvider: ${PROV:-KHÔNG TÌM THẤY}"
          [ -n "$PROV" ] && { echo "----- nội dung -----"; cat "$PROV"; echo "----- hết -----"; }
          echo "--- Expo pods (Podfile.lock) ---"
          grep -iE "ExpoModulesCore|ExpoGL|EXGL|ExpoFileSystem|ExpoAsset|EXManifests" ios/Podfile.lock 2>/dev/null | head -30 || echo "(không có)"
          echo "--- New Arch flag ---"
          grep -rniE "RCT_NEW_ARCH_ENABLED|USE_HERMES" ios/Pods/Target\ Support\ Files/Pods-*/*.release.xcconfig 2>/dev/null | head
          node -e "console.log('expo-modules-core:', require('./node_modules/expo-modules-core/package.json').version, '| expo:', require('./node_modules/expo/package.json').version)"
          echo "════════ /EXPO DIAGNOSE ════════"

      - name: Disable code signing for Pods targets
        script: |
          find ios/Pods -name '*.xcconfig' | xargs grep -l 'CODE_SIGN' | while read f; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d; /^CODE_SIGNING_REQUIRED/d; /^CODE_SIGNING_ALLOWED/d' "$f"
          done
          PODS_CONFIG_DIR="ios/Pods/Target Support Files"
          find "$PODS_CONFIG_DIR" -name '*.xcconfig' | while read f; do
            printf '\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\n' >> "$f"
          done
          echo "✅ Pods code signing disabled"

      - name: Clean DerivedData & SPM
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/com.apple.dt.Xcode
          rm -rf ios/SuperApp.xcworkspace/xcshareddata/swiftpm/checkouts 2>/dev/null || true
          rm -rf ios/SuperApp.xcworkspace/xcuserdata 2>/dev/null || true
          echo "✅ DerivedData + SPM cleaned"

      - name: Set NODE_BINARY
        script: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Apply provisioning profiles
        script: |
          # Tự sinh ExportOptions.plist TỪ profile Codemagic đã cài (khớp đúng
          # tên/UUID/bundle-id). Tránh lỗi "No iOS App Store profiles matching
          # 'aladin_appstore_profile'" do hardcode tên profile sai.
          xcode-project use-profiles --export-options-plist ios/ExportOptions.plist
          echo "✅ Profiles applied + ExportOptions.plist tự sinh"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null | head -5 || true
          echo "── ExportOptions.plist ──"; cat ios/ExportOptions.plist 2>/dev/null || true

      - name: Patch Xcode Project — fix MapLibre signature conflict
        script: |
          cat > fix_signature.rb <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/SuperApp.xcodeproj')
          target = project.targets.find { |t| t.name == 'SuperApp' }
          phase_name = 'Fix MapLibre Signature Bug'
          unless target.shell_script_build_phases.find { |p| p.name == phase_name }
            phase = project.new(Xcodeproj::Project::Object::PBXShellScriptBuildPhase)
            phase.name = phase_name
            # CHỈ xóa signature của MapLibre (đúng framework gây "signature couldn't be
            # copied to Signatures"). TRƯỚC đây xóa MỌI *.signature → xóa cả của
            # ExpoModulesJSI.xcframework → trên bản SIGNED (App Store validate chặt) framework
            # không load → expo JSI (globalThis.expo) KHÔNG cài → 3D crash. Unsigned/AltStore
            # validate lỏng nên vẫn load → chạy. Narrow để không đụng ExpoModulesJSI.
            phase.shell_script = 'find "$BUILD_DIR/${CONFIGURATION}-iphoneos" -ipath "*MapLibre*" -name "*.signature" -delete 2>/dev/null || true'
            target.build_phases << phase
            project.save
            puts "✅ Added '#{phase_name}'"
          else
            puts "✅ '#{phase_name}' already exists"
          end
          RUBY
          ruby fix_signature.rb

      # ExportOptions.plist đã được "Apply provisioning profiles" tự sinh ở trên
      # (khớp đúng profile Codemagic cài) → KHÔNG hardcode nữa.

      # ⚠ ĐUA SỐ BUILD giữa hai workflow. `ios-appstore` (develop) và `ios-production`
      # (main) là hai workflow tách riêng, `cancel_previous_builds` KHÔNG huỷ chéo. Cả
      # hai chạy chính bước này trên cùng một app. Gộp `develop` vào `main` thường xảy
      # ra ngay sau một lượt đẩy `develop`, nên hai bản dựng có thể đọc cùng một số
      # "mới nhất" trước khi bên nào kịp tăng.
      # Triệu chứng khi trúng: App Store Connect từ chối số build trùng, bản dựng SAU
      # đỏ ở bước tải lên — KHÔNG mất gì, dựng lại là qua. Ghi ra đây để lần sau ai gặp
      # đỏ dạng đó thì biết ngay là đua số, không phải khoá ký hỏng.
      - name: Bump build number (TestFlight latest + 1)
        script: |
          set -e
          # Tự tăng CFBundleVersion = build mới nhất trên TestFlight + 1 (mỗi lần
          # build sign → +1). Dùng App Store Connect API key (group app_store_connect).
          export APP_STORE_CONNECT_KEY_IDENTIFIER=5JA4K7A7JD
          export APP_STORE_CONNECT_ISSUER_ID=e56d98f1-e6f0-4e46-9ca8-29b30c2a9a7b
          export APP_STORE_CONNECT_PRIVATE_KEY="$APP_STORE_CONNECT_PRIVATE_KEY"
          # APP_STORE_APPLE_ID = Apple ID (số) của app — App Store Connect → App → App Information.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "⚠️  Không lấy được số TestFlight (thiếu APP_STORE_APPLE_ID?) — dùng số committed trong pbxproj + 1"
            LATEST=$(grep -m1 -E "CURRENT_PROJECT_VERSION = [0-9]+" ios/*.xcodeproj/project.pbxproj | grep -oE "[0-9]+")
          fi
          NEW=$(( LATEST + 1 ))
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${NEW};/g" ios/*.xcodeproj/project.pbxproj
          echo "✅ iOS build number → ${NEW} (TestFlight latest: ${LATEST})"

      # Xuất JS bundle + SOURCEMAP để de-minify stack crash JS (CÙNG lệnh/.env như
      # phase bundle Xcode → khớp byte). Best-effort, không chặn archive.
      - name: Export JS sourcemap (debug crash)
        script: |
          mkdir -p "$CM_BUILD_DIR/build/jsmap"
          EXPO_UNSAFE_DOTENV_KEYS=ENV,NODE_ENV npx expo export:embed \
            --platform ios --dev false --entry-file index.js \
            --bundle-output "$CM_BUILD_DIR/build/jsmap/main.jsbundle" \
            --sourcemap-output "$CM_BUILD_DIR/build/jsmap/main.jsbundle.map" \
            2>&1 | tail -20 || echo "⚠️ export sourcemap lỗi (không chặn build)"
          ls -lh "$CM_BUILD_DIR/build/jsmap/" 2>/dev/null || true

      - name: Build iOS Archive (signed)
        script: |
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          rm -rf "$ARCHIVE_PATH"
          mkdir -p "$IPA_OUTPUT_DIR"
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No xcworkspace"; ls -la ios/; exit 1
          fi
          LOG_FILE="$CM_BUILD_DIR/xcodebuild.log"

          find ios/Pods -name "*.signature" -delete 2>/dev/null || true
          find "$CM_BUILD_DIR/DerivedData" -name "*.signature" -delete 2>/dev/null || true

          xcodebuild \
            -quiet \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            -skipPackagePluginValidation \
            archive \
            -allowProvisioningUpdates \
            APP_DISPLAY_NAME="$APP_DISPLAY_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            SWIFT_VERSION=5.9 \
            CLANG_SCAN_DEPS_ENABLE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            'OTHER_LDFLAGS=$(inherited) -ObjC -lc++' \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ xcodebuild FAILED. Last 80 lines:"
            tail -80 "$LOG_FILE"
            exit $BUILD_EXIT
          fi
          echo "✅ Archive:"
          ls -lhd "$ARCHIVE_PATH"

      - name: Export signed IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_OUTPUT_DIR" \
            -exportOptionsPlist ios/ExportOptions.plist \
            2>&1 | tee "$CM_BUILD_DIR/export.log"

          EXPORT_EXIT=${PIPESTATUS[0]}
          if [ $EXPORT_EXIT -eq 0 ]; then
            echo "✅ IPA exported:"
            ls -lh "$IPA_OUTPUT_DIR"/*.ipa
          else
            echo "❌ Export failed — last 40 lines:"
            tail -40 "$CM_BUILD_DIR/export.log"
            exit $EXPORT_EXIT
          fi

    artifacts: &ios_release_artifacts
      - build/ios/ipa/*.ipa
      - build/ios/OriLife.xcarchive/dSYMs/*.dSYM
      # Sourcemap + bundle JS để de-minify stack crash (tải về gửi lại để giải frame).
      - build/jsmap/main.jsbundle.map
      - build/jsmap/main.jsbundle

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: 5JA4K7A7JD
        issuer_id: e56d98f1-e6f0-4e46-9ca8-29b30c2a9a7b
        # submit_to_testflight: gán build vào nhóm tester TestFlight NGAY sau upload —
        # nếu không, build lên App Store Connect nhưng không ai nhận được (issue #144 mục 2.1).
        # ⚠ `beta_groups` PHẢI khớp TÊN NHÓM THẬT trong App Store Connect, sai thì bước
        # publish đỏ. Nhóm Internal (≤100 người có vai trò ASC) phát ngay, KHÔNG cần Beta
        # App Review; nhóm External phải qua review mỗi bản. Đổi tên dưới đây nếu nhóm khác.
        submit_to_testflight: true
        beta_groups:
          - OriLife Testing
        # false ở ĐÂY là đúng: workflow này chỉ chạy trên `develop` — bản cho nhóm thử,
        # không phải bản phát hành. Đường nộp App Store nằm ở `ios-production` bên dưới.
        submit_to_app_store: false

  # ============================================================
  # Workflow 2b: iOS Production — nhánh main, nộp App Store review
  # ============================================================
  # Dùng LẠI nguyên environment + scripts + artifacts của `ios-appstore` bằng mỏ neo
  # YAML (`*ios_release_*`): hai bản dựng phải giống nhau từng bước, chỉ khác cửa phát
  # hành. Sao chép tay 350 dòng thì sớm muộn hai bên lệch nhau và bản người dùng phổ
  # thông nhận KHÁC bản nhóm thử đã duyệt — đúng thứ quy trình này sinh ra để tránh.
  ios-production:
    name: iOS App Store (nhánh main — người dùng phổ thông)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment: *ios_release_environment

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts: *ios_release_scripts

    artifacts: *ios_release_artifacts

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: 5JA4K7A7JD
        issuer_id: e56d98f1-e6f0-4e46-9ca8-29b30c2a9a7b
        # Vẫn phát TestFlight: bản sắp lên store phải có người bấm thử trước, và nếu
        # Apple từ chối thì bản đó vẫn còn đường tới người thử.
        submit_to_testflight: true
        beta_groups:
          - OriLife Testing
        # KHÁC BIỆT DUY NHẤT so với `ios-appstore`: mỗi lần đẩy `main` là tự NỘP App
        # Store review.
        #
        # Nộp không phải là phát hành. Sau khi Apple duyệt, bản có ra tay người dùng
        # ngay hay không do App Store Connect → phiên bản → "Version Release" quyết
        # (đặt "Manually release this version" thì vẫn phải bấm tay). Cố ý KHÔNG khai
        # thêm khoá nào ở đây để không đặt cược cả tệp cấu hình vào một tên khoá chưa
        # kiểm được.
        #
        # ⚠ Lần đầu bật: siêu dữ liệu bản mới (ảnh chụp màn, "Có gì mới", phân loại độ
        # tuổi) phải điền xong bên App Store Connect, nếu không bước nộp đỏ. Đỏ ở bước
        # này KHÔNG mất gì: IPA đã lên TestFlight ở bước trên, nộp tay vẫn được.
        submit_to_app_store: true

  # ============================================================
  # Workflow 2c: iOS TestFlight — CheckFarm
  # ============================================================
  # Dùng LẠI `scripts` + `artifacts` của `ios-appstore` bằng mỏ neo YAML. Chỉ khối
  # `environment` viết riêng, vì `vars` là bảng lồng: khoá gộp YAML (`<<:`) đè cả
  # bảng chứ không trộn từng khoá, nên "kế thừa rồi sửa ba dòng" là thứ KHÔNG làm
  # được ở đây. Viết đủ còn hơn viết một thứ trông như kế thừa mà không phải.
  #
  # ⛔ PHÁP NHÂN PHÁT HÀNH — đọc trước khi sửa bất cứ dòng nào dưới đây.
  # App này mang thương hiệu CheckFarm nhưng **phát hành dưới pháp nhân Aladin**,
  # đội Apple `3666KPJX5R`, theo quyết định của chủ sở hữu ngày 2026-09-10. Nghĩa
  # là dùng CHUNG chứng chỉ phân phối với `vn.aladinapp` — đúng và cố ý, không
  # phải chỗ quên tách.
  #
  # Đây là trạng thái TẠM. Ngày CheckFarm Inc có tài khoản riêng thì chuyển giao
  # ứng dụng sang tài khoản đó. Mã gói `com.checkfarm.app` KHÔNG đổi khi chuyển
  # giao — nó theo ứng dụng, không theo tài khoản. Nợ này ghi ở
  # `instances/LUAT-SUPERAPP.md §6`; đừng để nó chỉ sống trong chú thích này.
  ios-appstore-checkfarm:
    name: iOS TestFlight — CheckFarm (chạy tay)

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: 26.4  # PIN CỤ THỂ, cùng lý do đã ghi ở `ios-appstore`. Hai luồng iOS
                   # phải cùng một bản Xcode: lệch bản là hai app dựng bằng hai
                   # trình biên dịch khác nhau từ CÙNG một cây mã.
      cocoapods: default
      groups:
        - scanner_secrets
      vars:
        BUNDLE_ID: com.checkfarm.app
        APP_DISPLAY_NAME: CheckFarm
        APP_INSTANCE: checkfarm
        XCODE_SCHEME: SuperApp
        ARCHIVE_PATH: build/ios/OriLife.xcarchive
        IPA_OUTPUT_DIR: build/ios/ipa
        APPLE_TEAM_ID: 3666KPJX5R
        # Số Apple ID của ỨNG DỤNG này, không phải của đội. Bước "Bump build
        # number" đọc `$APP_STORE_APPLE_ID` từ một khối `scripts` DÙNG CHUNG
        # (`&ios_release_scripts`), nên nếu luồng này không khai thì nó lấy giá
        # trị toàn cục — tức số của ứng dụng Aladin — rồi +1.
        #
        # Cả hai nhánh hỏng đều KHÔNG đỏ: lệnh hỏi số bọc trong `2>/dev/null ||
        # echo ""`, còn Apple thì nhận mọi số lớn hơn số đã tải. Nên chỗ này
        # phải khai, không thể chờ nó tự kêu.
        #
        # Vì sao vá TRƯỚC lượt Codemagic đầu chứ không sau: `submit_to_testflight:
        # true` ở dưới tải thẳng lên Apple, và Apple KHÔNG nhận số nhỏ hơn số đã
        # tải. Một lượt lấy nhầm số của app kia là ghim vĩnh viễn, không có đường
        # lùi. Giá vá trước là đúng dòng này.
        #
        # Nguồn: App Store Connect ▸ CheckFarm ▸ App Information (đọc 10/09/2026).
        # Mốc hiện tại trên TestFlight của app này: build 62, tải tay bằng
        # `xcrun altool` lúc 20:31 ngày 10/09/2026.
        APP_STORE_APPLE_ID: 6808575982
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.checkfarm.app

    # CHỈ CHẠY TAY, cùng lý do với hai luồng `android-aab-*`: một bản ký bằng chứng
    # chỉ phân phối thật chỉ nên ra đời khi có người chủ ý cần. Và app này chưa có
    # nhịp phát hành riêng — buộc nó vào một nhánh là dựng ra bản không ai đợi.
    triggering:
      events: []

    scripts: *ios_release_scripts

    artifacts: *ios_release_artifacts

    publishing:
      app_store_connect:
        # CÙNG khoá API với hai luồng Aladin — một khoá cấp cho cả đội
        # `3666KPJX5R`, không phải một khoá cho mỗi ứng dụng.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: 5JA4K7A7JD
        issuer_id: e56d98f1-e6f0-4e46-9ca8-29b30c2a9a7b
        submit_to_testflight: true
        # ⚠ Nhóm thử thuộc về TỪNG ứng dụng, không thuộc về đội. `OriLife Testing`
        # là nhóm của `vn.aladinapp` và KHÔNG tồn tại dưới ứng dụng này — khai tên
        # đó ở đây thì bước phát hành đỏ sau khi đã tải xong gói lên.
        # Nhóm dưới đây phải được tạo TRƯỚC lượt dựng đầu, trong App Store Connect
        # → ứng dụng CheckFarm → TestFlight → Internal Testing.
        beta_groups:
          - CheckFarm team
        # Chưa nộp App Store: ứng dụng chưa có siêu dữ liệu, và bước nộp đỏ khi
        # thiếu. Bật lên khi trang cửa hàng đã điền xong.
        submit_to_app_store: false

  # ============================================================
  # Workflow 3: Android Debug APK — Demo / Direct Install
  # ============================================================
  android-debug-apk:
    name: Android Debug APK (Demo + Direct Install)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      java: 17
      groups:
        - scanner_secrets
      vars:
        APK_OUTPUT: $CM_BUILD_DIR/android/app/build/outputs/apk/$ANDROID_FLAVOR/debug
        # ── HAI APP ─────────────────────────────────────────────────────────
        # `ANDROID_FLAVOR` chọn app nào được dựng. Đổi ở đây (hoặc đặt đè khi
        # chạy tay trên Codemagic) là đủ; KHÔNG có đường nào rơi về mặc định —
        # bước "Chốt flavor" bên dưới dừng hẳn nếu biến rỗng hoặc lạ.
        # `..._CAP` là cùng giá trị, viết hoa chữ đầu, vì tên tác vụ Gradle là
        # `assembleAladinDebug` chứ không phải `assemblealadinDebug`.
        ANDROID_FLAVOR: aladin
        ANDROID_FLAVOR_CAP: Aladin
        APP_INSTANCE: aladin

    # CHẠY TAY (2026-08-18). Đường GitHub đã dựng APK debug trên `develop`
    # (`.github/workflows/debug-apk.yml`) — chạy trên `ubuntu-latest` thay vì
    # `mac_mini_m2`, và MẠNH HƠN bản này: nó soi chính tệp APK vừa ra (đủ `.so` cho mọi
    # lát ABI, đúng host trong bản đã đóng gói), còn bản ở đây chỉ soi vật liệu đầu vào.
    # Chạy gradle trên máy Mac để ra một tệp APK thứ hai không ai tải là trả giá đắt cho
    # việc rẻ.
    #
    # Cái mất: bản 4 lát ABI (bản GitHub cố ý chỉ 2 lát vì runner hết đĩa), và APK debug
    # từ `main`. Cần máy ảo x86 thì bấm chạy tay workflow này.
    triggering:
      events: []

    scripts:
      # ── CHỐT FLAVOR ─────────────────────────────────────────────────────
      # Đứng TRƯỚC mọi bước dựng. `ANDROID_FLAVOR` rỗng thì `assemble${...}Debug`
      # co lại thành `assembleDebug` — tác vụ đó CÓ THẬT và nó dựng CẢ HAI app,
      # nên lượt dựng vẫn chạy rồi hỏng ở chỗ khác. Rỗng phải dừng ở đây.
      #
      # Kiểm luôn hai biến CÓ KHỚP NHAU không: đặt `ANDROID_FLAVOR=checkfarm` mà
      # quên đổi `..._CAP` thì Gradle dựng Aladin còn `find` đi tìm thư mục
      # checkfarm — bước dò tệp đỏ, và người đọc log sẽ đi tìm nhầm chỗ.
      - name: Chốt flavor Android
        script: |
          set -eu
          # DANH SÁCH APP ĐỌC TỪ `instances/`, KHÔNG viết tay ở đây.
          #
          # `android/app/build.gradle` sinh flavor bằng cách quét đúng thư mục này
          # (mỗi thư mục có `instance.json` là một app, và gradle ép `id` trùng tên
          # thư mục). Cổng này từng chép lại danh sách đó bằng tay — hai nơi khai
          # cùng một sự thật thì sớm muộn lệch nhau, và lúc lệch thì doanh nghiệp
          # thứ ba thêm được thư mục, dựng được trên máy, rồi dừng ở CI với câu
          # "giá trị lạ" cho một app CÓ THẬT.
          #
          # Câu báo lỗi in danh sách ĐO ĐƯỢC LÚC CHẠY, không phải danh sách viết
          # sẵn — để nó không bao giờ nói sai về thực tế nữa.
          DS=""
          for d in instances/*/; do
            [ -f "$d/instance.json" ] || continue
            DS="$DS $(basename "$d")"
          done
          DS="${DS# }"
          if [ -z "$DS" ]; then
            echo "❌ Không thấy app nào trong instances/ — mỗi app cần một thư mục có instance.json"
            exit 1
          fi

          if [ -z "${ANDROID_FLAVOR:-}" ]; then
            echo "❌ ANDROID_FLAVOR rỗng. Giá trị hợp lệ: $DS"
            exit 1
          fi
          HOP_LE=0
          for m in $DS; do [ "$m" = "$ANDROID_FLAVOR" ] && HOP_LE=1; done
          if [ "$HOP_LE" -ne 1 ]; then
            echo "❌ ANDROID_FLAVOR='$ANDROID_FLAVOR' lạ. Hợp lệ: $DS"
            exit 1
          fi

          # Gradle đặt tên tác vụ `assemble<Flavor>Debug` bằng cách VIẾT HOA ĐÚNG
          # CHỮ ĐẦU, giữ nguyên phần còn lại (`checkfarm` → `Checkfarm`, KHÔNG phải
          # `CheckFarm`). Suy theo đúng luật đó thay vì liệt kê từng app.
          EXPECT="$(printf '%s' "$ANDROID_FLAVOR" | cut -c1 | tr '[:lower:]' '[:upper:]')$(printf '%s' "$ANDROID_FLAVOR" | cut -c2-)"
          if [ "${ANDROID_FLAVOR_CAP:-}" != "$EXPECT" ]; then
            echo "❌ ANDROID_FLAVOR_CAP='${ANDROID_FLAVOR_CAP:-}' không khớp ANDROID_FLAVOR='$ANDROID_FLAVOR' (chờ '$EXPECT')"
            exit 1
          fi
          if [ "${APP_INSTANCE:-}" != "$ANDROID_FLAVOR" ]; then
            echo "❌ APP_INSTANCE='${APP_INSTANCE:-}' khác ANDROID_FLAVOR='$ANDROID_FLAVOR'."
            echo "   Lệch hai biến này là dựng vỏ app này với chữ của app kia."
            exit 1
          fi
          echo "✅ flavor=$ANDROID_FLAVOR cap=$ANDROID_FLAVOR_CAP instance=$APP_INSTANCE"

      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ALADIN_API_URL=${BASE_API_URL:-https://api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://api.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://api.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://api.orilife.io}
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://api.lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://api.lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://api.orilife.io/captures/3d}
          # AladinWork (Việc làm). THIẾU biến này = cổng runtime tắt vĩnh viễn, module
          # rơi về rỗng DÙ máy chủ sống (đo 05/08: api.aladin.work/api/v1/health = 200).
          WORK_API_URL=${WORK_API_URL:-https://api.aladin.work/api/v1}

          # ProofChat. Cờ mặc định `off` = MỌI bản phát hành chạy dữ liệu giả, dù máy
          # chủ sống. Bật là quyết định của người phát hành, không phải hệ quả phụ của
          # việc máy chủ hồi sinh.
          #
          # ĐÍNH CHÍNH 2026-08-18: lý do cũ ghi ở đây ("token production còn nằm trần
          # trong AsyncStorage") ĐÃ HẾT HIỆU LỰC — commit 48efb57 chuyển token phiên
          # sang Keychain/Keystore qua `taad.secureStore` (`proofchat-api.ts`).
          # Còn lại một chặn THẬT, đo 2026-08-18 và nằm ở phía ProofChat chứ không
          # phải ở app: `GET https://api.proofchat.me/api/v1/users/search` → 404
          # ("Cannot GET"), tức cửa TÌM NGƯỜI để mở hội thoại vẫn đóng
          # (`proofchat-api.ts:465` đã ghi: khối `@Get('search')` bị bình luận ở BE).
          # Bật cờ lúc này chỉ đổi "chat giả" thành "chat thật nhưng không tìm được ai".
          PROOFCHAT_API_URL=${PROOFCHAT_API_URL:-https://api.proofchat.me/api/v1}
          PROOFCHAT_WS_URL=${PROOFCHAT_WS_URL:-https://api.proofchat.me}
          PROOFCHAT_WS_PATH=${PROOFCHAT_WS_PATH:-/socket.io}
          PROOFCHAT_BACKEND_ENABLED=${PROOFCHAT_BACKEND_ENABLED:-off}

          # ⚠ analytics.orilife.io KHÔNG phân giải được (DNS NXDOMAIN, đo 05/08) — để
          # trống thay vì nướng một host không tồn tại vào mọi bản build. Để trống CHỈ
          # an toàn sau khi đã gỡ đường lui viết cứng trong analyticsApi.ts (trước đây
          # chuỗi rỗng làm nó lui về một tunnel ngrok tạm + khoá dev). Nay rỗng = TẮT.
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-}

          # Bốn biến dưới đây `src/` CÓ import nhưng codemagic.yaml TỪNG KHÔNG ghi
          # (đo 15/08: 0 dòng trong cả 4 khối). Thiếu ở đây không đỏ, không cảnh báo —
          # react-native-dotenv mặc định `allowUndefined: true` nên biến thành
          # `undefined` lặng lẽ. Đường GitHub có cổng đối chiếu
          # (.github/actions/rn-env/action.yml) bắt được; đường Codemagic thì không,
          # nên phải ghi tay và giữ đồng bộ. Giá trị đặt đúng bằng bản GitHub ghi.
          ORG_MINT_ENABLED=${ORG_MINT_ENABLED:-false}
          # 0 = preprod (chuỗi thử) · 1 = mainnet (tiền thật). Lên mainnet thì đặt
          # CARDANO_NETWORK=1 ở nhóm biến Codemagic, không sửa dòng này.
          CARDANO_NETWORK=${CARDANO_NETWORK:-0}
          # `aladin` | `checkfarm` — app nào được dựng ra từ nền mã này. Đặt ở
          # nhóm biến của TỪNG workflow, không sửa dòng này. Giá trị lạ ⇒ app ném
          # ngay lúc nạp module (config/instance.config.ts), cố ý không rơi sạch.
          APP_INSTANCE=${APP_INSTANCE:-aladin}
          # Trống = để cổng runtime /health quyết (config.ts:38 chỉ chặn khi đúng 'off').
          WORK_BACKEND_ENABLED=${WORK_BACKEND_ENABLED:-}
          # Trống = TẮT hẳn. ĐỪNG điền tunnel ngrok — xem remoteLogger.ts, aladinChat.ts.
          REMOTE_LOG_URL=${REMOTE_LOG_URL:-}
          ALADIN_CHAT_URL=${ALADIN_CHAT_URL:-}
          # Truy vết bản dựng — xem lời dẫn dài ở khối `ios-adhoc-ipa` phía trên.
          BUILD_COMMIT=${CM_COMMIT:0:12}
          BUILD_BRANCH=${CM_BRANCH:-}
          BUILD_ID=${CM_BUILD_ID:-}
          EOF
          # Dọn whitespace lạc (tab/space) trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env created"

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

      - name: Create Android config (secrets + gradle.properties)
        script: |
          set -e
          # secrets.properties (gitignored) — API cho orilifesdk. Từ group scanner_secrets.
          cat > android/app/secrets.properties <<EOF
          TREE_DETECTION_API=${TREE_DETECTION_API:-https://api.orilife.io}
          BASE_API_URL=${BASE_API_URL:-https://api.orilife.io}
          API_KEY=${API_KEY:-mock-local-api-key}
          REGION_CODE=${REGION_CODE:-vn-south-01}
          EOF
          # gradle.properties (gitignored) — RN config. Debug dùng debug.keystore nên
          # KHÔNG cần upload signing ở đây.
          cat > android/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          # ĐO 2026-08-20: dòng NÀY mới cắt lát ABI, không phải `abiFilters`.
          # Dựng thật với `x86` ở đây + abiFilters KHÔNG có x86 ⇒ .aab vẫn ra lát
          # base/lib/x86 25 tệp (ba lát kia 28), thiếu đúng libtaad_enclave_core.so,
          # libchat_mls.so, libcardano_serialization_lib. Plugin com.facebook.react
          # đọc dòng này và ghi đè abiFilters viết tay. Đó là dạng hỏng của bản 87.
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          # Tắt tích hợp worklets của expo-modules-core. KHÔNG có dòng này thì
          # WorkletRuntimeInstaller.cpp biên dịch với WORKLETS_ENABLED=1 và đòi
          # <worklets/Compat/StableApi.h> — header chỉ có từ react-native-worklets
          # 0.8.0, mà dự án ghim 0.7.4 ⇒ build native gãy. Bản vá
          # patches/expo-modules-core+56.0.22.patch mở đúng công tắc này, nhưng
          # android/gradle.properties bị gitignore và bị heredoc dưới đây ghi đè,
          # nên bản vá vô tác dụng suốt từ 26/07 — 10/10 lần chạy CI đỏ vì nó.
          expo.enableWorkletsIntegration=false
          EOF
          # Dọn whitespace lạc trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+([.\w]*))=[ \t]+/$1=/; s/[ \t]+$//' android/app/secrets.properties android/gradle.properties
          echo "✅ secrets.properties + gradle.properties created"

      - name: Build Rust core (Android)
        script: |
          set -e
          # PhoenixKey Enclave Rust core → libtaad_enclave_core.so per-ABI vào
          # android/app/src/main/jniLibs. PHẢI chạy TRƯỚC gradle (TaadEnclaveModule.kt
          # System.loadLibrary("taad_enclave_core")).
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk &> /dev/null || cargo install cargo-ndk

          # NDK: Codemagic đặt SDK ở ANDROID_SDK_ROOT; chọn NDK mới nhất.
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "❌ NDK không tìm thấy trong $ANDROID_SDK_ROOT/ndk"; exit 1
          fi

          ( cd rust/taad_enclave_core && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o ../../android/app/src/main/jniLibs \
              build --release --lib )

          echo "=== Rust Android outputs (jniLibs) ==="
          ls -lh android/app/src/main/jniLibs/*/ 2>/dev/null
          # Canh CẢ BA kiến trúc `cargo ndk` vừa dựng, không chỉ arm64-v8a. Cổng cũ chỉ
          # canh arm64 nên một bản thiếu `.so` cho máy 32-bit vẫn dựng XANH và đóng gói
          # bình thường — đúng dạng lỗi đã làm hỏng bản 87 (#156), chỉ khác kiến trúc.
          # Máy nào thiếu `.so` thì `System.loadLibrary` ném lỗi lúc mở app, không phải
          # lúc dựng: hỏng ở tay người dùng, không hỏng ở CI.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "android/app/src/main/jniLibs/$ABI/libtaad_enclave_core.so" ]; then
              echo "❌ libtaad_enclave_core.so ($ABI) NOT built"; exit 1
            fi
          done

      - name: Build Rust chat_mls (Android)
        script: |
          set -e
          # ProofChat E2EE Rust core → libchat_mls.so per-ABI vào jniLibs. TRƯỚC gradle
          # (ChatMlsModule.kt System.loadLibrary("chat_mls")). Rust/cargo-ndk đã cài ở step taad.
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          ( cd rust/chat_mls && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o ../../android/app/src/main/jniLibs \
              build --release --lib )
          # Cả ba kiến trúc — cùng lý do với cổng `libtaad_enclave_core.so` ở bước trên.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "android/app/src/main/jniLibs/$ABI/libchat_mls.so" ]; then
              echo "❌ libchat_mls.so ($ABI) NOT built"; exit 1
            fi
          done

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          # Flavor TƯỜNG MINH. `assembleDebug` dựng CẢ HAI app rồi đổ gói vào hai
          # thư mục khác nhau, trong khi bước dò tệp bên dưới chỉ lấy một.
          ./gradlew "assemble${ANDROID_FLAVOR_CAP}Debug" --no-daemon 2>&1 | tee "$CM_BUILD_DIR/android-debug.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Debug APK failed — last 60 lines:"
            tail -60 "$CM_BUILD_DIR/android-debug.log"
            exit $BUILD_EXIT
          fi

      - name: Locate + rename APK
        script: |
          # ĐƯỜNG DẪN CÓ FLAVOR. Dò ở thư mục cha kèm `head -1` là để `find` nhặt
          # gói của app nào đứng trước theo thứ tự chữ cái — bản dựng vẫn xanh,
          # tệp giao ra là của app kia. Không có triệu chứng nào.
          APK_FILE=$(find "android/app/build/outputs/apk/${ANDROID_FLAVOR}/debug" -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK not found"
            find android/app/build/outputs -type f
            exit 1
          fi
          echo "✅ APK: $APK_FILE"
          ls -lh "$APK_FILE"
          mkdir -p $CM_BUILD_DIR/dist
          cp "$APK_FILE" $CM_BUILD_DIR/dist/aladin-debug.apk
          shasum -a 256 $CM_BUILD_DIR/dist/aladin-debug.apk

    artifacts:
      - dist/aladin-debug.apk
      - android-debug.log


  # ============================================================
  # Workflow 4: Android Signed AAB — Play Store Internal Testing
  # ============================================================
  # ── HAI LUỒNG KÝ, MỘT BỘ BƯỚC ───────────────────────────────────────────────
  # `android-aab-aladin` giữ toàn bộ các bước; `android-aab-checkfarm` ở cuối tệp
  # dùng lại chúng qua neo YAML (`*android_aab_scripts`) — cùng cách mà
  # `ios-production` dùng lại `ios-appstore`, nên cách này đã chạy thật trên
  # Codemagic ở chính tệp này chứ không phải suy đoán.
  #
  # VÌ SAO TÁCH, và tách được cái gì — nói thẳng để không ai tưởng nó là thứ khác:
  #   ĐƯỢC:     lượt dựng Aladin không nạp khoá CheckFarm vào máy chạy, và ngược lại.
  #             Ngày CheckFarm về pháp nhân của nó, xoá một nhóm biến là xong, không
  #             phải xoay khoá của app kia.
  #   ĐƯỢC:     chọn app = chọn luồng. Trước đây phải đặt tay đúng ba biến khớp nhau
  #             (`ANDROID_FLAVOR` + `_CAP` + `APP_INSTANCE`); gõ lệch một cái thì
  #             Gradle dựng app này còn máy đi tìm thư mục app kia.
  #   KHÔNG được: đây KHÔNG phải hàng rào phân quyền. Codemagic không giới hạn được
  #             ai chạy luồng nào, nên người dựng được app này vẫn chạy được luồng
  #             của app kia. Ai cần hàng rào thật thì phải tách ở tầng ứng dụng
  #             Codemagic, không phải ở tệp này.
  android-aab-aladin:
    name: Android Signed AAB — Aladin (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      java: 17
      groups:
        - scanner_secrets
        # MỘT nhóm cho MỘT app. Khoá tải lên của hai pháp nhân khác nhau không nằm
        # chung một nhóm — xem khối chú thích ngay trên tên luồng.
        - android_signing_aladin  # ALADIN_UPLOAD_* — xem instances/README.md
      vars:
        AAB_OUTPUT: $CM_BUILD_DIR/android/app/build/outputs/bundle/${ANDROID_FLAVOR}Release
        # ── HAI APP ─────────────────────────────────────────────────────────
        # `ANDROID_FLAVOR` chọn app nào được dựng. Đổi ở đây (hoặc đặt đè khi
        # chạy tay trên Codemagic) là đủ; KHÔNG có đường nào rơi về mặc định —
        # bước "Chốt flavor" bên dưới dừng hẳn nếu biến rỗng hoặc lạ.
        # `..._CAP` là cùng giá trị, viết hoa chữ đầu, vì tên tác vụ Gradle là
        # `assembleAladinDebug` chứ không phải `assemblealadinDebug`.
        ANDROID_FLAVOR: aladin
        ANDROID_FLAVOR_CAP: Aladin
        APP_INSTANCE: aladin

    # VẪN CHỈ CHẠY TAY — và đây là kết luận sau khi ĐO, không phải giữ nguyên vì ngại
    # đụng. Đường GitHub ĐÃ dựng AAB đã ký trên `main` rồi
    # (`.github/workflows/android-aab.yml`, `on: push: branches: [main]`), chạy trên
    # `ubuntu-latest` — rẻ hơn `mac_mini_m2` ở đây, và lịch sử lượt dựng lưu sẵn trong
    # tab Actions của kho. Bật thêm cửa này trên `main` chỉ được hai thứ: một tệp AAB
    # thứ hai không ai dùng, và một bản ĐÃ KÝ bằng khoá tải lên thật được sinh ra sau
    # MỖI lượt đẩy thay vì khi có người chủ ý cần.
    #
    # Chú thích cũ ở đây ("tránh build signed ngoài ý muốn") vẫn còn đúng nguyên.
    triggering:
      events: []

    scripts: &android_aab_scripts
      # ── CHỐT FLAVOR ─────────────────────────────────────────────────────
      # Đứng TRƯỚC mọi bước dựng. `ANDROID_FLAVOR` rỗng thì `assemble${...}Debug`
      # co lại thành `assembleDebug` — tác vụ đó CÓ THẬT và nó dựng CẢ HAI app,
      # nên lượt dựng vẫn chạy rồi hỏng ở chỗ khác. Rỗng phải dừng ở đây.
      #
      # Kiểm luôn hai biến CÓ KHỚP NHAU không: đặt `ANDROID_FLAVOR=checkfarm` mà
      # quên đổi `..._CAP` thì Gradle dựng Aladin còn `find` đi tìm thư mục
      # checkfarm — bước dò tệp đỏ, và người đọc log sẽ đi tìm nhầm chỗ.
      - name: Chốt flavor Android
        script: |
          set -eu
          # DANH SÁCH APP ĐỌC TỪ `instances/`, KHÔNG viết tay ở đây.
          #
          # `android/app/build.gradle` sinh flavor bằng cách quét đúng thư mục này
          # (mỗi thư mục có `instance.json` là một app, và gradle ép `id` trùng tên
          # thư mục). Cổng này từng chép lại danh sách đó bằng tay — hai nơi khai
          # cùng một sự thật thì sớm muộn lệch nhau, và lúc lệch thì doanh nghiệp
          # thứ ba thêm được thư mục, dựng được trên máy, rồi dừng ở CI với câu
          # "giá trị lạ" cho một app CÓ THẬT.
          #
          # Câu báo lỗi in danh sách ĐO ĐƯỢC LÚC CHẠY, không phải danh sách viết
          # sẵn — để nó không bao giờ nói sai về thực tế nữa.
          DS=""
          for d in instances/*/; do
            [ -f "$d/instance.json" ] || continue
            DS="$DS $(basename "$d")"
          done
          DS="${DS# }"
          if [ -z "$DS" ]; then
            echo "❌ Không thấy app nào trong instances/ — mỗi app cần một thư mục có instance.json"
            exit 1
          fi

          if [ -z "${ANDROID_FLAVOR:-}" ]; then
            echo "❌ ANDROID_FLAVOR rỗng. Giá trị hợp lệ: $DS"
            exit 1
          fi
          HOP_LE=0
          for m in $DS; do [ "$m" = "$ANDROID_FLAVOR" ] && HOP_LE=1; done
          if [ "$HOP_LE" -ne 1 ]; then
            echo "❌ ANDROID_FLAVOR='$ANDROID_FLAVOR' lạ. Hợp lệ: $DS"
            exit 1
          fi

          # Gradle đặt tên tác vụ `assemble<Flavor>Debug` bằng cách VIẾT HOA ĐÚNG
          # CHỮ ĐẦU, giữ nguyên phần còn lại (`checkfarm` → `Checkfarm`, KHÔNG phải
          # `CheckFarm`). Suy theo đúng luật đó thay vì liệt kê từng app.
          EXPECT="$(printf '%s' "$ANDROID_FLAVOR" | cut -c1 | tr '[:lower:]' '[:upper:]')$(printf '%s' "$ANDROID_FLAVOR" | cut -c2-)"
          if [ "${ANDROID_FLAVOR_CAP:-}" != "$EXPECT" ]; then
            echo "❌ ANDROID_FLAVOR_CAP='${ANDROID_FLAVOR_CAP:-}' không khớp ANDROID_FLAVOR='$ANDROID_FLAVOR' (chờ '$EXPECT')"
            exit 1
          fi
          if [ "${APP_INSTANCE:-}" != "$ANDROID_FLAVOR" ]; then
            echo "❌ APP_INSTANCE='${APP_INSTANCE:-}' khác ANDROID_FLAVOR='$ANDROID_FLAVOR'."
            echo "   Lệch hai biến này là dựng vỏ app này với chữ của app kia."
            exit 1
          fi
          echo "✅ flavor=$ANDROID_FLAVOR cap=$ANDROID_FLAVOR_CAP instance=$APP_INSTANCE"

      # CỔNG SOÁT — đứng TRƯỚC mọi bước dựng. Đường GitHub đã có cổng tương đương
      # (`android-aab.yml`); đường Codemagic thì chưa, nên một bản PHÁT HÀNH thiếu
      # `API_KEY` vẫn dựng XANH và nướng `mock-local-api-key` vào header `X-API-Key`
      # (`aladin-api.ts:75`) mà không có gì báo. Xanh mà sai hỏng tệ hơn đỏ.
      #
      # ĐÍNH CHÍNH 2026-08-17 — bản đầu của cổng này (PR #168) nói thiếu khoá thì
      # "mọi người dùng đồng bộ hỏng 401 im lặng". CHƯA đo được, và đo lại thì
      # ngược: mã máy chủ OriLife không có chỗ nào đọc `X-API-Key`, hai cửa ĐỌC
      # công khai trả lời bình thường khi không gửi khoá. Ngoài ra `aladin-api.ts`
      # là client ĐÃ deprecated (chú thích đầu tệp), chỉ còn đường sync cũ gọi.
      # Nên cổng KHÔNG chặn cứng nữa: có `ALLOW_NO_API_KEY=1` để đi tiếp có chủ ý.
      # Vẫn giữ cổng vì cửa GHI chưa đo được — chưa đo thì chưa được tuyên là an toàn.
      #
      # Chỉ đặt ở HAI workflow PHÁT HÀNH; bản debug/adhoc vẫn chạy được khoá giả.
      - name: Soát khoá API trước khi phát hành
        script: |
          if [ -n "$API_KEY" ]; then
            # Chỉ nói CÓ MẶT, không nói dài bao nhiêu: trình che log của Codemagic che
            # GIÁ TRỊ, không che con số suy ra từ giá trị. Độ dài là một mẩu tin thật về
            # một bí mật, in ra vĩnh viễn trong log mà không đổi lại được gì.
            echo "✅ API_KEY có mặt."
          elif [ "$ALLOW_NO_API_KEY" = "1" ]; then
            echo "⚠️  Không có API_KEY — dựng tiếp vì ALLOW_NO_API_KEY=1."
            echo "    Bản này nướng 'mock-local-api-key' vào header X-API-Key (aladin-api.ts:75)."
            echo "    Chỉ chạm client aladin-api (ĐÃ deprecated, xem chú thích đầu tệp đó);"
            echo "    farmService / treeReIDService / provenanceService KHÔNG gửi header này."
          else
            echo "❌ Không có API_KEY."
            echo "   Nạp ở: Codemagic → Environment variables → nhóm 'scanner_secrets' → biến API_KEY."
            echo "   HOẶC, nếu chốt là bản này không cần: đặt ALLOW_NO_API_KEY=1 rồi dựng lại."
            echo "   Đo 2026-08-17 trước khi quyết: mã máy chủ OriLife KHÔNG có chỗ nào đọc header"
            echo "   X-API-Key, và hai cửa ĐỌC công khai trả lời bình thường khi không gửi khoá"
            echo "   (GET /api/health → 200; GET /api/tree_by_code/<mã> → 404 đúng hợp đồng, không 401)."
            echo "   Cửa GHI thì CHƯA đo được — đó là lý do cổng này còn đứng thay vì bỏ hẳn."
            exit 1
          fi

      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ALADIN_API_URL=${BASE_API_URL:-https://api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://api.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://api.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://api.orilife.io}
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://api.lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://api.lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://api.orilife.io/captures/3d}
          # AladinWork (Việc làm). THIẾU biến này = cổng runtime tắt vĩnh viễn, module
          # rơi về rỗng DÙ máy chủ sống (đo 05/08: api.aladin.work/api/v1/health = 200).
          WORK_API_URL=${WORK_API_URL:-https://api.aladin.work/api/v1}

          # ProofChat. Cờ mặc định `off` = MỌI bản phát hành chạy dữ liệu giả, dù máy
          # chủ sống. Bật là quyết định của người phát hành, không phải hệ quả phụ của
          # việc máy chủ hồi sinh.
          #
          # ĐÍNH CHÍNH 2026-08-18: lý do cũ ghi ở đây ("token production còn nằm trần
          # trong AsyncStorage") ĐÃ HẾT HIỆU LỰC — commit 48efb57 chuyển token phiên
          # sang Keychain/Keystore qua `taad.secureStore` (`proofchat-api.ts`).
          # Còn lại một chặn THẬT, đo 2026-08-18 và nằm ở phía ProofChat chứ không
          # phải ở app: `GET https://api.proofchat.me/api/v1/users/search` → 404
          # ("Cannot GET"), tức cửa TÌM NGƯỜI để mở hội thoại vẫn đóng
          # (`proofchat-api.ts:465` đã ghi: khối `@Get('search')` bị bình luận ở BE).
          # Bật cờ lúc này chỉ đổi "chat giả" thành "chat thật nhưng không tìm được ai".
          PROOFCHAT_API_URL=${PROOFCHAT_API_URL:-https://api.proofchat.me/api/v1}
          PROOFCHAT_WS_URL=${PROOFCHAT_WS_URL:-https://api.proofchat.me}
          PROOFCHAT_WS_PATH=${PROOFCHAT_WS_PATH:-/socket.io}
          PROOFCHAT_BACKEND_ENABLED=${PROOFCHAT_BACKEND_ENABLED:-off}

          # ⚠ analytics.orilife.io KHÔNG phân giải được (DNS NXDOMAIN, đo 05/08) — để
          # trống thay vì nướng một host không tồn tại vào mọi bản build. Để trống CHỈ
          # an toàn sau khi đã gỡ đường lui viết cứng trong analyticsApi.ts (trước đây
          # chuỗi rỗng làm nó lui về một tunnel ngrok tạm + khoá dev). Nay rỗng = TẮT.
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-}

          # Bốn biến dưới đây `src/` CÓ import nhưng codemagic.yaml TỪNG KHÔNG ghi
          # (đo 15/08: 0 dòng trong cả 4 khối). Thiếu ở đây không đỏ, không cảnh báo —
          # react-native-dotenv mặc định `allowUndefined: true` nên biến thành
          # `undefined` lặng lẽ. Đường GitHub có cổng đối chiếu
          # (.github/actions/rn-env/action.yml) bắt được; đường Codemagic thì không,
          # nên phải ghi tay và giữ đồng bộ. Giá trị đặt đúng bằng bản GitHub ghi.
          ORG_MINT_ENABLED=${ORG_MINT_ENABLED:-false}
          # 0 = preprod (chuỗi thử) · 1 = mainnet (tiền thật). Lên mainnet thì đặt
          # CARDANO_NETWORK=1 ở nhóm biến Codemagic, không sửa dòng này.
          CARDANO_NETWORK=${CARDANO_NETWORK:-0}
          # `aladin` | `checkfarm` — app nào được dựng ra từ nền mã này. Đặt ở
          # nhóm biến của TỪNG workflow, không sửa dòng này. Giá trị lạ ⇒ app ném
          # ngay lúc nạp module (config/instance.config.ts), cố ý không rơi sạch.
          APP_INSTANCE=${APP_INSTANCE:-aladin}
          # Trống = để cổng runtime /health quyết (config.ts:38 chỉ chặn khi đúng 'off').
          WORK_BACKEND_ENABLED=${WORK_BACKEND_ENABLED:-}
          # Trống = TẮT hẳn. ĐỪNG điền tunnel ngrok — xem remoteLogger.ts, aladinChat.ts.
          REMOTE_LOG_URL=${REMOTE_LOG_URL:-}
          ALADIN_CHAT_URL=${ALADIN_CHAT_URL:-}
          # Truy vết bản dựng — xem lời dẫn dài ở khối `ios-adhoc-ipa` phía trên.
          BUILD_COMMIT=${CM_COMMIT:0:12}
          BUILD_BRANCH=${CM_BRANCH:-}
          BUILD_ID=${CM_BUILD_ID:-}
          EOF
          # Dọn whitespace lạc (tab/space) trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env (release)"

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

      - name: Restore keystore from encrypted env
        script: |
          # TÊN BIẾN SUY TỪ `ANDROID_FLAVOR`, không gõ cứng tên app.
          #
          # Trước bản này bước dựng đã theo flavor (`bundle${ANDROID_FLAVOR_CAP}Release`)
          # mà bước KÝ thì gõ cứng `ALADIN_UPLOAD_*`. Hệ quả: đặt
          # `ANDROID_FLAVOR=checkfarm` thì gradle dựng CheckFarm còn máy nạp khoá
          # Aladin — và cổng ở `android/app/build.gradle` (taskGraph.whenReady) chặn
          # lại. Tức luồng này KHÔNG dựng nổi app thứ hai, mà lỗi báo ra lại nói về
          # khoá chứ không nói về chỗ hỏng thật.
          #
          # `${!TEN}` là tham chiếu gián tiếp của bash — lấy GIÁ TRỊ của biến có tên
          # nằm trong `$TEN`. Codemagic chạy script bằng bash (tệp này đã dùng
          # `${PIPESTATUS[0]}` ở nhiều chỗ), nên cú pháp này dùng được.
          TIEN_TO=$(echo "$ANDROID_FLAVOR" | tr '[:lower:]' '[:upper:]')
          TEN_B64="${TIEN_TO}_UPLOAD_STORE_FILE_B64"
          if [ -z "${!TEN_B64}" ]; then
            echo "❌ ${TEN_B64} chưa set trong nhóm android_signing_${ANDROID_FLAVOR}"
            echo "   Mỗi app một khoá RIÊNG — app '${ANDROID_FLAVOR}' cần đủ bốn biến:"
            echo "     ${TIEN_TO}_UPLOAD_STORE_FILE_B64   (kho khoá .jks đã base64)"
            echo "     ${TIEN_TO}_UPLOAD_KEY_ALIAS"
            echo "     ${TIEN_TO}_UPLOAD_STORE_PASSWORD"
            echo "     ${TIEN_TO}_UPLOAD_KEY_PASSWORD"
            echo "   Sinh khoá: bash scripts/tao-khoa-ky.sh ${ANDROID_FLAVOR}"
            echo "   Nạp:       base64 -i keySigning.bin | pbcopy → paste vào Codemagic"
            exit 1
          fi
          echo "${!TEN_B64}" | base64 -d > android/app/keySigning.bin
          ls -lh android/app/keySigning.bin
          echo "✅ Keystore restored (${TIEN_TO}_UPLOAD_*)"

      - name: Create Android config (secrets + gradle.properties + signing)
        script: |
          set -e
          # Mỗi khối `script:` là một shell RIÊNG — biến của bước trước không sống
          # sang đây. Suy lại tiền tố, đừng giả định nó còn.
          TIEN_TO=$(echo "$ANDROID_FLAVOR" | tr '[:lower:]' '[:upper:]')
          TEN_ALIAS="${TIEN_TO}_UPLOAD_KEY_ALIAS"
          TEN_STORE_PW="${TIEN_TO}_UPLOAD_STORE_PASSWORD"
          TEN_KEY_PW="${TIEN_TO}_UPLOAD_KEY_PASSWORD"
          # secrets.properties (gitignored) — API cho orilifesdk. Từ group scanner_secrets.
          cat > android/app/secrets.properties <<EOF
          TREE_DETECTION_API=${TREE_DETECTION_API:-https://api.orilife.io}
          BASE_API_URL=${BASE_API_URL:-https://api.orilife.io}
          API_KEY=${API_KEY:-mock-local-api-key}
          REGION_CODE=${REGION_CODE:-vn-south-01}
          EOF
          # gradle.properties (gitignored) — RN config + upload signing. Khoá lấy từ
          # nhóm biến của ĐÚNG app đang dựng (`android_signing_<app>`).
          # `${TIEN_TO}_UPLOAD_STORE_FILE=keySigning.bin` (đã giải mã ở step trước).
          cat > android/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          # ĐO 2026-08-20: dòng NÀY mới cắt lát ABI, không phải `abiFilters`.
          # Dựng thật với `x86` ở đây + abiFilters KHÔNG có x86 ⇒ .aab vẫn ra lát
          # base/lib/x86 25 tệp (ba lát kia 28), thiếu đúng libtaad_enclave_core.so,
          # libchat_mls.so, libcardano_serialization_lib. Plugin com.facebook.react
          # đọc dòng này và ghi đè abiFilters viết tay. Đó là dạng hỏng của bản 87.
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          # Tắt tích hợp worklets của expo-modules-core. KHÔNG có dòng này thì
          # WorkletRuntimeInstaller.cpp biên dịch với WORKLETS_ENABLED=1 và đòi
          # <worklets/Compat/StableApi.h> — header chỉ có từ react-native-worklets
          # 0.8.0, mà dự án ghim 0.7.4 ⇒ build native gãy. Bản vá
          # patches/expo-modules-core+56.0.22.patch mở đúng công tắc này, nhưng
          # android/gradle.properties bị gitignore và bị heredoc dưới đây ghi đè,
          # nên bản vá vô tác dụng suốt từ 26/07 — 10/10 lần chạy CI đỏ vì nó.
          expo.enableWorkletsIntegration=false
          ${TIEN_TO}_UPLOAD_STORE_FILE=keySigning.bin
          ${TIEN_TO}_UPLOAD_KEY_ALIAS=${!TEN_ALIAS}
          ${TIEN_TO}_UPLOAD_STORE_PASSWORD=${!TEN_STORE_PW}
          ${TIEN_TO}_UPLOAD_KEY_PASSWORD=${!TEN_KEY_PW}
          EOF
          perl -i -pe 's/^(\w+([.\w]*))=[ \t]+/$1=/; s/[ \t]+$//' android/app/secrets.properties android/gradle.properties
          echo "✅ secrets.properties + gradle.properties (signing) created"

      - name: Verify gradle.properties signing config
        script: |
          TIEN_TO=$(echo "$ANDROID_FLAVOR" | tr '[:lower:]' '[:upper:]')
          # Đối chiếu theo ĐÚNG app đang dựng. Tìm chuỗi cố định "ALADIN_UPLOAD_"
          # thì bản CheckFarm ký đúng khoá của nó vẫn trượt phép kiểm này, còn bản
          # CheckFarm ký NHẦM khoá Aladin thì lại qua — tức cổng chạy ngược.
          grep -E "${TIEN_TO}_UPLOAD_STORE_FILE|${TIEN_TO}_UPLOAD_KEY_ALIAS" android/gradle.properties \
            || { echo "❌ gradle.properties thiếu signing config cho app '${ANDROID_FLAVOR}'"; exit 1; }
          echo "✅ gradle.properties signing OK (${TIEN_TO}_UPLOAD_*)"

      - name: Build Rust core (Android)
        script: |
          set -e
          # PhoenixKey Enclave Rust core → libtaad_enclave_core.so per-ABI vào
          # android/app/src/main/jniLibs. PHẢI chạy TRƯỚC gradle (TaadEnclaveModule.kt
          # System.loadLibrary). Thiếu step này → AAB không có .so → tính năng Enclave chết.
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk &> /dev/null || cargo install cargo-ndk
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          if [ -z "$ANDROID_NDK_HOME" ]; then echo "❌ NDK không tìm thấy"; exit 1; fi
          ( cd rust/taad_enclave_core && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o ../../android/app/src/main/jniLibs \
              build --release --lib )
          # Canh CẢ BA kiến trúc `cargo ndk` vừa dựng, không chỉ arm64-v8a. Cổng cũ chỉ
          # canh arm64 nên một bản thiếu `.so` cho máy 32-bit vẫn dựng XANH và đóng gói
          # bình thường — đúng dạng lỗi đã làm hỏng bản 87 (#156), chỉ khác kiến trúc.
          # Máy nào thiếu `.so` thì `System.loadLibrary` ném lỗi lúc mở app, không phải
          # lúc dựng: hỏng ở tay người dùng, không hỏng ở CI.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "android/app/src/main/jniLibs/$ABI/libtaad_enclave_core.so" ]; then
              echo "❌ libtaad_enclave_core.so ($ABI) NOT built"; exit 1
            fi
          done

      - name: Build Rust chat_mls (Android)
        script: |
          set -e
          # ProofChat E2EE Rust core → libchat_mls.so per-ABI vào jniLibs. TRƯỚC gradle
          # (ChatMlsModule.kt System.loadLibrary("chat_mls")). Rust/cargo-ndk đã cài ở step taad.
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          ( cd rust/chat_mls && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o ../../android/app/src/main/jniLibs \
              build --release --lib )
          # Cả ba kiến trúc — cùng lý do với cổng `libtaad_enclave_core.so` ở bước trên.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "android/app/src/main/jniLibs/$ABI/libchat_mls.so" ]; then
              echo "❌ libchat_mls.so ($ABI) NOT built"; exit 1
            fi
          done

      - name: Bump versionCode (base + Codemagic BUILD_NUMBER)
        script: |
          set -e
          # versionCode = versionCode committed (base) + BUILD_NUMBER của Codemagic.
          # BUILD_NUMBER tự tăng mỗi build (monotonic) → KHÔNG phụ thuộc Google Play
          # credentials, không bao giờ trùng. Luôn > base (70) trên Play.
          BASE=$(grep -m1 -E "versionCode [0-9]+" android/app/build.gradle | grep -oE "[0-9]+")
          NEW=$(( BASE + ${BUILD_NUMBER:-1} ))
          # `sed -i '' -E` chứ KHÔNG phải `sed -i -E`. Workflow này chạy trên
          # `mac_mini_m2`, tức BSD sed: ở đó `-i` ĂN đối số ngay sau nó làm đuôi tệp sao
          # lưu, nên `-E` bị nuốt mất, phần thay thế rơi về biểu thức chính quy cơ bản và
          # `[0-9]+` thành dấu cộng theo nghĩa đen ⇒ KHÔNG thay gì cả, thoát 0, vẫn in
          # dòng "✅ Android versionCode → N".
          # Đo trên chính máy Mac này 2026-08-18: `sed -i -E` để nguyên `versionCode 70`
          # và đẻ ra một tệp rác `build.gradle-E`; `sed -i '' -E` sửa đúng thành 99.
          # Hệ quả nếu không vá: mọi AAB dựng từ Codemagic mang versionCode committed
          # (70), Play từ chối vì trùng — mà nhật ký bản dựng thì báo xanh.
          # Chỗ iOS trong chính tệp này đã viết đúng kiểu macOS từ đầu; chỉ chỗ này lệch.
          sed -i '' -E "s/versionCode [0-9]+/versionCode ${NEW}/" android/app/build.gradle
          echo "   đối chiếu lại từ chính tệp: $(grep -m1 -E 'versionCode [0-9]+' android/app/build.gradle)"
          echo "✅ Android versionCode → ${NEW} (base=${BASE}, BUILD_NUMBER=${BUILD_NUMBER:-1})"

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew "bundle${ANDROID_FLAVOR_CAP}Release" --no-daemon 2>&1 | tee "$CM_BUILD_DIR/android-release.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ AAB failed — last 60 lines:"
            tail -60 "$CM_BUILD_DIR/android-release.log"
            exit $BUILD_EXIT
          fi

      - name: Locate + verify AAB
        script: |
          # `bundle/release` KHÔNG còn tồn tại sau khi có flavor.
          AAB_FILE=$(find "android/app/build/outputs/bundle/${ANDROID_FLAVOR}Release" -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "❌ AAB not found"
            find android/app/build/outputs -type f
            exit 1
          fi
          echo "✅ AAB: $AAB_FILE"
          ls -lh "$AAB_FILE"
          mkdir -p $CM_BUILD_DIR/dist
          # Tên tệp ra phải mang tên app ĐANG dựng. Trước bản này nó gõ cứng
          # `aladin-release.aab`: dựng CheckFarm vẫn ra một tệp mang tên Aladin, và
          # lượt dựng báo xanh. Không cổng nào bắt được — cái sai chỉ lộ ra ở người
          # cầm tệp đi nộp, tức lộ ra muộn nhất có thể và ở chỗ đắt nhất.
          cp "$AAB_FILE" "$CM_BUILD_DIR/dist/${ANDROID_FLAVOR}-release.aab"
          shasum -a 256 "$CM_BUILD_DIR/dist/${ANDROID_FLAVOR}-release.aab"

    artifacts: &android_aab_artifacts
      - dist/*-release.aab
      - android-release.log

    # ── Vì sao Android CHƯA tự lên Google Play ───────────────────────────────────
    # Đường iOS tự lên được vì khoá App Store Connect đã nằm trong Codemagic
    # (`APP_STORE_CONNECT_PRIVATE_KEY`, dùng ở bước "Bump build number"). Đường
    # Android thì THIẾU đúng một thứ: service account của Google Play. Biến
    # `$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS` chưa có giá trị, mà JSON rỗng làm bước
    # chuẩn bị publish đỏ NGAY — nên bật khối dưới lúc này chỉ đổi "không tự lên
    # store" thành "mọi lần dựng đều đỏ".
    #
    # AAB đã ký vẫn nằm trong `artifacts` để tải về nộp tay, nên không có gì kẹt.
    #
    # BỎ CHẶN cần đúng ba việc, đều ở phía tài khoản (agent không đặt secret hộ):
    #   1. Google Play Console → Users and permissions → mời service account, cho
    #      quyền "Release to testing tracks" + "Release to production".
    #   2. Google Cloud → tải tệp JSON khoá của service account đó.
    #   3. Codemagic → Environment variables → nhóm `android_signing_<app>` → thêm biến
    #      `GCLOUD_SERVICE_ACCOUNT_CREDENTIALS`, dán nguyên nội dung JSON, đánh dấu
    #      Secure.
    # Xong ba việc đó thì bỏ dấu `#` ở khối dưới là Android chạy y như iOS.
    #
    # `track: production` vì workflow này chỉ chạy trên `main`. Khi thêm `develop`
    # vào `triggering` thì phải TÁCH thành hai workflow (develop → `internal`,
    # main → `production`) đúng như cặp `ios-appstore` / `ios-production` ở trên —
    # một workflow không thể trỏ hai track khác nhau theo nhánh.
    # `submit_as_draft: true` = bản lên Play ở dạng nháp, người thật bấm phát hành.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: production
    #     submit_as_draft: true

  # ══ CHECKFARM ═══════════════════════════════════════════════════════════════
  # Cùng bộ bước với luồng Aladin ở trên, khác đúng hai thứ: nhóm biến giữ khoá,
  # và ba biến chọn app. Bước dựng đọc tiền tố từ `ANDROID_FLAVOR` viết hoa
  # (`CHECKFARM_UPLOAD_*`), nên không có tên khoá nào gõ cứng ở đây.
  #
  # CheckFarm là pháp nhân RIÊNG. Khoá tải lên của nó nằm ở nhóm riêng để ngày
  # bàn giao chỉ phải xoá một nhóm — bàn giao thì XOAY khoá, không chuyển tài
  # khoản CI.
  android-aab-checkfarm:
    name: Android Signed AAB — CheckFarm (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      java: 17
      groups:
        - scanner_secrets
        - android_signing_checkfarm  # CHECKFARM_UPLOAD_* — xem instances/README.md
      vars:
        AAB_OUTPUT: $CM_BUILD_DIR/android/app/build/outputs/bundle/${ANDROID_FLAVOR}Release
        # `..._CAP` là tên tác vụ Gradle: `bundleCheckfarmRelease`. Gradle chỉ viết
        # hoa CHỮ ĐẦU của tên flavor, nên ở đây là `Checkfarm` — KHÔNG phải
        # `CheckFarm`. Gõ hai chữ hoa thì tác vụ không tồn tại và lượt dựng đỏ ở
        # Gradle, sau khi đã nạp khoá thật vào máy.
        ANDROID_FLAVOR: checkfarm
        ANDROID_FLAVOR_CAP: Checkfarm
        APP_INSTANCE: checkfarm

    triggering:
      events: []

    scripts: *android_aab_scripts
    artifacts: *android_aab_artifacts
