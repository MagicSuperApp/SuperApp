# ============================================================
# Codemagic CI/CD — OriLife iOS & Android Build
# ============================================================
#
# Stack:
#   - React Native 0.84.1 (Metro bundle)
#   - Swift 5.9 (ScannerModule: AVFoundation, YOLO TFLite, SQLite)
#   - CocoaPods (TensorFlowLiteSwift ~2.17.0, SQLite.swift ~0.15.0)
#   - Local pod: ios/LocalPods/ScannerModule
#   - secrets.plist keys READ by native (ScannerConfig.swift):
#       TREE_DETECTION_API  — base URL cho scanner module API calls
#       API_KEY             — X-API-Key header
#       REGION_CODE         — vùng xử lý
#
# Codemagic env groups cần có:
#   scanner_secrets:
#     TREE_DETECTION_API, BASE_API_URL, API_KEY, REGION_CODE
#     PHOENIXKEY_API_URL, ORILIFE_API_BASE_URL, PHOENIX_WALLET_ENABLED
#   android_signing (chỉ android-appstore-aab):
#     ORILIFE_UPLOAD_STORE_FILE_B64, ORILIFE_UPLOAD_STORE_PASSWORD,
#     ORILIFE_UPLOAD_KEY_ALIAS, ORILIFE_UPLOAD_KEY_PASSWORD
#
# iOS Code Signing (ios-appstore):
#   Certificate : aladin-ios-cert  (production, upload Codemagic UI)
#   Profile     : aladin_appstore_profile  (app_store, upload Codemagic UI)
#   Bundle ID   : vn.aladinapp
#   Team        : ALADIN CONTRACT COMPANY LIMITED (3666KPJX5R)
# ============================================================

workflows:

  # ============================================================
  # Workflow 1: iOS unsigned IPA — AltStore / Sideloadly
  # ============================================================
  ios-adhoc-ipa:
    name: iOS IPA Build (Unsigned — AltStore/Sideloadly)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      groups:
        - scanner_secrets
      vars:
        BUNDLE_ID: vn.aladinapp
        XCODE_WORKSPACE: ios/aladin_mobile_fe.xcworkspace
        XCODE_SCHEME: aladin_mobile_fe
        ARCHIVE_PATH: $CM_BUILD_DIR/build/ios/OriLife.xcarchive
        IPA_OUTPUT_DIR: $CM_BUILD_DIR/build/ios/ipa

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: 'feat/foundation'
          include: true
        - pattern: 'feat/*'
          include: true
      cancel_previous_builds: true

    scripts:

      # secrets.plist — chỉ 3 key mà ScannerConfig.swift thực sự đọc.
      # Không thêm key thừa: LAMPNET_*, CAPTURES_3D_URL dùng .env phía RN.
      - name: Create secrets.plist
        script: |
          SECRETS_DIR="ios/LocalPods/ScannerModule/Resources"
          mkdir -p "$SECRETS_DIR"
          cat > "$SECRETS_DIR/secrets.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!-- ScannerConfig.swift: ScannerConfig.treeDetectionAPI / baseApiUrl -->
              <key>TREE_DETECTION_API</key>
              <string>${TREE_DETECTION_API:-https://staging-api.orilife.io}</string>

              <!-- ScannerConfig.swift: ScannerConfig.apiKey (X-API-Key header) -->
              <key>API_KEY</key>
              <string>${API_KEY:-mock-local-api-key}</string>

              <!-- ScannerConfig.swift: ScannerConfig.regionCode -->
              <key>REGION_CODE</key>
              <string>${REGION_CODE:-vn-south-01}</string>
          </dict>
          </plist>
          EOF
          echo "✅ secrets.plist created (3 keys: TREE_DETECTION_API, API_KEY, REGION_CODE)"
          echo "   TREE_DETECTION_API=${TREE_DETECTION_API:-[USING STAGING FALLBACK]}"

      # .env — tất cả vars mà React Native (react-native-dotenv) cần.
      # Khớp với .env.example. ANALYTICS_API_URL dùng production endpoint (không có localhost).
      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ENV=production

          # OriLife / Aladin backend
          ALADIN_API_URL=${BASE_API_URL:-https://staging-api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}

          # PhoenixKey + Ví Phượng hoàng
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          # false = backend Phase-2 chưa deploy, nút ký disable. Set true SAU khi backend sẵn sàng.
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}

          # TreeReID / identify cây (RN layer)
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://test.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://test.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://test.orilife.io}

          # LampNet 3D
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://staging-api.orilife.io/captures/3d}

          ANALYTICS_API_URL=${ANALYTICS_API_URL:-https://analytics.orilife.io}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-prod-analytics-key}
          EOF
          # Dọn whitespace lạc (tab/space) mà biến môi trường Codemagic có thể dính
          # vào value khi paste — nếu không, URL như "\thttps://..." sẽ làm fetch ném
          # "Network request failed" trên device. Cắt khoảng trắng sau '=' và cuối dòng.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env created"
          echo "--- ALADIN_API_URL  : $(grep ALADIN_API_URL .env | head -1)"
          echo "--- ORILIFE_API_BASE: $(grep ORILIFE_API_BASE_URL .env | head -1)"
          echo "--- PHOENIX_WALLET  : $(grep PHOENIX_WALLET_ENABLED .env)"

      - name: Verify .env file
        script: |
          echo "=== Verifying .env ==="
          if [ ! -f .env ]; then
            echo "❌ .env NOT FOUND"; exit 1
          fi
          # Chặn giá trị nguy hiểm (bỏ qua comment lines)
          if grep -v "^#" .env | grep -q "localhost"; then
            echo "❌ .env chứa localhost — không dùng được trên device!"
            grep -v "^#" .env | grep "localhost"
            exit 1
          fi
          # Chặn whitespace lạc trong value (vd "KEY=\thttps://...") — sẽ làm
          # fetch ném "Network request failed" trên device. Đáng lẽ đã được perl dọn.
          if grep -nE '^[A-Za-z_][A-Za-z0-9_]*=[[:space:]]' .env; then
            echo "❌ .env còn whitespace ngay sau '=' — kiểm tra biến môi trường Codemagic"
            exit 1
          fi
          # Kiểm tra URL hợp lệ: orilife.io hoặc lampnet.cloud
          if grep -qE "(orilife\.io|lampnet\.cloud|phoenixkey\.me)" .env; then
            echo "✅ .env chứa URL hợp lệ (orilife.io / lampnet.cloud / phoenixkey.me)"
          else
            echo "⚠️  Không tìm thấy URL orilife.io — kiểm tra biến môi trường Codemagic"
          fi
          echo "--- Content (API keys ẩn):"
          grep -v "API_KEY\|PASSWORD\|TOKEN\|SECRET" .env

      - name: Install npm dependencies
        script: |
          set -e
          node --version && npm --version
          # --ignore-scripts: bỏ qua postinstall-postinstall (nó gọi `yarn run postinstall`
          # nhưng Codemagic có Yarn Berry → fail vì project không phải Yarn Berry workspace)
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied" --ignore-scripts
          # Chạy patch-package thủ công thay cho postinstall script
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"
          # Verify react-native installed — CocoaPods dùng file này để load Podfile
          if [ ! -f "node_modules/react-native/scripts/react_native_pods.rb" ]; then
            echo "❌ react-native/scripts/react_native_pods.rb NOT FOUND sau npm install"
            ls node_modules/react-native/ 2>/dev/null || echo "react-native chưa install"
            exit 1
          fi
          echo "✅ npm install done — react_native_pods.rb OK"

      - name: Build Rust core (iOS)
        script: |
          set -e
          # PhoenixKey Enclave Rust core (rust/taad_enclave_core) → static lib +
          # cbindgen header cho pod `taad_enclave_core`. PHẢI chạy TRƯỚC pod install
          # vì podspec tham chiếu libtaad_enclave_core.a + taad_enclave_core.h.
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          command -v cbindgen &> /dev/null || cargo install cbindgen --version "^0.27"

          # Device-only (adhoc IPA chạy trên iPhone thật — không cần simulator slice).
          # Gọi qua `bash` vì file commit từ Windows không giữ exec bit (chmod +x cũng được).
          ( cd rust/taad_enclave_core && bash build_ios.sh device )

          echo "=== Rust iOS outputs ==="
          ls -lh rust/taad_enclave_core/ios/
          if [ ! -f rust/taad_enclave_core/ios/libtaad_enclave_core.a ]; then
            echo "❌ libtaad_enclave_core.a NOT built"; exit 1
          fi
          if [ ! -f rust/taad_enclave_core/ios/taad_enclave_core.h ]; then
            echo "❌ taad_enclave_core.h (cbindgen) NOT generated"; exit 1
          fi

      - name: CocoaPods install
        script: |
          set -e
          # Đặt NODE_BINARY để pod install dùng đúng node của Codemagic
          # (không dùng /usr/local/bin/node là system node cũ)
          export NODE_BINARY=$(which node)
          echo "NODE_BINARY=$NODE_BINARY ($(node --version))"
          # Ghi vào .xcode.env.local để cả Xcode lẫn pod đều dùng đúng node
          echo "export NODE_BINARY=$NODE_BINARY" > ios/.xcode.env.local

          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

          echo "=== Workspace check ==="
          FOUND_WS=$(find ios -maxdepth 2 -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          echo "workspace: ${FOUND_WS:-NOT FOUND}"
          if [ -z "$FOUND_WS" ]; then
            echo "❌ No xcworkspace!"; ls -la ios/; exit 1
          fi

      - name: Clean DerivedData & SPM
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/com.apple.dt.Xcode/SwiftPM
          rm -rf ios/aladin_mobile_fe.xcworkspace/xcshareddata/swiftpm/checkouts 2>/dev/null || true
          echo "✅ DerivedData + SPM cleaned"

      - name: Build iOS Archive (unsigned)
        script: |
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          rm -rf "$ARCHIVE_PATH"
          mkdir -p "$IPA_OUTPUT_DIR"
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No xcworkspace"; exit 1
          fi
          echo "WORKSPACE : $WORKSPACE"
          echo "SCHEME    : $XCODE_SCHEME"
          echo "ARCHIVE   : $ARCHIVE_PATH"
          LOG_FILE="$CM_BUILD_DIR/xcodebuild.log"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_SIGNATURE_AGGREGATION=NO \
            SWIFT_VERSION=5.9 \
            CLANG_SCAN_DEPS_ENABLE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CODE_SIGN_FLAGS="--ignore-non-resolved-imports" \
            'OTHER_LDFLAGS=$(inherited) -ObjC -lc++' \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ xcodebuild FAILED (exit $BUILD_EXIT). Last 80 lines:"
            tail -80 "$LOG_FILE"
            exit $BUILD_EXIT
          fi
          echo "✅ Archive:"
          ls -lhd "$ARCHIVE_PATH"


      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ No .app!"; exit 1; fi

          PAYLOAD_DIR="$IPA_OUTPUT_DIR/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -r "$APP_PATH" "$PAYLOAD_DIR/"
          IPA_NAME="OriLife-unsigned.ipa"
          cd "$IPA_OUTPUT_DIR"
          zip -r "$IPA_NAME" Payload/
          rm -rf Payload/

          echo "✅ IPA:"
          ls -lh "$IPA_OUTPUT_DIR/$IPA_NAME"
          echo "✅ IPA packaged"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/OriLife.xcarchive/dSYMs/*.dSYM

  # ============================================================
  # Workflow 2: iOS App Store (Signed)
  # ============================================================
  ios-appstore:
    name: iOS App Store Build (Signed)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      groups:
        - scanner_secrets
      vars:
        BUNDLE_ID: vn.aladinapp
        XCODE_SCHEME: aladin_mobile_fe
        ARCHIVE_PATH: build/ios/OriLife.xcarchive
        IPA_OUTPUT_DIR: build/ios/ipa
        APPLE_TEAM_ID: 3666KPJX5R
      ios_signing:
        distribution_type: app_store
        bundle_identifier: vn.aladinapp

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          echo "=== Certificates ==="
          security find-identity -v -p codesigning 2>/dev/null | head -10 || true
          echo "✅ Keychain + cert OK"

      - name: Create secrets.plist
        script: |
          SECRETS_DIR="ios/LocalPods/ScannerModule/Resources"
          mkdir -p "$SECRETS_DIR"
          cat > "$SECRETS_DIR/secrets.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>TREE_DETECTION_API</key>
              <string>${TREE_DETECTION_API:-https://staging-api.orilife.io}</string>
              <key>API_KEY</key>
              <string>${API_KEY:-mock-local-api-key}</string>
              <key>REGION_CODE</key>
              <string>${REGION_CODE:-vn-south-01}</string>
          </dict>
          </plist>
          EOF
          echo "✅ secrets.plist (prod)"

      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ENV=production
          ALADIN_API_URL=${BASE_API_URL:-https://staging-api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://test.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://test.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://test.orilife.io}
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://staging-api.orilife.io/captures/3d}
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-https://analytics.orilife.io}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-prod-analytics-key}
          EOF
          # Dọn whitespace lạc (tab/space) trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env (prod)"

      - name: Disable NSAllowsArbitraryLoads (production)
        script: |
          /usr/libexec/PlistBuddy \
            -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads false" \
            ios/aladin_mobile_fe/Info.plist || true
          echo "✅ NSAllowsArbitraryLoads = false"

      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

      - name: Build Rust core (iOS)
        script: |
          set -e
          # PhoenixKey Enclave Rust core → static lib + cbindgen header cho pod
          # `taad_enclave_core`. PHẢI chạy TRƯỚC pod install (podspec tham chiếu .a + .h).
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          command -v cbindgen &> /dev/null || cargo install cbindgen --version "^0.27"
          ( cd rust/taad_enclave_core && bash build_ios.sh device )
          ls -lh rust/taad_enclave_core/ios/
          if [ ! -f rust/taad_enclave_core/ios/libtaad_enclave_core.a ]; then
            echo "❌ libtaad_enclave_core.a NOT built"; exit 1
          fi
          if [ ! -f rust/taad_enclave_core/ios/taad_enclave_core.h ]; then
            echo "❌ taad_enclave_core.h (cbindgen) NOT generated"; exit 1
          fi

      - name: CocoaPods install
        script: |
          set -e
          cd ios
          rm -rf ~/Library/Caches/CocoaPods Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Disable code signing for Pods targets
        script: |
          find ios/Pods -name '*.xcconfig' | xargs grep -l 'CODE_SIGN' | while read f; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d; /^CODE_SIGNING_REQUIRED/d; /^CODE_SIGNING_ALLOWED/d' "$f"
          done
          PODS_CONFIG_DIR="ios/Pods/Target Support Files"
          find "$PODS_CONFIG_DIR" -name '*.xcconfig' | while read f; do
            printf '\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\n' >> "$f"
          done
          echo "✅ Pods code signing disabled"

      - name: Clean DerivedData & SPM
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/com.apple.dt.Xcode
          rm -rf ios/aladin_mobile_fe.xcworkspace/xcshareddata/swiftpm/checkouts 2>/dev/null || true
          rm -rf ios/aladin_mobile_fe.xcworkspace/xcuserdata 2>/dev/null || true
          echo "✅ DerivedData + SPM cleaned"

      - name: Set NODE_BINARY
        script: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Apply provisioning profiles
        script: |
          # Tự sinh ExportOptions.plist TỪ profile Codemagic đã cài (khớp đúng
          # tên/UUID/bundle-id). Tránh lỗi "No iOS App Store profiles matching
          # 'aladin_appstore_profile'" do hardcode tên profile sai.
          xcode-project use-profiles --export-options-plist ios/ExportOptions.plist
          echo "✅ Profiles applied + ExportOptions.plist tự sinh"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null | head -5 || true
          echo "── ExportOptions.plist ──"; cat ios/ExportOptions.plist 2>/dev/null || true

      - name: Patch Xcode Project — fix MapLibre signature conflict
        script: |
          cat > fix_signature.rb <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/aladin_mobile_fe.xcodeproj')
          target = project.targets.find { |t| t.name == 'aladin_mobile_fe' }
          phase_name = 'Fix MapLibre Signature Bug'
          unless target.shell_script_build_phases.find { |p| p.name == phase_name }
            phase = project.new(Xcodeproj::Project::Object::PBXShellScriptBuildPhase)
            phase.name = phase_name
            phase.shell_script = 'find "$BUILD_DIR/${CONFIGURATION}-iphoneos" -name "*.signature" -delete 2>/dev/null || true'
            target.build_phases << phase
            project.save
            puts "✅ Added '#{phase_name}'"
          else
            puts "✅ '#{phase_name}' already exists"
          end
          RUBY
          ruby fix_signature.rb

      # ExportOptions.plist đã được "Apply provisioning profiles" tự sinh ở trên
      # (khớp đúng profile Codemagic cài) → KHÔNG hardcode nữa.

      - name: Bump build number (TestFlight latest + 1)
        script: |
          set -e
          # Tự tăng CFBundleVersion = build mới nhất trên TestFlight + 1 (mỗi lần
          # build sign → +1). Dùng App Store Connect API key (group app_store_connect).
          export APP_STORE_CONNECT_KEY_IDENTIFIER=5JA4K7A7JD
          export APP_STORE_CONNECT_ISSUER_ID=e56d98f1-e6f0-4e46-9ca8-29b30c2a9a7b
          export APP_STORE_CONNECT_PRIVATE_KEY="$APP_STORE_CONNECT_PRIVATE_KEY"
          # APP_STORE_APPLE_ID = Apple ID (số) của app — App Store Connect → App → App Information.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "⚠️  Không lấy được số TestFlight (thiếu APP_STORE_APPLE_ID?) — dùng số committed trong pbxproj + 1"
            LATEST=$(grep -m1 -E "CURRENT_PROJECT_VERSION = [0-9]+" ios/*.xcodeproj/project.pbxproj | grep -oE "[0-9]+")
          fi
          NEW=$(( LATEST + 1 ))
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${NEW};/g" ios/*.xcodeproj/project.pbxproj
          echo "✅ iOS build number → ${NEW} (TestFlight latest: ${LATEST})"

      - name: Build iOS Archive (signed)
        script: |
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          rm -rf "$ARCHIVE_PATH"
          mkdir -p "$IPA_OUTPUT_DIR"
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No xcworkspace"; ls -la ios/; exit 1
          fi
          LOG_FILE="$CM_BUILD_DIR/xcodebuild.log"

          find ios/Pods -name "*.signature" -delete 2>/dev/null || true
          find "$CM_BUILD_DIR/DerivedData" -name "*.signature" -delete 2>/dev/null || true

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            -skipPackagePluginValidation \
            archive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            SWIFT_VERSION=5.9 \
            CLANG_SCAN_DEPS_ENABLE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            'OTHER_LDFLAGS=$(inherited) -ObjC -lc++' \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ xcodebuild FAILED. Last 80 lines:"
            tail -80 "$LOG_FILE"
            exit $BUILD_EXIT
          fi
          echo "✅ Archive:"
          ls -lhd "$ARCHIVE_PATH"

      - name: Export signed IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_OUTPUT_DIR" \
            -exportOptionsPlist ios/ExportOptions.plist \
            2>&1 | tee "$CM_BUILD_DIR/export.log"

          EXPORT_EXIT=${PIPESTATUS[0]}
          if [ $EXPORT_EXIT -eq 0 ]; then
            echo "✅ IPA exported:"
            ls -lh "$IPA_OUTPUT_DIR"/*.ipa
          else
            echo "❌ Export failed — last 40 lines:"
            tail -40 "$CM_BUILD_DIR/export.log"
            exit $EXPORT_EXIT
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/OriLife.xcarchive/dSYMs/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: 5JA4K7A7JD
        issuer_id: e56d98f1-e6f0-4e46-9ca8-29b30c2a9a7b
        submit_to_testflight: false
        submit_to_app_store: true

  # ============================================================
  # Workflow 3: Android Debug APK — Demo / Direct Install
  # ============================================================
  android-debug-apk:
    name: Android Debug APK (Demo + Direct Install)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      java: 17
      groups:
        - scanner_secrets
      vars:
        APK_OUTPUT: $CM_BUILD_DIR/android/app/build/outputs/apk/debug

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: 'feat/foundation'
          include: true
        - pattern: 'feat/*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ENV=production
          ALADIN_API_URL=${BASE_API_URL:-https://staging-api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://test.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://test.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://test.orilife.io}
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://staging-api.orilife.io/captures/3d}
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-https://analytics.orilife.io}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-prod-analytics-key}
          EOF
          # Dọn whitespace lạc (tab/space) trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env created"

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

      - name: Create Android config (secrets + gradle.properties)
        script: |
          set -e
          # secrets.properties (gitignored) — API cho orilifesdk. Từ group scanner_secrets.
          cat > android/app/secrets.properties <<EOF
          TREE_DETECTION_API=${TREE_DETECTION_API:-https://staging-api.orilife.io/evidences/ingest}
          BASE_API_URL=${BASE_API_URL:-https://staging-api.orilife.io}
          API_KEY=${API_KEY:-mock-local-api-key}
          REGION_CODE=${REGION_CODE:-vn-south-01}
          EOF
          # gradle.properties (gitignored) — RN config. Debug dùng debug.keystore nên
          # KHÔNG cần upload signing ở đây.
          cat > android/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          EOF
          # Dọn whitespace lạc trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+([.\w]*))=[ \t]+/$1=/; s/[ \t]+$//' android/app/secrets.properties android/gradle.properties
          echo "✅ secrets.properties + gradle.properties created"

      - name: Build Rust core (Android)
        script: |
          set -e
          # PhoenixKey Enclave Rust core → libtaad_enclave_core.so per-ABI vào
          # android/app/src/main/jniLibs. PHẢI chạy TRƯỚC gradle (TaadEnclaveModule.kt
          # System.loadLibrary("taad_enclave_core")).
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk &> /dev/null || cargo install cargo-ndk

          # NDK: Codemagic đặt SDK ở ANDROID_SDK_ROOT; chọn NDK mới nhất.
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "❌ NDK không tìm thấy trong $ANDROID_SDK_ROOT/ndk"; exit 1
          fi

          ( cd rust/taad_enclave_core && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o ../../android/app/src/main/jniLibs \
              build --release --lib )

          echo "=== Rust Android outputs (jniLibs) ==="
          ls -lh android/app/src/main/jniLibs/*/ 2>/dev/null
          if [ ! -f android/app/src/main/jniLibs/arm64-v8a/libtaad_enclave_core.so ]; then
            echo "❌ libtaad_enclave_core.so (arm64-v8a) NOT built"; exit 1
          fi

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$CM_BUILD_DIR/android-debug.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Debug APK failed — last 60 lines:"
            tail -60 "$CM_BUILD_DIR/android-debug.log"
            exit $BUILD_EXIT
          fi

      - name: Locate + rename APK
        script: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK not found"
            find android/app/build/outputs -type f
            exit 1
          fi
          echo "✅ APK: $APK_FILE"
          ls -lh "$APK_FILE"
          mkdir -p $CM_BUILD_DIR/dist
          cp "$APK_FILE" $CM_BUILD_DIR/dist/aladin-debug.apk
          shasum -a 256 $CM_BUILD_DIR/dist/aladin-debug.apk

    artifacts:
      - dist/aladin-debug.apk
      - android-debug.log


  # ============================================================
  # Workflow 4: Android Signed AAB — Play Store Internal Testing
  # ============================================================
  android-appstore-aab:
    name: Android Signed AAB (Play Store Internal Testing)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      java: 17
      groups:
        - scanner_secrets
        - android_signing  # ORILIFE_UPLOAD_STORE_FILE_B64, passwords
      vars:
        AAB_OUTPUT: $CM_BUILD_DIR/android/app/build/outputs/bundle/release

    triggering:
      events: []  # Manual only — tránh build signed ngoài ý muốn

    scripts:
      - name: Create .env for React Native
        script: |
          cat > .env <<EOF
          ENV=production
          ALADIN_API_URL=${BASE_API_URL:-https://staging-api.orilife.io}
          ALADIN_API_KEY=${API_KEY:-mock-local-api-key}
          ALADIN_REGION_CODE=${REGION_CODE:-vn-south-01}
          PHOENIXKEY_API_URL=${PHOENIXKEY_API_URL:-https://api.phoenixkey.me/api/v1}
          PHOENIX_WALLET_ENABLED=${PHOENIX_WALLET_ENABLED:-false}
          ORILIFE_API_BASE_URL=${ORILIFE_API_BASE_URL:-https://test.orilife.io}
          ORILIFE_TREEID_URL=${ORILIFE_TREEID_URL:-https://test.orilife.io/TreeIdentity}
          ORILIFE_TREEID_BASE_URL=${ORILIFE_TREEID_BASE_URL:-https://test.orilife.io}
          MESHAPI_USE_MOCK=false
          LAMPNET_BASE_URL=${LAMPNET_BASE_URL:-https://lampnet.cloud}
          LAMPNET_UPLOAD_URL=${LAMPNET_UPLOAD_URL:-https://lampnet.cloud/mirage/put?mode=symmetric}
          CAPTURES_3D_URL=${CAPTURES_3D_URL:-https://staging-api.orilife.io/captures/3d}
          ANALYTICS_API_URL=${ANALYTICS_API_URL:-https://analytics.orilife.io}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-prod-analytics-key}
          EOF
          # Dọn whitespace lạc (tab/space) trong value biến môi trường Codemagic.
          perl -i -pe 's/^(\w+)=[ \t]+/$1=/; s/[ \t]+$//' .env
          echo "✅ .env (release)"

      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps --ignore-scripts
          npx patch-package --error-on-fail || echo "⚠️  patch-package: no patches or already applied"

      - name: Restore keystore from encrypted env
        script: |
          if [ -z "$ORILIFE_UPLOAD_STORE_FILE_B64" ]; then
            echo "❌ ORILIFE_UPLOAD_STORE_FILE_B64 chưa set trong group android_signing"
            echo "   base64 -i keySigning.bin | pbcopy → paste vào Codemagic"
            exit 1
          fi
          echo "$ORILIFE_UPLOAD_STORE_FILE_B64" | base64 -d > android/app/keySigning.bin
          ls -lh android/app/keySigning.bin
          echo "✅ Keystore restored"

      - name: Create Android config (secrets + gradle.properties + signing)
        script: |
          set -e
          # secrets.properties (gitignored) — API cho orilifesdk. Từ group scanner_secrets.
          cat > android/app/secrets.properties <<EOF
          TREE_DETECTION_API=${TREE_DETECTION_API:-https://staging-api.orilife.io/evidences/ingest}
          BASE_API_URL=${BASE_API_URL:-https://staging-api.orilife.io}
          API_KEY=${API_KEY:-mock-local-api-key}
          REGION_CODE=${REGION_CODE:-vn-south-01}
          EOF
          # gradle.properties (gitignored) — RN config + upload signing (group android_signing).
          # ORILIFE_UPLOAD_STORE_FILE=keySigning.bin (đã giải mã ở step trước).
          cat > android/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=false
          ORILIFE_UPLOAD_STORE_FILE=keySigning.bin
          ORILIFE_UPLOAD_KEY_ALIAS=${ORILIFE_UPLOAD_KEY_ALIAS}
          ORILIFE_UPLOAD_STORE_PASSWORD=${ORILIFE_UPLOAD_STORE_PASSWORD}
          ORILIFE_UPLOAD_KEY_PASSWORD=${ORILIFE_UPLOAD_KEY_PASSWORD}
          EOF
          perl -i -pe 's/^(\w+([.\w]*))=[ \t]+/$1=/; s/[ \t]+$//' android/app/secrets.properties android/gradle.properties
          echo "✅ secrets.properties + gradle.properties (signing) created"

      - name: Verify gradle.properties signing config
        script: |
          grep -E "ORILIFE_UPLOAD_STORE_FILE|ORILIFE_UPLOAD_KEY_ALIAS" android/gradle.properties \
            || { echo "❌ gradle.properties thiếu signing config"; exit 1; }
          echo "✅ gradle.properties signing OK"

      - name: Build Rust core (Android)
        script: |
          set -e
          # PhoenixKey Enclave Rust core → libtaad_enclave_core.so per-ABI vào
          # android/app/src/main/jniLibs. PHẢI chạy TRƯỚC gradle (TaadEnclaveModule.kt
          # System.loadLibrary). Thiếu step này → AAB không có .so → tính năng Enclave chết.
          if ! command -v rustc &> /dev/null; then
            echo "🦀 Cài Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk &> /dev/null || cargo install cargo-ndk
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort | tail -1)
          if [ -z "$ANDROID_NDK_HOME" ]; then echo "❌ NDK không tìm thấy"; exit 1; fi
          ( cd rust/taad_enclave_core && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o ../../android/app/src/main/jniLibs \
              build --release --lib )
          if [ ! -f android/app/src/main/jniLibs/arm64-v8a/libtaad_enclave_core.so ]; then
            echo "❌ libtaad_enclave_core.so (arm64-v8a) NOT built"; exit 1
          fi

      - name: Bump versionCode (base + Codemagic BUILD_NUMBER)
        script: |
          set -e
          # versionCode = versionCode committed (base) + BUILD_NUMBER của Codemagic.
          # BUILD_NUMBER tự tăng mỗi build (monotonic) → KHÔNG phụ thuộc Google Play
          # credentials, không bao giờ trùng. Luôn > base (70) trên Play.
          BASE=$(grep -m1 -E "versionCode [0-9]+" android/app/build.gradle | grep -oE "[0-9]+")
          NEW=$(( BASE + ${BUILD_NUMBER:-1} ))
          sed -i -E "s/versionCode [0-9]+/versionCode ${NEW}/" android/app/build.gradle
          echo "✅ Android versionCode → ${NEW} (base=${BASE}, BUILD_NUMBER=${BUILD_NUMBER:-1})"

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon 2>&1 | tee "$CM_BUILD_DIR/android-release.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ AAB failed — last 60 lines:"
            tail -60 "$CM_BUILD_DIR/android-release.log"
            exit $BUILD_EXIT
          fi

      - name: Locate + verify AAB
        script: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "❌ AAB not found"
            find android/app/build/outputs -type f
            exit 1
          fi
          echo "✅ AAB: $AAB_FILE"
          ls -lh "$AAB_FILE"
          mkdir -p $CM_BUILD_DIR/dist
          cp "$AAB_FILE" $CM_BUILD_DIR/dist/aladin-release.aab
          shasum -a 256 $CM_BUILD_DIR/dist/aladin-release.aab

    artifacts:
      - dist/aladin-release.aab
      - android-release.log

    # Publishing lên Google Play TẠM TẮT — service account credentials
    # ($GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) chưa cấu hình (JSON rỗng → build fail ở
    # bước prep). AAB đã sign vẫn có trong artifacts để tải/upload tay.
    # Bật lại khi có credentials hợp lệ: bỏ comment block dưới.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
