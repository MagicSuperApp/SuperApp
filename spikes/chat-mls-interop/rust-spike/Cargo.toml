[package]
name = "chat_mls_spike"
version = "0.0.0"
edition = "2021"

# Pha 0 spike: đối chiếu tầng 2 (HKDF/AES) + tầng 3 (Poseidon/Ed25519) của bản
# Rust với golden vectors do ts-mls/circomlibjs sinh ra (../node-harness/vectors.json).
# KHÔNG phải code production — chỉ để chứng minh khớp byte-for-byte.

[[bin]]
name = "verify_vectors"
path = "src/main.rs"

[dependencies]
# Tầng 2 — message-layer
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

# Tầng 3 — Merkle
blake2 = "0.10"                                   # blake2b-256 cho strToField
ed25519-dalek = "2"                               # session signature (tweetnacl-compatible)
light-poseidon = "0.2"                            # Poseidon BN254, khớp circomlib
ark-bn254 = "0.4"
ark-ff = "0.4"

# Tiện ích
hex = "0.4"
base64 = "0.22"
serde_json = "1"

[profile.dev]
opt-level = 2   # arkworks quá chậm ở opt-level 0
